<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StealthPop Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo-wrap">
          <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="title">StealthPop Guard</h1>
          <span class="version">v1.0.0 • Mode Siluman</span>
        </div>
      </div>
      <div class="stealth-badge" id="stealthBadge">
        <span class="pulse-dot"></span>
        <span class="stealth-text">Tak Terdeteksi</span>
      </div>
    </div>

    <!-- Toggle Section -->
    <div class="toggle-section">
      <div class="toggle-info">
        <span class="toggle-label" id="statusLabel">Proteksi Aktif</span>
        <span class="toggle-desc">Mencegat pop-up klik tanpa memicu anti-adblock</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="powerToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value" id="currentTabBlocked">0</div>
        <div class="stat-name">Tab Ini</div>
      </div>
      <div class="stat-box highlight">
        <div class="stat-value" id="totalBlocked">0</div>
        <div class="stat-name">Total Diblokir</div>
      </div>
    </div>

    <!-- Current Site Section -->
    <div class="site-section">
      <div class="site-info">
        <span class="site-title">Situs Saat Ini:</span>
        <span class="site-host" id="currentDomain">Memuat...</span>
      </div>
      <button class="btn-whitelist" id="whitelistBtn">
        <span id="whitelistBtnText">Kecualikan Situs Ini</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Ringan (< 50 KB) • 0% CPU Idle</span>
      <a href="#" id="openTestPage" class="test-link">Buka Halaman Uji</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
