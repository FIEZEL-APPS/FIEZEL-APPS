<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIEZEL — Studio Panggilan Suara AI & Real-Time Speaking</title>
    <meta
      name="description"
      content="Sub-modul terisolasi FIEZEL AI Voice Call Studio dengan terjemahan real-time, bantuan jawaban pemula, Gemini Live WebSocket (wss://fiezel.my.id/api/live-call) + fallback Turn-by-Turn Audio, serta integrasi Braincore BKT & IRT 3PL."
    />
    <link rel="icon" type="image/svg+xml" href="../../assets/brand/fiezel-icon.svg" />
    <link rel="stylesheet" href="./dist/voice-studio.css?v=m025-693" />
    <script src="../../core-config.js?v=m025-693" defer></script>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
        -webkit-overflow-scrolling: auto;
      }
      #fiezel-voice-studio-root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-[#FFF9EE] text-[#241A11] antialiased h-full w-full overflow-hidden fixed inset-0">
    <div id="fiezel-voice-studio-root"></div>
    <script>
      (function () {
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (!reg) return;
            reg.update().catch(function () {});
            if (reg.waiting) {
              try { reg.waiting.postMessage({ type: 'FIEZEL_SKIP_WAITING' }); } catch (_) {}
            }
            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    try { newWorker.postMessage({ type: 'FIEZEL_SKIP_WAITING' }); } catch (_) {}
                  }
                });
              }
            });
          }).catch(function () {});
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!window.__fzRefreshed) {
              window.__fzRefreshed = true;
              if (typeof caches !== 'undefined' && caches.keys) {
                caches.keys().then(function (keys) {
                  var oldShells = keys.filter(function (k) { return k.indexOf('fiezel-shell-') === 0; });
                  return Promise.all(oldShells.map(function (k) { return caches.delete(k); }));
                }).catch(function () {}).then(function () {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          });
        }
      })();
    </script>
    <script type="module" src="./dist/voice-studio.js?v=m025-693"></script>
  </body>
</html>
