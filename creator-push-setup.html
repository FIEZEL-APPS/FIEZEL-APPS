<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIEZEL Push Setup</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:10px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.card{padding:20px;border:1px solid #ddd;border-radius:16px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:10px}</style></head><body><h1>FIEZEL Core Brain + Push Setup</h1><p>Halaman operator. Login dengan akun Puter yang memiliki Worker, lalu simpan VAPID public key dan scheduler token ke KV milik Worker.</p><div class="card"><label>Worker URL</label><input id="worker" placeholder="https://fiezel-core.puter.work"><label>VAPID public key</label><input id="pub" autocomplete="off"><label>Reminder cron token</label><input id="token" type="password" autocomplete="new-password"><button id="save">Login Puter & konfigurasi Worker</button><pre id="out">Belum dikonfigurasi.</pre></div><script src="https://js.puter.com/v2/"></script><script>const $=id=>document.getElementById(id);$('save').onclick=async()=>{try{await puter.auth.signIn();const base=$('worker').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9_-]+\.puter\.work$/i.test(base))throw new Error('Worker URL harus HTTPS .puter.work');const r=await puter.workers.exec(base+'/api/admin/configure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vapidPublicKey:$('pub').value.trim(),cronToken:$('token').value.trim()})});const text=await r.text();$('out').textContent=`HTTP ${r.status}\n${text}`;}catch(e){$('out').textContent='Gagal: '+(e?.message||e)}};</script></body></html>
