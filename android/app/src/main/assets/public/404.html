<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FIEZEL — Halaman tidak ditemukan</title>
<script>
/* GitHub Pages project site ini hidup di /FIEZEL-APPS/ dan path-nya case-sensitive.
   Pengguna yang mengetik fiezel-apps.github.io/fiezel-apps (huruf kecil) mendarat di 404 ini.
   Bila segmen repo pada path cocok dengan "fiezel-apps" tanpa memedulikan besar-kecil huruf
   tetapi penulisannya belum persis "FIEZEL-APPS", perbaiki case segmen itu dan alihkan
   otomatis — query string dan hash dipertahankan apa adanya. Redirect dijalankan sebelum
   render supaya pengguna nyaris tidak melihat halaman ini. */
(function () {
  var CANON = 'FIEZEL-APPS';
  try {
    var segs = window.location.pathname.split('/');
    if (segs.length > 1 && segs[1] !== CANON && segs[1].toLowerCase() === CANON.toLowerCase()) {
      segs[1] = CANON;
      window.location.replace(segs.join('/') + window.location.search + window.location.hash);
    }
  } catch (_) { /* biarkan fallback manual di bawah yang bekerja */ }
})();
</script>
<style>

  :root { --core: #1B1418; --on-core: #FDFAF3; --cream: #FFF9EE; --sun: #FFC700; --sun-deep: #E6A800; --text: #241A11; --muted: #6E5E47; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 420px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 72px; height: 72px; border-radius: 22px;
    background: var(--core); color: var(--sun);
    font-size: 30px; font-weight: 800; letter-spacing: .5px;
    margin-bottom: 20px;
  }
  h1 { font-size: 24px; line-height: 1.25; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.6; color: var(--muted); margin-bottom: 24px; }
  a.cta {
    display: inline-block;
    background: var(--sun); color: var(--text);
    text-decoration: none; font-weight: 700; font-size: 16px;
    border: 2px solid var(--text); box-shadow: 0 3px 0 var(--sun-deep);
    padding: 12px 26px; border-radius: 999px;
  }
  a.cta:active { opacity: .85; }
  .hint { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
  .hint a.site { color: var(--text); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--sun); }
  a:focus-visible, .cta:focus-visible { outline: 2px solid #A67A00; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="badge" aria-hidden="true">F</div>

  <p>Alamat yang kamu buka tidak ada di sini. Bila kamu mengetik alamat dengan huruf kecil,
     kami akan mengalihkanmu otomatis — atau lanjut lewat tombol di bawah.</p>
  <a class="cta" href="/FIEZEL-APPS/">Buka FIEZEL</a>
  <p class="hint">FIEZEL Personal English OS · fiezel-apps.github.io/FIEZEL-APPS</p>
  <p class="hint"><a class="site" href="https://fiezel.my.id/">Situs resmi: fiezel.my.id</a></p>
</main>
