<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- m025-561: halaman satelit tanpa skrip inline dan tanpa CDN. Versi sebelumnya memuat
       Tailwind dan Google Fonts dari jaringan, padahal halaman ini diprecache service worker:
       begitu luring, permainannya tampil tanpa gaya sama sekali. Semua gaya kini lokal. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
  <title>Undercover — FIEZEL</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./favicon-64.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#0b0817">
  <style>
    @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:400;font-display:swap;src:url('./assets/fonts/PlusJakartaSans-400.woff2') format('woff2')}
    @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500;font-display:swap;src:url('./assets/fonts/PlusJakartaSans-500.woff2') format('woff2')}
    @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:600;font-display:swap;src:url('./assets/fonts/PlusJakartaSans-600.woff2') format('woff2')}
    @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:700;font-display:swap;src:url('./assets/fonts/PlusJakartaSans-700.woff2') format('woff2')}
    /* 800 = berkas 700 yang sama, dipadukan dengan font-synthesis:none di bawah: heading
       meminta bobot 800 tanpa pernah memicu bold tiruan (faux-bold) dari peramban. */
    @font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:800;font-display:swap;src:url('./assets/fonts/PlusJakartaSans-700.woff2') format('woff2')}
    @font-face{font-family:'Noto Sans Thai Looped';font-style:normal;font-weight:400;font-display:swap;src:url('./assets/fonts/NotoSansThaiLooped-400.woff2') format('woff2')}
    @font-face{font-family:'Noto Sans Thai Looped';font-style:normal;font-weight:600;font-display:swap;src:url('./assets/fonts/NotoSansThaiLooped-600.woff2') format('woff2')}
    @font-face{font-family:'Noto Sans Thai Looped';font-style:normal;font-weight:700;font-display:swap;src:url('./assets/fonts/NotoSansThaiLooped-700.woff2') format('woff2')}

    :root{
      --uc-obsidian:#0b0817;
      --uc-obsidian-2:#130f28;
      --uc-glass:rgba(255,255,255,.045);
      --uc-glass-2:rgba(255,255,255,.075);
      --uc-line:rgba(255,255,255,.1);
      --uc-line-2:rgba(255,255,255,.18);
      --uc-cyan:#00f5d4;
      --uc-amethyst:#7928ca;
      --uc-amber:#ffbe0b;
      --uc-crimson:#ff0054;
      --uc-text:#f4f2ff;
      --uc-muted:#a7a2c9;
      --uc-dim:#7d78a3;
      --uc-sans:'Plus Jakarta Sans','Noto Sans Thai Looped',system-ui,-apple-system,'Segoe UI',sans-serif;
      --uc-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
      --uc-r:18px;
      --uc-ease-spring:cubic-bezier(.34,1.56,.64,1);
      --uc-ease-out:cubic-bezier(.16,1,.3,1);
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--uc-obsidian);overscroll-behavior:none}
    body{
      height:100dvh;color:var(--uc-text);font-family:var(--uc-sans);font-synthesis:none;
      -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
      user-select:none;-webkit-user-select:none;touch-action:manipulation;
    }
    button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
    button:disabled{cursor:default}
    [hidden]{display:none !important}
    :focus-visible{outline:2px solid var(--uc-cyan);outline-offset:2px;border-radius:10px}
    .uc-mono{font-family:var(--uc-mono);letter-spacing:.04em}
    .uc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    /* ---------- kerangka 100dvh ---------- */
    .uc-app{
      position:relative;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
      padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));overflow:hidden;isolation:isolate;
    }
    .uc-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
      background:
        radial-gradient(60% 40% at 15% 0%,rgba(121,40,202,.38),transparent 70%),
        radial-gradient(50% 35% at 100% 18%,rgba(0,245,212,.16),transparent 70%),
        radial-gradient(70% 45% at 50% 110%,rgba(255,0,84,.18),transparent 70%),
        linear-gradient(180deg,var(--uc-obsidian) 0%,var(--uc-obsidian-2) 55%,var(--uc-obsidian) 100%)}
    .uc-bg::before{content:'';position:absolute;inset:-50%;
      background-image:linear-gradient(rgba(0,245,212,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,212,.06) 1px,transparent 1px);
      background-size:34px 34px;transform:perspective(600px) rotateX(58deg) translateY(10%);transform-origin:50% 100%;
      animation:uc-grid-drift 18s linear infinite;mask-image:linear-gradient(180deg,transparent 30%,#000 70%)}
    .uc-bg::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
    @keyframes uc-grid-drift{to{background-position:0 34px,34px 0}}
    .uc-app[data-phase="tribunal"] .uc-bg{filter:brightness(.55) saturate(1.3)}
    .uc-app[data-phase="showdown"] .uc-bg{filter:brightness(.7) saturate(1.2)}
    .uc-app[data-phase="showdown"] .uc-bg::after{background:radial-gradient(60% 45% at 50% 45%,rgba(255,0,84,.22),transparent 70%),repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}

    .uc-glass{background:linear-gradient(180deg,var(--uc-glass-2),var(--uc-glass));border:1px solid var(--uc-line);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

    /* ---------- bar atas ---------- */
    .uc-top{display:flex;align-items:center;gap:8px;height:44px;flex:0 0 auto}
    .uc-icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;text-decoration:none;color:var(--uc-text);
      background:var(--uc-glass-2);border:1px solid var(--uc-line);transition:transform .12s ease,border-color .2s}
    .uc-icon-btn:active,.uc-sfx:active,.uc-peek:active{transform:scale(.92)}
    .uc-icon-btn svg{width:18px;height:18px}
    .uc-top-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.1}
    .uc-top-title .uc-code{font-family:var(--uc-mono);font-size:10px;color:var(--uc-cyan);letter-spacing:.18em;text-shadow:0 0 12px rgba(0,245,212,.6)}
    .uc-top-title strong{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-peek{height:32px;padding:0 10px;border-radius:11px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
      background:linear-gradient(135deg,rgba(121,40,202,.55),rgba(0,245,212,.2));border:1px solid rgba(0,245,212,.45);box-shadow:0 0 16px rgba(0,245,212,.25)}
    .uc-sfx{height:32px;padding:0 9px;border-radius:11px;font-family:var(--uc-mono);font-size:10px;font-weight:700;letter-spacing:.08em;
      border:1px solid rgba(255,190,11,.5);color:var(--uc-amber);background:rgba(255,190,11,.08)}
    .uc-sfx[aria-pressed="false"]{color:var(--uc-dim);border-color:var(--uc-line);background:var(--uc-glass)}

    .uc-stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
    .uc-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;animation:uc-screen-in .45s var(--uc-ease-out) both}
    @keyframes uc-screen-in{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

    .uc-kicker{font-family:var(--uc-mono);font-size:10px;letter-spacing:.2em;color:var(--uc-cyan)}
    .uc-h1{font-size:22px;font-weight:800;margin:2px 0 4px;letter-spacing:-.01em}
    .uc-sub{font-size:12.5px;color:var(--uc-muted);margin:0;line-height:1.4}
    .uc-label{font-family:var(--uc-mono);font-size:10px;letter-spacing:.14em;color:var(--uc-dim);text-transform:uppercase}

    .uc-cta{position:relative;width:100%;height:52px;border-radius:16px;font-size:14px;font-weight:800;letter-spacing:.02em;overflow:hidden;
      background:linear-gradient(100deg,var(--uc-crimson),var(--uc-amethyst) 50%,var(--uc-cyan));color:#fff;
      box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 10px 30px rgba(121,40,202,.45),0 0 26px rgba(0,245,212,.25);transition:transform .12s ease,filter .2s}
    .uc-cta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:uc-sheen 2.6s ease-in-out infinite}
    @keyframes uc-sheen{60%,100%{transform:translateX(120%)}}
    .uc-cta:active{transform:scale(.97)}
    .uc-cta:disabled{filter:grayscale(.85) brightness(.7);box-shadow:none}
    .uc-cta:disabled::after{display:none}
    .uc-btn{height:44px;padding:0 16px;border-radius:14px;font-size:13px;font-weight:700;background:var(--uc-glass-2);border:1px solid var(--uc-line-2);transition:transform .12s}
    .uc-btn:active{transform:scale(.96)}

    /* ---------- BABAK 1 · LOBI ---------- */
    .uc-lobby{gap:10px;padding-top:4px}
    .uc-lobby-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
    .uc-lobby-body::-webkit-scrollbar{display:none}
    .uc-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .uc-mode{position:relative;text-align:left;padding:10px 11px;border-radius:var(--uc-r);min-height:92px;display:flex;flex-direction:column;gap:3px;transition:transform .15s,border-color .2s,box-shadow .2s}
    .uc-mode .uc-mode-ico{font-size:20px;line-height:1}
    .uc-mode b{font-size:14px;font-weight:800}
    .uc-mode span.uc-mode-sub{font-size:11px;color:var(--uc-muted);line-height:1.3}
    .uc-mode[aria-checked="true"]{border-color:rgba(0,245,212,.7);box-shadow:0 0 0 1px rgba(0,245,212,.35) inset,0 0 22px rgba(0,245,212,.22)}
    .uc-mode[aria-checked="true"]::after{content:'';position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--uc-cyan);box-shadow:0 0 10px var(--uc-cyan)}
    .uc-seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;gap:4px}
    .uc-seg button{height:36px;border-radius:10px;font-size:12px;font-weight:700;color:var(--uc-muted);transition:background .2s,color .2s}
    .uc-seg button[aria-checked="true"]{background:linear-gradient(135deg,var(--uc-amethyst),#4c1d95);color:#fff;box-shadow:0 0 14px rgba(121,40,202,.5)}
    .uc-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .uc-link{font-size:12px;font-weight:700;color:var(--uc-cyan);padding:4px 2px}
    .uc-dossiers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .uc-dossier{position:relative;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:16px;min-height:66px;overflow:hidden}
    .uc-dossier::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--uc-cyan),var(--uc-amethyst))}
    .uc-dossier.is-empty{border-style:dashed;background:transparent;box-shadow:none;justify-content:center}
    .uc-dossier.is-empty::before{display:none}
    .uc-dossier .uc-mini-av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto;
      background:linear-gradient(135deg,hsl(var(--hue,182) 90% 55% / .9),hsl(calc(var(--hue,182) + 60) 80% 40% / .9));box-shadow:0 0 14px hsl(var(--hue,182) 90% 55% / .45)}
    .uc-dossier .uc-meta{min-width:0;display:flex;flex-direction:column;line-height:1.2}
    .uc-dossier .uc-meta .uc-mono{font-size:9.5px;color:var(--uc-dim)}
    .uc-dossier .uc-meta b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-dossier .uc-meta small{font-size:10.5px;color:var(--uc-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-ready{position:absolute;top:7px;right:8px;font-family:var(--uc-mono);font-size:9px;font-weight:700;color:#06221d;background:var(--uc-cyan);padding:1px 5px;border-radius:5px;box-shadow:0 0 10px rgba(0,245,212,.55)}
    .uc-kick{position:absolute;bottom:6px;right:7px;width:22px;height:22px;border-radius:7px;font-size:12px;color:var(--uc-muted);background:rgba(255,255,255,.06)}
    .uc-add{font-size:12.5px;font-weight:700;color:var(--uc-cyan);padding:10px}
    .uc-dossier.is-matching{animation:uc-match-pulse .5s ease both}
    @keyframes uc-match-pulse{0%{box-shadow:0 0 0 0 rgba(0,245,212,.0)}40%{box-shadow:0 0 0 2px rgba(0,245,212,.8),0 0 28px rgba(0,245,212,.5)}100%{box-shadow:0 0 0 0 rgba(0,245,212,0)}}
    .uc-ptable{position:relative;flex:1 1 0;min-height:0;container-type:size;display:grid;place-items:center;overflow:hidden}
    .uc-ptable-ring{position:relative;width:min(80cqw,128cqh);height:min(50cqw,76cqh);border-radius:50%;
      background:radial-gradient(circle at 50% 45%,rgba(121,40,202,.32),rgba(11,8,23,.2) 70%);border:1px solid rgba(0,245,212,.35);
      box-shadow:0 0 0 8px rgba(0,245,212,.03),0 0 50px rgba(121,40,202,.3) inset,0 0 30px rgba(0,245,212,.12)}
    .uc-ptable-ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,245,212,.22),transparent 14%,transparent);animation:uc-spin 5s linear infinite}
    .uc-ptable-ring::after{content:'';position:absolute;inset:16%;border-radius:50%;border:1px dashed rgba(0,245,212,.22)}
    .uc-ptable-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
    .uc-ptable-core .uc-mono{font-size:clamp(8px,4cqh,11px);color:var(--uc-cyan);letter-spacing:.18em}
    .uc-ptable-core b{font-size:clamp(11px,8cqh,20px);font-weight:800}
    .uc-pdot{position:absolute;width:clamp(16px,15cqh,34px);height:clamp(16px,15cqh,34px);margin:calc(clamp(16px,15cqh,34px) / -2) 0 0 calc(clamp(16px,15cqh,34px) / -2);border-radius:50%;
      display:grid;place-items:center;font-size:clamp(8px,7cqh,14px);font-weight:800;color:#0b0817;border:1px dashed rgba(255,255,255,.3);transition:background .3s,box-shadow .3s}
    .uc-pdot.is-on{border:0;background:radial-gradient(circle at 35% 30%,hsl(var(--hue) 95% 70%),hsl(var(--hue) 80% 40%));box-shadow:0 0 14px hsl(var(--hue) 90% 55% / .7);animation:uc-pop .4s var(--uc-ease-spring) both}
    .uc-receipt{padding:9px 11px;border-radius:14px;font-size:11.5px;color:var(--uc-muted);line-height:1.45}
    .uc-receipt b{color:var(--uc-text);font-weight:700}
    .uc-matching{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--uc-mono);font-size:11px;color:var(--uc-cyan);height:16px}
    .uc-matching i{width:6px;height:6px;border-radius:50%;background:var(--uc-cyan);animation:uc-blink 1s infinite}
    .uc-matching i:nth-child(2){animation-delay:.15s}.uc-matching i:nth-child(3){animation-delay:.3s}
    @keyframes uc-blink{0%,100%{opacity:.2}50%{opacity:1}}

    /* ---------- BABAK 2 · DOSSIER 3D ---------- */
    .uc-reveal{align-items:center;justify-content:space-between;text-align:center;padding:6px 0 4px;gap:8px}
    .uc-card-wrap{perspective:1000px;width:min(248px,62vw);height:min(330px,41dvh);flex:0 0 auto}
    .uc-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s var(--uc-ease-spring)}
    .uc-card.is-flipped{transform:rotateY(180deg)}
    .uc-face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:8px;border:1px solid var(--uc-line-2)}
    .uc-face-front{background:
        repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 8px,transparent 8px 16px),
        linear-gradient(160deg,#2a1858,#140d2e 60%,#0b0817);
      box-shadow:0 0 0 1px rgba(121,40,202,.6) inset,0 20px 50px rgba(0,0,0,.6),0 0 40px rgba(121,40,202,.35)}
    .uc-stamp-ts{font-family:var(--uc-mono);font-weight:700;font-size:20px;letter-spacing:.16em;color:var(--uc-crimson);border:3px solid var(--uc-crimson);
      padding:4px 12px;border-radius:8px;transform:rotate(-10deg);text-shadow:0 0 10px rgba(255,0,84,.6);box-shadow:0 0 18px rgba(255,0,84,.35)}
    .uc-face-front .uc-seal{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:30px;
      background:radial-gradient(circle at 35% 30%,rgba(0,245,212,.35),rgba(121,40,202,.25) 60%,transparent 70%);border:1px solid rgba(0,245,212,.4)}
    .uc-face-front small{font-family:var(--uc-mono);font-size:10px;letter-spacing:.14em;color:var(--uc-muted)}
    .uc-face-back{transform:rotateY(180deg);justify-content:space-between;
      background:radial-gradient(120% 80% at 50% 0%,rgba(0,245,212,.18),transparent 60%),linear-gradient(170deg,#1a1240,#0d0920);
      box-shadow:0 0 0 1px rgba(0,245,212,.55) inset,0 20px 50px rgba(0,0,0,.6),0 0 46px rgba(0,245,212,.3)}
    .uc-face-back.is-spy{background:radial-gradient(120% 80% at 50% 0%,rgba(255,0,84,.24),transparent 60%),linear-gradient(170deg,#2a0b22,#0d0920);box-shadow:0 0 0 1px rgba(255,0,84,.6) inset,0 20px 50px rgba(0,0,0,.6),0 0 46px rgba(255,0,84,.3)}
    .uc-face-back.is-white{background:radial-gradient(120% 80% at 50% 0%,rgba(255,190,11,.2),transparent 60%),linear-gradient(170deg,#2a2208,#0d0920);box-shadow:0 0 0 1px rgba(255,190,11,.55) inset,0 20px 50px rgba(0,0,0,.6),0 0 46px rgba(255,190,11,.25)}
    .uc-role-badge{font-family:var(--uc-mono);font-weight:700;font-size:12px;letter-spacing:.16em;padding:5px 12px;border-radius:999px;border:1px solid currentColor}
    .uc-role-badge.civ{color:var(--uc-cyan);background:rgba(0,245,212,.1)}
    .uc-role-badge.spy{color:#ff5c8f;background:rgba(255,0,84,.12)}
    .uc-role-badge.white{color:var(--uc-amber);background:rgba(255,190,11,.1)}
    .uc-word{font-family:var(--uc-mono);font-weight:700;font-size:28px;letter-spacing:.05em;line-height:1.05;word-break:break-word;text-shadow:0 0 18px rgba(255,255,255,.35)}
    .uc-gloss{font-size:13px;color:var(--uc-muted);margin-top:4px}
    .uc-mission{font-size:11.5px;line-height:1.4;color:var(--uc-muted)}
    .uc-scan-zone{display:flex;flex-direction:column;align-items:center;gap:6px}
    .uc-scanner{position:relative;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
      background:radial-gradient(circle,rgba(0,245,212,.16),rgba(11,8,23,.9) 70%);border:1px solid rgba(0,245,212,.45);box-shadow:0 0 24px rgba(0,245,212,.25)}
    .uc-scanner svg.uc-fp{width:46px;height:46px;color:var(--uc-cyan);filter:drop-shadow(0 0 6px rgba(0,245,212,.7))}
    .uc-scanner svg.uc-ring{position:absolute;inset:-5px;width:96px;height:96px;transform:rotate(-90deg)}
    .uc-scanner svg.uc-ring circle{fill:none;stroke-width:3}
    .uc-scanner .uc-laser{position:absolute;left:12%;right:12%;height:2px;top:50%;background:var(--uc-crimson);box-shadow:0 0 10px var(--uc-crimson),0 0 22px var(--uc-crimson);opacity:0}
    .uc-scanner.is-scanning .uc-laser{opacity:1;animation:uc-laser .6s ease-in-out infinite alternate}
    @keyframes uc-laser{from{top:18%}to{top:82%}}
    .uc-scanner.is-done{border-color:var(--uc-cyan);box-shadow:0 0 30px rgba(0,245,212,.6)}
    .uc-scan-label{font-family:var(--uc-mono);font-size:10.5px;letter-spacing:.08em;color:var(--uc-muted)}

    /* ---------- BABAK 3-5 · MEJA ---------- */
    .uc-table{gap:6px}
    .uc-status{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;border-radius:13px;flex:0 0 auto}
    .uc-round{font-family:var(--uc-mono);font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 7px;border-radius:7px;color:#06221d;background:var(--uc-cyan)}
    .uc-status-text{flex:1;min-width:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-timer{position:relative;width:30px;height:30px;flex:0 0 auto}
    .uc-timer svg{width:30px;height:30px;transform:rotate(-90deg)}
    .uc-timer circle{fill:none;stroke-width:3}
    .uc-timer .uc-timer-track{stroke:rgba(255,255,255,.1)}
    .uc-timer .uc-timer-bar{stroke:var(--uc-cyan);stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s}
    .uc-timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--uc-mono);font-size:10.5px;font-weight:700}
    .uc-timer.is-pulse{animation:uc-pulse .35s ease}
    .uc-timer.is-urgent .uc-timer-bar{stroke:var(--uc-crimson)}
    .uc-timer.is-urgent b{color:#ff6b9a}
    @keyframes uc-pulse{50%{transform:scale(1.16)}}

    .uc-arena{position:relative;flex:1 1 auto;min-height:220px;container-type:size;border-radius:24px}
    .uc-felt{position:absolute;left:50%;top:50%;width:var(--fw,58%);height:var(--fh,52%);transform:translate(-50%,-50%);border-radius:50%;
      background:radial-gradient(circle at 50% 40%,rgba(121,40,202,.35),rgba(19,15,40,.95) 70%);
      border:1px solid rgba(0,245,212,.25);box-shadow:0 0 0 6px rgba(255,255,255,.02),0 0 60px rgba(121,40,202,.35) inset,0 0 40px rgba(0,245,212,.12);
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;gap:3px}
    .uc-felt::before{content:'';position:absolute;inset:10%;border-radius:50%;border:1px dashed rgba(0,245,212,.2);animation:uc-spin 30s linear infinite}
    @keyframes uc-spin{to{transform:rotate(360deg)}}
    .uc-holo-code{font-family:var(--uc-mono);font-size:9px;letter-spacing:.18em;color:var(--uc-cyan)}
    .uc-holo-main{font-size:clamp(11px,4cqw,15px);font-weight:800;line-height:1.2;max-width:100%}
    .uc-holo-sub{font-size:10px;color:var(--uc-muted)}
    .uc-spot{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:1;transform:rotate(var(--spot,90deg));transition:transform .7s var(--uc-ease-out),opacity .4s}
    .uc-spot::before{content:'';position:absolute;left:0;top:-34px;width:var(--spot-len,40cqmin);height:68px;transition:width .7s var(--uc-ease-out);
      background:linear-gradient(90deg,rgba(0,245,212,.0),rgba(0,245,212,.28));clip-path:polygon(0 50%,100% 0,100% 100%);filter:blur(3px)}
    .uc-spot.is-busted::before{background:linear-gradient(90deg,rgba(255,0,84,0),rgba(255,0,84,.55));height:96px;top:-48px}
    .uc-spot.is-off{opacity:0}
    .uc-app[data-phase="tribunal"] .uc-arena::after{content:'';position:absolute;inset:-6px;border-radius:28px;pointer-events:none;z-index:3;
      background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(5,2,12,.55) 80%);animation:uc-dread 1.7s ease-in-out infinite}
    @keyframes uc-dread{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,0,84,.15)}50%{box-shadow:inset 0 0 40px rgba(255,0,84,.35)}}

    .uc-seat{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;width:clamp(76px,25cqw,100px);
      display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:4px 2px;border-radius:16px;transition:transform .25s,filter .3s,opacity .3s}
    .uc-seat:disabled{cursor:default}
    .uc-seat.is-target{background:rgba(0,245,212,.08);box-shadow:0 0 0 1px rgba(0,245,212,.45)}
    .uc-seat::before{content:'';position:absolute;left:50%;top:30%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;z-index:-1;
      background:radial-gradient(circle,rgba(0,245,212,.32),transparent 65%);opacity:0;transition:opacity .4s,transform .5s var(--uc-ease-out)}
    .uc-seat.is-speaking::before{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .uc-app[data-phase="tribunal"] .uc-seat.is-busted::before{opacity:1;transform:translate(-50%,-50%) scale(1.15);background:radial-gradient(circle,rgba(255,0,84,.5),transparent 65%)}
    .uc-av{position:relative;width:clamp(42px,13.5cqmin,60px);height:clamp(42px,13.5cqmin,60px)}
    .uc-av-face{position:absolute;inset:3px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:clamp(15px,5cqmin,22px);
      background:radial-gradient(circle at 35% 30%,hsl(var(--hue) 95% 70%),hsl(var(--hue) 80% 38%) 70%);color:#0b0817;
      box-shadow:0 0 0 2px #0b0817,0 0 0 3px hsl(var(--hue) 90% 60% / .9),0 0 18px hsl(var(--hue) 90% 55% / .55)}
    .uc-seat.is-me .uc-av-face{background:radial-gradient(circle at 35% 30%,#fff,#9ef8e8 40%,#00a58e 80%)}
    .uc-av::before,.uc-av::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--uc-cyan);opacity:0;pointer-events:none}
    .uc-seat.is-speaking .uc-av::before{animation:uc-ripple 1.3s ease-out infinite}
    .uc-seat.is-speaking .uc-av::after{animation:uc-ripple 1.3s ease-out .65s infinite;border-color:var(--uc-amber)}
    @keyframes uc-ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.75);opacity:0}}
    .uc-av-no{position:absolute;top:-4px;left:-8px;font-family:var(--uc-mono);font-size:9px;font-weight:700;padding:1px 4px;border-radius:5px;background:#0b0817;border:1px solid var(--uc-line-2);color:var(--uc-muted)}
    .uc-av-mood{position:absolute;bottom:-4px;right:-8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#0b0817;border:1px solid var(--uc-line-2);transition:transform .3s var(--uc-ease-spring)}
    .uc-av-mood.is-bump{transform:scale(1.35)}
    .uc-seat-name{font-size:11.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
    .uc-seat.is-me .uc-seat-name{color:var(--uc-cyan)}
    .uc-wave{display:flex;gap:2px;height:9px;align-items:flex-end;opacity:0;transition:opacity .2s}
    .uc-wave i{width:3px;border-radius:2px;background:var(--uc-cyan);height:30%}
    .uc-seat.is-speaking .uc-wave{opacity:1}
    .uc-seat.is-speaking .uc-wave i{animation:uc-eq .5s ease-in-out infinite alternate}
    .uc-wave i:nth-child(2){animation-delay:.1s !important}.uc-wave i:nth-child(3){animation-delay:.22s !important}.uc-wave i:nth-child(4){animation-delay:.05s !important}.uc-wave i:nth-child(5){animation-delay:.17s !important}
    @keyframes uc-eq{from{height:20%}to{height:100%}}
    .uc-sus{width:78%;height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
    .uc-sus-fill{display:block;height:100%;width:var(--sus,30%);border-radius:9px;
      background:linear-gradient(90deg,var(--uc-cyan),var(--uc-amber) 55%,var(--uc-crimson));background-size:180px 100%;
      box-shadow:0 0 8px rgba(255,190,11,.6);transition:width .6s var(--uc-ease-out)}
    .uc-sus-num{font-family:var(--uc-mono);font-size:8.5px;color:var(--uc-dim);letter-spacing:.08em}
    .uc-sus-num.is-hot{color:#ff6b9a}
    .uc-vote-pill{font-family:var(--uc-mono);font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:3px 6px;border-radius:7px;color:#fff;
      background:linear-gradient(135deg,var(--uc-crimson),#a3003a);box-shadow:0 0 12px rgba(255,0,84,.55);margin-top:2px;animation:uc-vote-breathe 1.2s ease-in-out infinite}
    @keyframes uc-vote-breathe{50%{box-shadow:0 0 20px rgba(255,0,84,.85)}}
    .uc-seat.is-voted .uc-vote-pill{background:var(--uc-cyan);color:#06221d;animation:none}
    .uc-tally{position:absolute;top:-6px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font-family:var(--uc-mono);font-size:10px;font-weight:700;
      display:grid;place-items:center;background:var(--uc-amber);color:#1a1300;box-shadow:0 0 12px rgba(255,190,11,.7);transform:scale(0);transition:transform .3s var(--uc-ease-spring)}
    .uc-tally.is-on{transform:scale(1)}
    .uc-tally.is-bump{animation:uc-tally-bump .35s var(--uc-ease-spring)}
    @keyframes uc-tally-bump{50%{transform:scale(1.45)}}
    .uc-seat.is-out > :not(.uc-stamp):not(.uc-role-tag){filter:grayscale(.9) brightness(.55)}
    .uc-seat .uc-stamp{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-14deg) scale(0);z-index:4;
      font-family:var(--uc-mono);font-weight:700;font-size:10px;letter-spacing:.1em;line-height:1.1;color:var(--uc-crimson);border:2px solid var(--uc-crimson);
      background:rgba(11,8,23,.85);padding:3px 6px;border-radius:6px;white-space:nowrap;text-shadow:0 0 8px rgba(255,0,84,.7);opacity:0;pointer-events:none}
    .uc-seat.is-out .uc-stamp{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1);filter:none}
    .uc-seat.is-slam .uc-stamp{animation:uc-slam .55s cubic-bezier(.2,1.6,.4,1) both}
    @keyframes uc-slam{0%{transform:translate(-50%,-50%) rotate(-30deg) scale(3.2);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
    .uc-role-tag{font-family:var(--uc-mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:5px;margin-top:2px}
    .uc-role-tag.civ{color:var(--uc-cyan);border:1px solid rgba(0,245,212,.5)}
    .uc-role-tag.spy{color:#ff6b9a;border:1px solid rgba(255,0,84,.6)}
    .uc-role-tag.white{color:var(--uc-amber);border:1px solid rgba(255,190,11,.6)}
    .uc-seat.is-shake{animation:uc-shake .45s ease}
    @keyframes uc-shake{20%{transform:translate(calc(-50% - 5px),-50%) rotate(-4deg)}40%{transform:translate(calc(-50% + 5px),-50%) rotate(4deg)}60%{transform:translate(calc(-50% - 3px),-50%)}80%{transform:translate(calc(-50% + 2px),-50%)}}
    .uc-arena.is-quake{animation:uc-quake .4s ease}
    @keyframes uc-quake{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}

    .uc-bubble{position:absolute;z-index:6;left:var(--x);top:var(--y);max-width:min(168px,48cqw);padding:7px 9px;border-radius:14px;pointer-events:none;
      background:#f7f5ff;color:#140d2e;box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 2px rgba(0,245,212,.55);
      transform:translate(-50%,-100%);animation:uc-pop .42s var(--uc-ease-spring) both;text-align:center}
    .uc-bubble.is-below{transform:translate(-50%,0)}
    .uc-bubble::after{content:'';position:absolute;left:calc(50% + var(--tail,0px));bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#f7f5ff}
    .uc-bubble.is-below::after{bottom:auto;top:-7px;border-top:0;border-bottom:7px solid #f7f5ff}
    .uc-bubble.is-chat{background:#241a52;color:var(--uc-text);box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 1.5px rgba(255,190,11,.6)}
    .uc-bubble.is-chat::after{border-top-color:#241a52}
    .uc-bubble.is-chat.is-below::after{border-bottom-color:#241a52;border-top-color:transparent}
    .uc-bubble b{display:block;font-size:11.5px;font-weight:800;line-height:1.25}
    .uc-bubble small{display:block;font-size:10px;opacity:.7;margin-top:2px;line-height:1.25}
    .uc-bubble.is-out{animation:uc-pop-out .25s ease forwards}
    @keyframes uc-pop{0%{opacity:0;scale:.4}100%{opacity:1;scale:1}}
    @keyframes uc-pop-out{to{opacity:0;scale:.7}}

    .uc-fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:visible}
    .uc-proj{position:absolute;left:0;top:0;font-size:26px;line-height:1;will-change:transform;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
    .uc-burst{position:absolute;width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px;animation:uc-burst .6s ease-out forwards}
    @keyframes uc-burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
    .uc-ring-fx{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--c,#00f5d4);animation:uc-ring-fx .7s ease-out forwards}
    @keyframes uc-ring-fx{to{transform:scale(5);opacity:0}}
    .uc-float{position:absolute;font-family:var(--uc-mono);font-size:11px;font-weight:700;margin-left:-20px;animation:uc-float-up 1.1s ease-out forwards;white-space:nowrap}
    @keyframes uc-float-up{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
    .uc-ticket{position:absolute;font-size:18px;margin:-9px 0 0 -9px;animation:uc-ticket .75s cubic-bezier(.3,1.4,.5,1) forwards}
    @keyframes uc-ticket{0%{transform:translateY(-120px) rotate(-30deg);opacity:0}30%{opacity:1}100%{transform:translateY(0) rotate(8deg) scale(.6);opacity:0}}
    .uc-stain{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50% 45% 55% 40%;opacity:.85;animation:uc-stain 2.6s ease-in forwards}
    @keyframes uc-stain{0%{transform:scale(.2)}12%{transform:scale(1.15)}80%{opacity:.75}100%{transform:scale(1) translateY(10px);opacity:0}}

    /* ---------- konsol bawah ---------- */
    .uc-console{flex:0 0 auto;height:clamp(244px,35.5dvh,304px);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
    .uc-console > div{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
    .uc-console-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:800;flex:0 0 auto}
    .uc-console-head > span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-legend{flex:0 0 auto}
    .uc-console-head .uc-mono{font-size:9.5px;color:var(--uc-dim);font-weight:500}
    .uc-live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--uc-crimson);box-shadow:0 0 8px var(--uc-crimson);margin-right:6px;animation:uc-blink 1s infinite}
    .uc-log{display:flex;flex-direction:column;gap:4px;min-height:0;flex:1 1 auto;overflow:hidden}
    .uc-log-row{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;padding:4px 7px;flex:0 0 auto;border-radius:10px;background:rgba(255,255,255,.035);animation:uc-screen-in .3s ease both}
    .uc-log-row .uc-mono{font-size:9.5px;color:var(--uc-cyan);padding-top:1px;flex:0 0 auto}
    .uc-log-row b{font-weight:700}
    .uc-log-row small{display:block;color:var(--uc-muted);font-size:10px}
    .uc-log-empty{font-size:11.5px;color:var(--uc-dim);padding:6px 2px}
    .uc-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .uc-tab{height:36px;border-radius:12px;padding:0 9px;text-align:left;display:flex;flex-direction:column;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--uc-line);transition:border-color .2s,background .2s}
    .uc-tab .uc-mono{font-size:9px;color:var(--uc-dim)}
    .uc-tab b{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-tab[aria-selected="true"]{border-color:rgba(0,245,212,.7);background:rgba(0,245,212,.08)}
    .uc-tab.is-set b{color:var(--uc-cyan)}
    .uc-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .uc-chip{position:relative;min-height:40px;padding:6px 9px;border-radius:12px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;
      background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--uc-line);transition:transform .12s,border-color .2s,background .2s}
    .uc-chip:active{transform:scale(.96)}
    .uc-chip b{font-size:12px;font-weight:700;line-height:1.2}
    .uc-chip small{font-size:10px;color:var(--uc-muted);line-height:1.2}
    .uc-chip .uc-risk{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%}
    .uc-risk.low{background:var(--uc-cyan);box-shadow:0 0 6px var(--uc-cyan)}
    .uc-risk.mid{background:var(--uc-amber);box-shadow:0 0 6px var(--uc-amber)}
    .uc-risk.high{background:var(--uc-crimson);box-shadow:0 0 6px var(--uc-crimson)}
    .uc-chip[aria-pressed="true"]{border-color:var(--uc-cyan);background:linear-gradient(180deg,rgba(0,245,212,.22),rgba(0,245,212,.06));box-shadow:0 0 14px rgba(0,245,212,.25)}
    .uc-legend{display:flex;gap:7px;font-size:8.5px;color:var(--uc-dim);font-family:var(--uc-mono);letter-spacing:0}
    .uc-legend span{display:inline-flex;align-items:center;gap:4px}
    .uc-legend .uc-risk{width:6px;height:6px;border-radius:50%;display:inline-block}
    .uc-transmit-row{display:flex;gap:7px;align-items:stretch}
    .uc-preview{flex:1;min-width:0;border-radius:12px;padding:5px 9px;background:rgba(0,0,0,.25);border:1px solid var(--uc-line);display:flex;flex-direction:column;justify-content:center}
    .uc-preview b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-leakbar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden}
    .uc-leakbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--uc-cyan),var(--uc-amber),var(--uc-crimson));background-size:220px 100%;transition:width .3s}
    .uc-transmit{flex:0 0 auto;padding:0 13px;border-radius:12px;font-size:12px;font-weight:800;color:#06221d;background:linear-gradient(135deg,var(--uc-cyan),#36c3ff);box-shadow:0 0 18px rgba(0,245,212,.4);transition:transform .12s,filter .2s}
    .uc-transmit:disabled{filter:grayscale(1) brightness(.55);box-shadow:none}
    .uc-transmit:active{transform:scale(.95)}
    .uc-note{font-size:11px;color:var(--uc-amber);line-height:1.35}
    .uc-shouts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .uc-shout{min-height:40px;padding:6px 9px;border-radius:12px;font-size:11.5px;font-weight:700;text-align:left;line-height:1.25;background:rgba(255,255,255,.05);border:1px solid var(--uc-line);transition:transform .12s,border-color .2s}
    .uc-shout:active{transform:scale(.96)}
    .uc-shout.is-accuse{border-color:rgba(255,0,84,.45)}
    .uc-shout.is-defend{border-color:rgba(0,245,212,.45)}
    .uc-targets{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
    .uc-targets .uc-label{margin-right:2px}
    .uc-target{height:26px;padding:0 9px;border-radius:9px;font-family:var(--uc-mono);font-size:10.5px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--uc-line)}
    .uc-target[aria-pressed="true"]{background:rgba(255,0,84,.18);border-color:var(--uc-crimson);color:#ffd1df}
    .uc-hint{font-size:10.5px;color:var(--uc-dim)}
    .uc-mycard{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:12px;background:rgba(0,0,0,.28);border:1px dashed rgba(0,245,212,.3)}
    .uc-mycard .uc-role-badge{font-size:9px;padding:3px 7px;flex:0 0 auto}
    .uc-mycard b{font-family:var(--uc-mono);font-size:13px;font-weight:700;flex:0 0 auto}
    .uc-mycard small{font-size:10.5px;color:var(--uc-muted);line-height:1.3;min-width:0}
    .uc-recap{display:flex;flex-direction:column;gap:4px}
    .uc-recap-row{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:5px 7px;border-radius:10px;background:rgba(0,0,0,.22)}
    .uc-recap-row .uc-mono{font-size:9.5px;color:var(--uc-dim);flex:0 0 auto}
    .uc-recap-row span.uc-recap-clue{flex:1;min-width:0}
    .uc-recap-row small{display:block;font-size:10px;color:var(--uc-muted)}
    .uc-recap-row small.uc-fix{color:var(--uc-cyan)}
    .uc-fit{flex:0 0 auto;font-family:var(--uc-mono);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px}
    .uc-fit.yes{color:#06221d;background:var(--uc-cyan)}
    .uc-fit.no{color:#fff;background:var(--uc-crimson)}
    .uc-fit.timeout,.uc-fit.white{color:#1a1300;background:var(--uc-amber)}
    .uc-go{height:30px;padding:0 11px;border-radius:10px;font-size:11.5px;flex:0 0 auto;font-weight:800;background:linear-gradient(135deg,var(--uc-amber),#ff7a00);color:#1a1300;box-shadow:0 0 14px rgba(255,190,11,.45)}

    .uc-tray{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;border-radius:22px;padding:12px;animation:uc-tray-in .35s var(--uc-ease-spring) both}
    @keyframes uc-tray-in{from{transform:translateY(40px);opacity:0}}
    .uc-tray-items{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}
    .uc-item{height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.05);border:1px solid var(--uc-line);transition:transform .12s}
    .uc-item:active{transform:scale(.92)}
    .uc-item span{font-size:24px;line-height:1}
    .uc-item small{font-size:10px;font-weight:700;color:var(--uc-muted)}
    .uc-item.is-up{border-color:rgba(255,0,84,.35)}
    .uc-item.is-down{border-color:rgba(0,245,212,.35)}

    /* ---------- BABAK 6 · SUDDEN DEATH ---------- */
    .uc-showdown{align-items:center;justify-content:center;text-align:center;gap:12px}
    .uc-alert{font-family:var(--uc-mono);font-weight:700;letter-spacing:.24em;font-size:13px;color:var(--uc-crimson);text-shadow:0 0 16px rgba(255,0,84,.8);animation:uc-blink 1s infinite}
    .uc-big-timer{position:relative;width:96px;height:96px}
    .uc-big-timer svg{width:96px;height:96px;transform:rotate(-90deg)}
    .uc-big-timer circle{fill:none;stroke-width:5}
    .uc-big-timer .uc-timer-track{stroke:rgba(255,255,255,.08)}
    .uc-big-timer .uc-timer-bar{stroke:var(--uc-crimson);stroke-linecap:round;transition:stroke-dashoffset .95s linear;filter:drop-shadow(0 0 6px var(--uc-crimson))}
    .uc-big-timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--uc-mono);font-size:28px;font-weight:700}
    .uc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:360px}
    .uc-intel{height:64px;border-radius:16px;font-family:var(--uc-mono);font-size:15px;font-weight:700;letter-spacing:.06em;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--uc-line-2);transition:transform .12s,border-color .2s,box-shadow .2s}
    .uc-intel:active{transform:scale(.95)}
    .uc-intel.is-scan{border-color:var(--uc-amber);box-shadow:0 0 18px rgba(255,190,11,.45)}
    .uc-intel.is-right{border-color:var(--uc-cyan);background:rgba(0,245,212,.18);box-shadow:0 0 22px rgba(0,245,212,.5)}
    .uc-intel.is-wrong{border-color:var(--uc-crimson);background:rgba(255,0,84,.18);box-shadow:0 0 22px rgba(255,0,84,.5)}
    .uc-showdown-msg{min-height:34px;font-size:13px;font-weight:700;max-width:340px}

    /* ---------- BABAK 6 · DEBRIEF ---------- */
    .uc-debrief{gap:8px}
    .uc-debrief-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;scrollbar-width:none}
    .uc-debrief-body::-webkit-scrollbar{display:none}
    .uc-banner{position:relative;text-align:center;padding:12px 10px 11px;border-radius:22px;overflow:hidden}
    .uc-banner::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(0,245,212,.25),transparent 30%,rgba(121,40,202,.3),transparent 60%);animation:uc-spin 7s linear infinite;z-index:-1}
    .uc-banner.is-inf::before{background:conic-gradient(from 0deg,transparent,rgba(255,0,84,.3),transparent 30%,rgba(255,190,11,.22),transparent 60%)}
    .uc-banner-code{font-family:var(--uc-mono);font-weight:700;letter-spacing:.18em;font-size:clamp(13px,4.4vw,17px);color:var(--uc-cyan);text-shadow:0 0 18px rgba(0,245,212,.8);animation:uc-banner-in .8s var(--uc-ease-spring) both}
    .uc-banner.is-inf .uc-banner-code{color:#ff4d85;text-shadow:0 0 18px rgba(255,0,84,.8)}
    @keyframes uc-banner-in{from{letter-spacing:.8em;opacity:0}}
    .uc-banner h2{font-size:20px;font-weight:800;margin:4px 0 2px}
    .uc-banner p{margin:0;font-size:12px;color:var(--uc-muted)}
    .uc-roles{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
    .uc-role-chip{font-size:10.5px;padding:3px 8px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--uc-line)}
    .uc-role-chip.spy{border-color:rgba(255,0,84,.55)}
    .uc-role-chip.white{border-color:rgba(255,190,11,.55)}
    .uc-role-chip .uc-mono{font-size:9.5px;color:var(--uc-dim)}
    .uc-card2{border-radius:18px;padding:10px 11px}
    .uc-card2 h3{margin:0 0 7px;font-family:var(--uc-mono);font-size:10px;letter-spacing:.16em;color:var(--uc-cyan);font-weight:700;text-transform:uppercase}
    .uc-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
    .uc-vs .uc-mono{font-size:15px;font-weight:700}
    .uc-vs small{display:block;font-size:10.5px;color:var(--uc-muted)}
    .uc-vs i{font-style:normal;font-family:var(--uc-mono);font-size:10px;color:var(--uc-crimson)}
    .uc-vs .is-civ .uc-mono{color:var(--uc-cyan)}
    .uc-vs .is-spy .uc-mono{color:#ff6b9a}
    .uc-nuance{font-size:11.5px;line-height:1.45;color:var(--uc-muted);margin:7px 0 0}
    .uc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
    .uc-stat{border-radius:12px;padding:6px 4px;text-align:center;background:rgba(0,0,0,.25);border:1px solid var(--uc-line)}
    .uc-stat b{display:block;font-family:var(--uc-mono);font-size:14px;font-weight:700}
    .uc-stat small{display:block;font-size:9px;color:var(--uc-muted);line-height:1.2;margin-top:2px}
    .uc-evid{font-size:11px;line-height:1.45;color:var(--uc-muted);margin:7px 0 0}
    .uc-evid b{color:var(--uc-text)}
    .uc-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:0 0 auto}
    .uc-actions .uc-cta{grid-column:1 / -1;height:48px}
    .uc-actions a{display:grid;place-items:center;text-decoration:none;color:var(--uc-text)}

    /* ---------- modal & toast ---------- */
    .uc-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,3,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:uc-fade .2s ease both}
    @keyframes uc-fade{from{opacity:0}}
    .uc-sheet{width:100%;max-width:380px;max-height:calc(100dvh - 32px);overflow:auto;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,#1b1440,#100b26);border:1px solid var(--uc-line-2);box-shadow:0 30px 60px rgba(0,0,0,.6)}
    .uc-sheet h2{margin:0;font-size:17px;font-weight:800}
    .uc-rule{padding:9px 10px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--uc-line)}
    .uc-rule b{display:block;font-size:12px;color:var(--uc-cyan);margin-bottom:2px}
    .uc-rule p{margin:0;font-size:11.5px;color:var(--uc-muted);line-height:1.45}
    .uc-peek-card{text-align:center;padding:16px 10px;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,rgba(0,245,212,.16),transparent 60%),rgba(0,0,0,.3);border:1px solid rgba(0,245,212,.35)}
    .uc-toast{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 50px);z-index:60;transform:translate(-50%,-20px);opacity:0;pointer-events:none;
      max-width:min(92vw,420px);padding:9px 14px;border-radius:14px;font-size:12px;font-weight:700;line-height:1.35;text-align:center;
      background:#1d1645;border:1px solid var(--uc-line-2);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:opacity .25s,transform .35s var(--uc-ease-spring)}
    .uc-toast.is-on{opacity:1;transform:translate(-50%,0)}
    .uc-toast.is-good{border-color:rgba(0,245,212,.6);box-shadow:0 0 22px rgba(0,245,212,.25)}
    .uc-toast.is-bad{border-color:rgba(255,0,84,.6);box-shadow:0 0 22px rgba(255,0,84,.25)}

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
      .uc-bg::before{animation:none}
    }
    @media (max-height:700px){
      .uc-h1{font-size:19px}
      .uc-mode{min-height:80px}
      .uc-chip{min-height:34px;padding:3px 8px}
      .uc-console{height:clamp(218px,36dvh,262px)}
      .uc-console{padding:8px;gap:5px}
    }
  </style>
</head>
<body>
  <div class="uc-app" id="uc-app" data-phase="lobby">
    <div class="uc-bg" aria-hidden="true"></div>

    <header class="uc-top">
      <a class="uc-icon-btn" id="uc-back" href="./index.html" data-t-aria="undercover.back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="uc-top-title">
        <span class="uc-code" id="uc-phase-code"></span>
        <strong id="uc-phase-name"></strong>
      </div>
      <button type="button" class="uc-peek" id="uc-peek" data-t-aria="undercover.peek-aria" hidden><span aria-hidden="true">🃏</span><span data-t="undercover.peek"></span></button>
      <button type="button" class="uc-icon-btn" id="uc-rules-btn" data-t-aria="undercover.rules-open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      </button>
      <button type="button" class="uc-sfx" id="uc-sfx" aria-pressed="true" data-t-aria="undercover.sfx-aria"></button>
    </header>

    <main class="uc-stage">
      <!-- BABAK 1 · BRIEFING ROOM -->
      <section class="uc-screen uc-lobby" id="uc-lobby" aria-labelledby="uc-lobby-title">
        <div class="uc-lobby-body">
          <div>
            <h1 class="uc-h1" id="uc-lobby-title" data-t="undercover.lobby.title"></h1>
            <p class="uc-sub" data-t="undercover.lobby.sub"></p>
          </div>
          <div>
            <div class="uc-label" data-t="undercover.lobby.mode-label"></div>
            <div class="uc-modes" role="radiogroup" id="uc-modes" style="margin-top:6px">
              <button type="button" class="uc-mode uc-glass" role="radio" aria-checked="true" data-mode="agent">
                <span class="uc-mode-ico" aria-hidden="true">🕵️</span>
                <b data-t="undercover.lobby.mode-agent"></b>
                <span class="uc-mode-sub" data-t="undercover.lobby.mode-agent-sub"></span>
              </button>
              <button type="button" class="uc-mode uc-glass" role="radio" aria-checked="false" data-mode="white">
                <span class="uc-mode-ico" aria-hidden="true">👻</span>
                <b data-t="undercover.lobby.mode-white"></b>
                <span class="uc-mode-sub" data-t="undercover.lobby.mode-white-sub"></span>
              </button>
            </div>
          </div>
          <div>
            <div class="uc-label" data-t="undercover.lobby.size-label"></div>
            <div class="uc-seg uc-glass" role="radiogroup" id="uc-sizes" style="margin-top:6px">
              <button type="button" role="radio" aria-checked="true" data-size="4" data-t="undercover.lobby.size-4"></button>
              <button type="button" role="radio" aria-checked="false" data-size="6" data-t="undercover.lobby.size-6"></button>
            </div>
          </div>
          <div>
            <div class="uc-row">
              <div class="uc-label" id="uc-seat-count"></div>
              <button type="button" class="uc-link" id="uc-fill" data-t="undercover.lobby.fill-all"></button>
            </div>
            <div class="uc-dossiers" id="uc-dossiers" style="margin-top:6px"></div>
          </div>
          <div class="uc-receipt uc-glass" id="uc-receipt" hidden></div>
          <div class="uc-ptable" aria-hidden="true"><div class="uc-ptable-ring" id="uc-ptable"><div class="uc-ptable-core"><span class="uc-mono" id="uc-ptable-code"></span><b id="uc-ptable-main"></b></div></div></div>
        </div>
        <div class="uc-matching" id="uc-matching" hidden><i></i><i></i><i></i><span data-t="undercover.lobby.matching"></span></div>
        <button type="button" class="uc-cta" id="uc-start"></button>
      </section>

      <!-- BABAK 2 · BIOMETRIC SECRET REVEAL -->
      <section class="uc-screen uc-reveal" id="uc-reveal" hidden>
        <div>
          <h1 class="uc-h1" id="uc-reveal-title"></h1>
          <p class="uc-sub" data-t="undercover.reveal.hint"></p>
        </div>
        <div class="uc-card-wrap">
          <div class="uc-card" id="uc-card" role="img" data-t-aria="undercover.reveal.card-aria">
            <div class="uc-face uc-face-front">
              <div class="uc-stamp-ts" data-t="undercover.reveal.classified"></div>
              <div class="uc-seal" aria-hidden="true">🗂️</div>
              <small id="uc-front-seat"></small>
              <small data-t="undercover.reveal.front-sub"></small>
            </div>
            <div class="uc-face uc-face-back" id="uc-card-back">
              <span class="uc-role-badge" id="uc-role-badge"></span>
              <div>
                <div class="uc-label" id="uc-word-label"></div>
                <div class="uc-word" id="uc-word"></div>
                <div class="uc-gloss" id="uc-gloss"></div>
              </div>
              <p class="uc-mission" id="uc-mission"></p>
            </div>
          </div>
        </div>
        <div class="uc-scan-zone">
          <button type="button" class="uc-scanner" id="uc-scanner" data-t-aria="undercover.reveal.scan">
            <svg class="uc-ring" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44" stroke="rgba(255,255,255,.08)"/><circle id="uc-scan-ring" cx="48" cy="48" r="44" stroke="#00f5d4" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
            <svg class="uc-fp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 11c0 3.5-1 6.5-2.6 9"/><path d="M8.5 6.6A6 6 0 0 1 18 11c0 1.6-.1 3.1-.4 4.6"/><path d="M6 9.4A6 6 0 0 0 6 11c0 2.4-.6 4.6-1.6 6.5"/><path d="M14.8 11c0 3-.6 5.8-1.7 8.4"/><path d="M9.2 11a2.8 2.8 0 0 1 5.6 0"/><path d="M17.8 17.8c-.3 1-.7 2-1.2 2.9"/><path d="M4 6.8A9 9 0 0 1 20.4 8"/></svg>
            <span class="uc-laser" aria-hidden="true"></span>
          </button>
          <span class="uc-scan-label" id="uc-scan-label" data-t="undercover.reveal.scan"></span>
        </div>
        <button type="button" class="uc-cta" id="uc-enter" data-t="undercover.reveal.enter" disabled></button>
      </section>

      <!-- BABAK 3-5 · MEJA INTEROGASI / DEBAT / TRIBUNAL -->
      <section class="uc-screen uc-table" id="uc-table" hidden>
        <div class="uc-status uc-glass">
          <span class="uc-round" id="uc-round"></span>
          <span class="uc-status-text" id="uc-status-text" aria-live="polite"></span>
          <span class="uc-timer" id="uc-timer" aria-hidden="true">
            <svg viewBox="0 0 30 30"><circle class="uc-timer-track" cx="15" cy="15" r="12"/><circle class="uc-timer-bar" id="uc-timer-bar" cx="15" cy="15" r="12" stroke-dasharray="75.4" stroke-dashoffset="0"/></svg>
            <b id="uc-timer-num"></b>
          </span>
        </div>
        <div class="uc-arena" id="uc-arena">
          <div class="uc-felt" aria-hidden="true">
            <span class="uc-holo-code" id="uc-holo-code"></span>
            <span class="uc-holo-main" id="uc-holo-main"></span>
            <span class="uc-holo-sub" id="uc-holo-sub"></span>
          </div>
          <div class="uc-spot is-off" id="uc-spot" aria-hidden="true"></div>
          <div id="uc-seats"></div>
          <div class="uc-fx" id="uc-fx" aria-hidden="true"></div>
        </div>
        <div class="uc-console uc-glass" id="uc-console">
          <!-- Interogasi: menyimak -->
          <div id="uc-p-listen">
            <div class="uc-console-head"><span><span class="uc-live-dot" aria-hidden="true"></span><span id="uc-listen-text"></span></span><span class="uc-mono" data-t="undercover.clue.log-title"></span></div>
            <div class="uc-log" id="uc-log" style="margin-top:6px"></div>
            <div class="uc-mycard" id="uc-mycard" style="margin-top:6px"><span class="uc-role-badge" id="uc-my-role"></span><b id="uc-my-word"></b><small id="uc-my-tip"></small></div>
          </div>
          <!-- Interogasi: Clue Synthesizer -->
          <div id="uc-p-synth" hidden>
            <div class="uc-console-head"><span><span class="uc-live-dot" aria-hidden="true"></span><span data-t="undercover.clue.your-turn"></span></span>
              <span class="uc-legend" aria-hidden="true"><span><i class="uc-risk low"></i><span data-t="undercover.clue.leak-low"></span></span><span><i class="uc-risk mid"></i><span data-t="undercover.clue.leak-mid"></span></span><span><i class="uc-risk high"></i><span data-t="undercover.clue.leak-high"></span></span></span>
            </div>
            <div class="uc-tabs" role="tablist" style="margin-top:6px">
              <button type="button" class="uc-tab" role="tab" id="uc-tab-a" data-dim="a" aria-selected="true"><span class="uc-mono">① <span data-t="undercover.clue.dim-a"></span></span><b id="uc-tab-a-val">—</b></button>
              <button type="button" class="uc-tab" role="tab" id="uc-tab-b" data-dim="b" aria-selected="false"><span class="uc-mono">② <span data-t="undercover.clue.dim-b"></span></span><b id="uc-tab-b-val">—</b></button>
            </div>
            <div class="uc-chips" id="uc-chips" role="tabpanel" style="margin-top:6px"></div>
            <div class="uc-transmit-row" style="margin-top:6px">
              <div class="uc-preview"><b id="uc-preview"></b><div class="uc-leakbar"><i id="uc-leakbar"></i></div></div>
              <button type="button" class="uc-transmit" id="uc-transmit" data-t="undercover.clue.transmit" disabled></button>
            </div>
          </div>
          <!-- Debat bebas -->
          <div id="uc-p-debate" hidden>
            <div class="uc-console-head"><span><span class="uc-live-dot" aria-hidden="true"></span><span data-t="undercover.debate.title"></span></span><button type="button" class="uc-go" id="uc-to-tribunal" data-t="undercover.debate.to-tribunal"></button></div>
            <div class="uc-targets" id="uc-targets" style="margin-top:6px"></div>
            <div class="uc-shouts" id="uc-shouts" style="margin-top:6px"></div>
            <div class="uc-log" id="uc-log-debate" style="margin-top:6px"></div>
          </div>
          <!-- Tribunal -->
          <div id="uc-p-tribunal" hidden>
            <div class="uc-console-head"><span><span class="uc-live-dot" aria-hidden="true"></span><span data-t="undercover.tribunal.title"></span></span></div>
            <p class="uc-sub" id="uc-vote-status" style="margin-top:6px;flex:0 0 auto" aria-live="polite"></p>
            <div class="uc-log" id="uc-log-tribunal" style="margin-top:6px"></div>
          </div>
          <!-- Penonton -->
          <div id="uc-p-spectator" hidden>
            <p class="uc-sub" data-t="undercover.spectator"></p>
          </div>
        </div>
        <div class="uc-tray uc-glass" id="uc-tray" role="dialog" aria-modal="false" aria-labelledby="uc-tray-title" hidden>
          <div class="uc-row"><b id="uc-tray-title" style="font-size:13px"></b><button type="button" class="uc-link" id="uc-tray-close" data-t="undercover.tray.close"></button></div>
          <div class="uc-tray-items" id="uc-tray-items"></div>
          <div class="uc-shouts" id="uc-tray-shouts"></div>
        </div>
      </section>

      <!-- BABAK 6a · SUDDEN DEATH -->
      <section class="uc-screen uc-showdown" id="uc-showdown" hidden>
        <div class="uc-alert" data-t="undercover.code.showdown"></div>
        <h1 class="uc-h1" data-t="undercover.showdown.title"></h1>
        <p class="uc-sub" id="uc-sd-who" style="max-width:330px"></p>
        <div class="uc-big-timer" aria-hidden="true">
          <svg viewBox="0 0 96 96"><circle class="uc-timer-track" cx="48" cy="48" r="42"/><circle class="uc-timer-bar" id="uc-sd-bar" cx="48" cy="48" r="42" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg>
          <b id="uc-sd-num"></b>
        </div>
        <div class="uc-label" data-t="undercover.showdown.grid"></div>
        <div class="uc-grid" id="uc-sd-grid"></div>
        <p class="uc-showdown-msg" id="uc-sd-msg" aria-live="polite"></p>
      </section>

      <!-- BABAK 6b · INTEL DEBRIEF -->
      <section class="uc-screen uc-debrief" id="uc-debrief" hidden>
        <div class="uc-debrief-body">
          <div class="uc-banner uc-glass" id="uc-banner">
            <div class="uc-banner-code" id="uc-banner-code"></div>

          <div>
