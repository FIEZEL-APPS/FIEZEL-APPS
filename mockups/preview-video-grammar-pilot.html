          { start: 0.5, end: 2.6, text: "I usually drink coffee in the morning.", speaker: "Speaker A" },
          { start: 3.1, end: 5.2, text: "But today I want tea.", speaker: "Speaker B" }
        ],
        pauseAt: 2.6,
        loopCount: 2,
        speed: 1.0,
        exercise: {
          type: "subtitle-cloze",
          grammarPoint: "Present Simple (Routines)",
          question: "Lengkapi subtitle dari dialog yang baru saja kamu dengar:",
          clozeText: "I usually ___ coffee in the morning.",
          clozeAnswer: "drink",
          options: ["drink", "drinking", "drinks", "drank"],
          answerIndex: 0,
          explain: {
            why: "Kata 'usually' menandakan kebiasaan. Untuk subjek 'I', gunakan bentuk dasar 'drink'.",
            rule: "Subject (I) + Adverb (usually) + Verb 1 (drink)",
            memory: "USUALLY = KEBIASAAN = Present Simple."
          }
        },
        specs: {
          title: "Klip Stock Video Didubbing TTS (Sebelumnya)",
          source: "Stock Video Pexels CC0 + Dubbing Edge-TTS",
          voice: "AI Neural TTS (Kelemahan: Kurang intonasi alami)",
          lipSync: "Kelemahan: Bibir tidak sinkron (Silent B-roll)",
          flow: "1 Titik Jeda di detik 2.6s",
          filesize: "856 KB (5.5 detik H.264 + AAC)"
        }
      }
    };

    function renderMode(mode) {
      const conf = CONFIGS[mode];
      const container = document.getElementById('videoExerciseContainer');
      const feedbackEl = document.getElementById('feedback');
      const modePill = document.getElementById('modePill');
      const specsPanel = document.getElementById('specsPanel');

      const existingVideo = container.querySelector('video');
      if (existingVideo) {
        try {
          existingVideo.pause();
          existingVideo.removeAttribute('src');
          existingVideo.load();
        } catch(_) {}
      }
      container.innerHTML = '';
      feedbackEl.className = 'hidden';
      modePill.textContent = conf.checkpoints 
        ? `${conf.level} • 5 Checkpoint Berurutan` 
        : `${conf.level} • ${conf.exercise?.grammarPoint || 'Tata Bahasa'}`;

      // Render Specs
      specsPanel.innerHTML = `
        <h3>
          <i data-lucide="${mode === 'five_q' ? 'layers' : (mode === 'real' ? 'star' : 'alert-circle')}" style="color:${mode === 'five_q' ? '#10B981' : (mode === 'real' ? 'var(--sun)' : 'var(--text-muted)')};width:18px;height:18px;"></i>
          ${conf.specs.title}
        </h3>
        <div class="spec-item">
          <span class="spec-label">Sumber Cuplikan:</span>
          <span class="spec-val">${conf.specs.source}</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Karakter Suara:</span>
          <span class="spec-val" style="color:${mode !== 'dub' ? 'var(--good)' : 'var(--sun)'}">${conf.specs.voice}</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Sinkronisasi Bibir:</span>
          <span class="spec-val" style="color:${mode !== 'dub' ? 'var(--good)' : 'var(--bad)'}">${conf.specs.lipSync}</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Alur Pembelajaran:</span>
          <span class="spec-val" style="color:#60A5FA">${conf.specs.flow || conf.specs.checkpointFlow}</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Ukuran & Durasi:</span>
          <span class="spec-val">${conf.specs.filesize}</span>
        </div>
      `;

      const videoElement = FiezelGrammarVideo.renderVideoExercise(conf, {
        onAnswer: (isCorrect, chosenIndex, currentCp, cpIdx) => {
          feedbackEl.classList.remove('hidden');
          const ex = currentCp?.exercise || conf.exercise;
          if (isCorrect) {
            feedbackEl.className = 'feedback-success';
            feedbackEl.innerHTML = `
              <div style="font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <i data-lucide="check-circle" style="width:18px;height:18px;"></i> Jawaban Tepat! (Correct)
              </div>
              <p style="margin:0 0 6px;">${ex.explain.why}</p>
              <div style="font-size:0.8rem;opacity:0.9;font-weight:600;">Rumus: ${ex.explain.rule}</div>
            `;
          } else {
            feedbackEl.className = 'feedback-error';
            feedbackEl.innerHTML = `
              <div style="font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <i data-lucide="x-circle" style="width:18px;height:18px;"></i> Belum Tepat
              </div>
              <p style="margin:0;">Jawaban yang benar: <strong>${ex.clozeAnswer}</strong>. ${ex.explain.why}</p>
            `;
          }
          if (window.lucide) lucide.createIcons();
        }
      });

      container.appendChild(videoElement);
      if (window.lucide) lucide.createIcons();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab5Q').classList.toggle('active', mode === 'five_q');
      document.getElementById('tab5Q2').classList.toggle('active', mode === 'five_q_part2');
      document.getElementById('tabReal').classList.toggle('active', mode === 'real');
      document.getElementById('tabDub').classList.toggle('active', mode === 'dub');
      renderMode(mode);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMode('five_q');
    });
  </script>
</body>
</html>
