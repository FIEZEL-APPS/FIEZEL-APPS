<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
<style>
.q{font-size:24px;font-weight:700;line-height:1.35;margin-top:14px}
.q u{text-decoration:none;background:var(--good-soft);border-bottom:3px solid var(--good);padding:0 6px;border-radius:6px;color:var(--good)}
.sheet .paw{width:76px;position:absolute;right:16px;top:-46px}
.sheet h3{color:var(--good);font-size:22px}
.sheet .btn{margin-top:16px}
.sheet .why{margin-top:10px;font-size:14px;color:var(--ink)}
.combo{position:absolute;right:20px;top:120px;background:var(--sun);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--sun-deep);transform:rotate(6deg)}
</style></head><body>
<div class="screen">
  <div class="toprow">
    <span class="iconbtn"><i data-lucide="x" class="i"></i></span>
    <div style="flex:1"><div class="dots"><i class="g"></i><i class="g"></i><i class="b"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i></i><i></i><i></i></div></div>
    <span class="chip flame"><i data-lucide="flame" class="i sm"></i>4</span>
  </div>
  <div class="mt-3">
    <span class="eyebrow">Lesson 4 · Present Simple · soal 7/10</span>
    <p class="q">She <u>goes</u> to school by bus every morning.</p>
  </div>
  <div class="stack mt-3">
    <div class="opt dim"><span class="k">A</span>go</div>
    <div class="opt good"><span class="k"><i data-lucide="check" class="i sm"></i></span>goes</div>
    <div class="opt dim"><span class="k">C</span>going</div>
    <div class="opt dim"><span class="k">D</span>is go</div>
  </div>
  <div class="sheet good">
    <img class="paw" src="/assets/brand/mascot/collection/paw-040-gold-medal-winner.png" alt="">
    <span class="eyebrow" style="color:var(--good)">Benar</span>
    <h3>Mantap, Rani!</h3>
    <p class="why"><b>She</b> = orang ketiga tunggal, jadi kata kerjanya dapat <b>-es</b> → <i>goes</i>.</p>
    <a class="btn ink block">Lanjut <i data-lucide="arrow-right" class="i sm"></i></a>
  </div>
</div>
<script src="/lucide.min.js"></script><script>lucide.createIcons()</script></body></html>
