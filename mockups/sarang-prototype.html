<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E2724">
<title>FIEZEL · Sarang (prototype v2)</title>
<style>
  :root{
    --paper:#FBF7F3; --paper-2:#F3ECE4; --ink:#2E2724; --ink-2:#1E1917; --ink-3:#3D3532; --ink-4:#4A403C;
    --maroon:#9B3A4A; --maroon-2:#C4515F; --red:#E5484D; --gold:#F7EACB; --gold-2:#E9B44C; --mint:#7FB7A4;
    --muted:#8A7F79; --muted-d:rgba(251,247,243,.55); --r:22px;
    --font:"Nunito","Avenir Next","Segoe UI Variable","Trebuchet MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;overflow-x:hidden}
  body.dark{background:var(--ink)}
  body.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
  body.shake-hit{animation:shakeHit .32s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(4px,0,0)}30%,50%,70%{transform:translate3d(-8px,0,0)}40%,60%{transform:translate3d(8px,0,0)}}
  @keyframes shakeHit{20%{transform:translate3d(0,-5px,0) scale(1.01)}45%{transform:translate3d(0,4px,0)}70%{transform:translate3d(0,-2px,0)}}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .hidden{display:none!important}
  b,strong{font-weight:800}

  /* ---------- status strip ---------- */
  .status{display:flex;align-items:center;gap:14px;padding:14px 18px 8px;font-size:13px;font-weight:700;color:var(--ink-3)}
  .status .pill{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
  .status svg{width:15px;height:15px}
  .status .who{margin-left:auto;color:var(--muted);font-weight:600}

  /* ---------- SARANG (hero scene) ---------- */
  .sarang{position:relative;margin:6px 12px 0;height:505px;border-radius:var(--r);background:var(--ink);overflow:hidden;
    box-shadow:0 18px 40px -22px rgba(46,39,36,.6)}
  .sarang::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 62%, rgba(155,58,74,.30), transparent 70%),
      radial-gradient(40% 30% at 15% 10%, rgba(247,234,203,.07), transparent 70%),
      repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);}
  .sarang .fog{position:absolute;inset:-20%;pointer-events:none;opacity:.5;
    background:radial-gradient(30% 25% at 30% 70%, rgba(233,180,76,.10), transparent 70%),radial-gradient(25% 20% at 75% 40%, rgba(127,183,164,.10), transparent 70%);
    animation:fog 14s ease-in-out infinite alternate}
  @keyframes fog{to{transform:translate(4%,-3%) scale(1.06)}}
  .sarang-label{position:absolute;top:14px;left:18px;font-size:11px;letter-spacing:.22em;font-weight:800;color:var(--gold);opacity:.75}
  .sarang-sub{position:absolute;top:30px;left:18px;font-size:12px;color:var(--muted-d)}

  .bug{position:absolute;width:86px;text-align:center;color:var(--paper);transform:translate(-50%,-50%)}
  .bug .ring{position:relative;width:72px;height:72px;margin:0 auto}
  .bug .ring svg.hp{position:absolute;inset:0;transform:rotate(-90deg)}
  .bug .ring svg.hp .trk{stroke:rgba(251,247,243,.14)}
  .bug .ring svg.hp .val{stroke:var(--gold-2);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
  .bug .ring .body{position:absolute;inset:10px;animation:idle 3.6s ease-in-out infinite}
  .bug:nth-child(2) .ring .body{animation-delay:-1.2s}
  .bug:nth-child(3) .ring .body{animation-delay:-2.4s}
  @keyframes idle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
  .bug .legs{transform-box:fill-box;transform-origin:center;animation:legs .9s ease-in-out infinite}
  @keyframes legs{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .bug .antena{transform-box:fill-box;transform-origin:bottom center;animation:antena 2.2s ease-in-out infinite}
  @keyframes antena{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .bug .name{margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.02em}
  .bug .hpv{font-size:10.5px;color:var(--muted-d);font-variant-numeric:tabular-nums}
  .bug .hpv.warn{color:var(--gold-2);font-weight:800}
  .bug .hpv.low{color:var(--mint);font-weight:800}
  .bug.fosil{filter:grayscale(1) brightness(.7);opacity:.75}
  .bug.fosil .val{stroke:var(--mint)}
  /* bug yang mengincar: denyut mengancam */
  .bug.target .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,var(--c,#E9B44C) 0,transparent 70%);opacity:.35;animation:menace 1.6s ease-in-out infinite}
  .bug.target .ring .body{animation:idleTarget 1.6s ease-in-out infinite}
  .bug.target .eye{filter:drop-shadow(0 0 4px var(--c,#E9B44C))}
  @keyframes menace{0%,100%{transform:scale(.9);opacity:.25}50%{transform:scale(1.15);opacity:.55}}
  @keyframes idleTarget{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.07) translateY(-3px)}}

  .paw{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:124px;height:124px;--px:0px;--py:0px}
  .paw svg{width:100%;height:100%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.45));overflow:visible}
  .paw .head{transform-box:fill-box;transform-origin:center bottom;animation:pawSway 5s ease-in-out infinite}
  @keyframes pawSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  .paw .pupils{transform:translate(var(--px),var(--py));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
  .paw .lids{transform-box:fill-box;transform-origin:center top;animation:blink 5.5s ease-in-out infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(3.2)}}
  .paw .earL{transform-box:fill-box;transform-origin:bottom center;animation:ear 7s ease-in-out infinite}
  .paw .earR{transform-box:fill-box;transform-origin:bottom center;animation:ear 7s ease-in-out infinite 3.4s}
  @keyframes ear{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-9deg)}96%{transform:rotate(5deg)}}
  .paw .tail{transform-box:fill-box;transform-origin:left center;animation:tail 3s ease-in-out infinite}
  @keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}

  .whisper{position:absolute;left:50%;top:24%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(251,247,243,.10);border:1px solid rgba(251,247,243,.14);
    color:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 12px 6px 8px;font-size:11.5px;white-space:nowrap;max-width:92%}
  .whisper small{font-size:9px;letter-spacing:.16em;font-weight:900;color:var(--gold-2)}
  .whisper em{font-style:normal;font-weight:800;color:var(--gold)}
  .whisper .spk{width:22px;height:22px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
  .whisper .spk svg{width:12px;height:12px}

  .cta{position:absolute;left:16px;right:16px;bottom:16px;height:62px;border-radius:18px;background:var(--gold);color:var(--ink);
    display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;font-weight:900;font-size:15px;letter-spacing:.02em;
    box-shadow:0 12px 26px -12px rgba(247,234,203,.55), inset 0 -3px 0 rgba(46,39,36,.12);transition:transform .12s ease;overflow:hidden}
  .cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sheen 4s ease-in-out infinite}
  @keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
  .cta:active{transform:scale(.98)}
  .cta small{display:block;font-size:10.5px;font-weight:800;color:var(--maroon);letter-spacing:.06em}
  .cta .arrow{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-size:18px;flex:none}

  /* ---------- below the fold ---------- */
  section.strip{margin:12px 12px 0;padding:14px 16px;border-radius:18px;background:var(--paper-2);display:flex;gap:12px;align-items:center}
  .strip .dot{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(127,183,164,.25);flex:none}
  .strip b{font-size:13px}
  .strip span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .strip .n{margin-left:auto;font-size:22px;font-weight:900;color:var(--maroon);font-variant-numeric:tabular-nums}
  .strip .n small{font-size:11px;color:var(--muted);font-weight:700}
  .rak{margin:12px 12px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .rak button{background:var(--paper-2);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
  .rak .dots{display:flex;gap:3px}
  .rak .dots i{width:6px;height:6px;border-radius:50%;background:rgba(46,39,36,.15)}
  .rak .dots i.on{background:var(--maroon)}
  .fosil{margin:16px 12px 24px}
  .fosil h3{margin:0 0 8px 6px;font-size:11px;letter-spacing:.22em;font-weight:900;color:var(--muted)}
  .fosil .row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .fosil .row::-webkit-scrollbar{display:none}
  .fosil .card{flex:none;width:112px;height:120px;border-radius:16px;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink-3)}
  .fosil .card svg{width:46px;height:46px;filter:grayscale(1) opacity(.75)}
  .fosil .card small{font-weight:600;color:var(--muted);font-size:10px}
  .fosil .card.lock{border:1.5px dashed rgba(46,39,36,.2);background:transparent;color:var(--muted)}
  .fosil .card.lock .q{width:46px;height:46px;border-radius:50%;background:rgba(46,39,36,.08);display:grid;place-items:center;font-size:20px;font-weight:900}

  /* ---------- BEAT PREDIKSI ---------- */
  .beat{position:fixed;inset:0;z-index:30;background:#120E0D;color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity .22s ease}
  .beat.on{opacity:1}
  .beat .aura{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--eye,#E9B44C) 0,transparent 60%);opacity:0;filter:blur(20px)}
  .beat.on .aura{animation:aura 1.1s ease-in-out .2s infinite alternate}
  @keyframes aura{from{opacity:.10;transform:scale(.85)}to{opacity:.28;transform:scale(1.1)}}
  .beat .eyes{position:relative;width:180px;height:70px;margin-bottom:14px}
  .beat .eye{position:absolute;top:22px;width:46px;height:26px;border-radius:50%/60% 60% 40% 40%;background:var(--eye,#E9B44C);transform:scaleY(0);transform-origin:center;
    box-shadow:0 0 22px var(--eye,#E9B44C),0 0 70px rgba(233,180,76,.35)}
  .beat .eye.l{left:24px}.beat .eye.r{right:24px}
  .beat.on .eye{animation:blinkOpen .55s cubic-bezier(.2,.9,.2,1.2) .2s forwards,eyePulse 1.1s ease-in-out .8s infinite alternate}
  .beat .eye::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:20px;background:#120E0D;transform:translate(-50%,-50%);border-radius:4px}
  @keyframes blinkOpen{0%{transform:scaleY(0)}60%{transform:scaleY(1.1)}80%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
  @keyframes eyePulse{from{box-shadow:0 0 18px var(--eye),0 0 50px rgba(233,180,76,.25)}to{box-shadow:0 0 30px var(--eye),0 0 90px rgba(233,180,76,.45)}}
  .beat .who{font-size:12px;letter-spacing:.3em;font-weight:800;color:rgba(251,247,243,.5);text-transform:uppercase}
  .beat .name{font-size:26px;font-weight:900;letter-spacing:-.01em;text-align:center}
  .beat .name span{color:var(--eye,#E9B44C)}
  .beat .pct{font-size:92px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin-top:6px;color:var(--paper);text-shadow:0 0 40px rgba(233,180,76,.25)}
  .beat .pct small{font-size:34px;letter-spacing:0;color:var(--eye,#E9B44C)}
  .beat .hint{margin-top:14px;font-size:12px;color:rgba(251,247,243,.45);opacity:0;transition:opacity .3s}
  .beat.hold .hint{opacity:1}
  .beat.hold .pct{animation:thump .5s ease-out}
  .beat.hold .name span{animation:lockIn .4s ease-out}
  @keyframes thump{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes lockIn{0%{filter:brightness(2)}100%{filter:brightness(1)}}

  /* ---------- HUNT (arena) ---------- */
  .hunt{position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;overflow-y:auto;
    background-image:radial-gradient(70% 40% at 50% 0%, rgba(155,58,74,.28), transparent 70%)}
  .hunt.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
  .hunt .top{padding:12px 16px 10px;display:flex;align-items:center;gap:12px;position:relative}
  .hunt .top .mini{width:58px;height:58px;flex:none;position:relative}
  .hunt .top .mini svg{width:100%;height:100%;overflow:visible}
  .hunt .top .mini.bite{animation:lunge .5s cubic-bezier(.3,1.4,.4,1)}
  @keyframes lunge{0%{transform:scale(1)}40%{transform:scale(1.7) translate(34px,12px) rotate(-12deg)}100%{transform:scale(1)}}
  .hunt .top .mini.pop{animation:pop .4s ease-out forwards}
  @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
  .hunt .top .meta{min-width:0}
  .hunt .top .meta b{display:block;font-size:15px}
  .hunt .top .meta span{font-size:12px;color:var(--muted-d)}
  .hunt .top .bet{margin-left:auto;flex:none;white-space:nowrap;background:rgba(251,247,243,.1);border:1px solid rgba(251,247,243,.18);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
  .hunt .top .bet.dd{background:var(--gold-2);color:var(--ink);border-color:var(--gold-2)}
  .prog{display:flex;gap:4px;padding:0 16px}
  .prog i{flex:1;height:3px;border-radius:2px;background:rgba(251,247,243,.18)}
  .prog i.ok{background:var(--gold-2)}.prog i.ko{background:var(--maroon-2)}.prog i.now{background:rgba(251,247,243,.6)}.prog i.paw{background:var(--mint)}

  .crucible{margin:12px 16px 0;position:relative;height:10px;border-radius:6px;background:rgba(251,247,243,.12);overflow:hidden}
  .crucible i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:6px;transform-origin:left}
  .crucible.panic i{background:var(--red);animation:panicBar .35s steps(2) infinite}
  @keyframes panicBar{to{opacity:.35}}
  .crucible-meta{display:flex;justify-content:space-between;padding:6px 18px 0;font-size:10.5px;letter-spacing:.18em;font-weight:900;color:var(--muted-d)}
  .crucible-meta b{font-variant-numeric:tabular-nums;color:var(--gold)}
  .crucible-meta.panic b{color:var(--red);animation:pulseText .35s ease-in-out infinite alternate}
  @keyframes pulseText{to{transform:scale(1.15)}}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(229,72,77,.55) 100%)}
  .vignette.panic{animation:vig .6s ease-in-out infinite alternate}
  @keyframes vig{from{opacity:.15}to{opacity:.55}}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;background:radial-gradient(ellipse at center,rgba(229,72,77,.45) 0,rgba(155,58,74,.85) 100%)}
  .flash.on{animation:flash .38s ease-out}
  @keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
  .flash.gold{background:radial-gradient(ellipse at center,rgba(247,234,203,.0) 30%,rgba(233,180,76,.55) 100%)}

  .q{margin:14px 16px 0;background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 18px 16px;position:relative;box-shadow:0 20px 40px -24px rgba(0,0,0,.7)}
  .q .kicker{font-size:10.5px;letter-spacing:.2em;font-weight:900;color:var(--maroon)}
  .q .stem{font-size:23px;font-weight:800;line-height:1.3;margin:6px 0 0;letter-spacing:-.01em}
  .q .stem u{text-decoration:none;border-bottom:3px solid var(--maroon);padding:0 8px;color:var(--maroon);min-width:56px;display:inline-block;text-align:center}
  .opts{display:grid;gap:10px;padding:12px 16px 0}
  .opts button{height:58px;border-radius:16px;background:rgba(251,247,243,.06);border:1.5px solid rgba(251,247,243,.16);color:var(--paper);font-size:18px;font-weight:800;text-align:left;padding:0 18px;
    display:flex;align-items:center;justify-content:space-between;transition:transform .1s,border-color .15s,background .15s}
  .opts button:active{transform:scale(.98)}
  .opts button.ok{background:var(--gold);border-color:var(--gold-2);color:var(--ink)}
  .opts button.ko{background:rgba(229,72,77,.18);border-color:var(--red);color:#FFD5D7}
  .opts button.dim{opacity:.45}
  .opts button:disabled{cursor:default}
  .opts button i{font-size:11px;letter-spacing:.14em;font-weight:900;font-style:normal;opacity:0}
  .opts button.ok i,.opts button.ko i{opacity:1}
  .tools{display:flex;gap:8px;padding:12px 16px 0}
  .tools .dd{flex:1;height:46px;border-radius:14px;border:1.5px solid var(--gold-2);color:var(--gold);font-weight:900;font-size:13px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
  .tools .dd svg{width:16px;height:16px}
  .tools .dd.armed{background:var(--gold-2);color:var(--ink);animation:armed .5s ease-out}
  @keyframes armed{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  .tools .dd small{font-weight:700;letter-spacing:0;opacity:.75;font-size:11px}
  .tools .paw-help{height:46px;padding:0 14px;border-radius:14px;background:rgba(251,247,243,.06);border:1.5px solid rgba(251,247,243,.14);color:var(--muted-d);font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px}
  .tools .paw-help svg{width:18px;height:18px}
  .tools button:disabled{opacity:.35}

  .fb{margin:12px 16px 14px;padding:14px 16px 14px;border-radius:20px;transform:translateY(12px);opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1)}
  .fb.on{transform:none;opacity:1}
  .fb.win{background:rgba(233,180,76,.12);border:1.5px solid rgba(233,180,76,.45)}
  .fb.lose{background:rgba(229,72,77,.12);border:1.5px solid rgba(229,72,77,.5)}
  .fb.help{background:rgba(127,183,164,.12);border:1.5px solid rgba(127,183,164,.5)}
  .fb .tag{font-size:10.5px;letter-spacing:.2em;font-weight:900}
  .fb.win .tag{color:var(--gold-2)}.fb.lose .tag{color:#FF8A8E}.fb.help .tag{color:var(--mint)}
  .fb .say{font-size:16px;line-height:1.35;margin:6px 0 8px;font-weight:800}
  .fb .say b{color:var(--gold)}
  .fb.lose .say b{color:#FFB3B6}
  .fb .why{font-size:13px;line-height:1.4;color:var(--muted-d);padding-top:10px;border-top:1px dashed rgba(251,247,243,.2)}
  .fb .why b{color:var(--paper)}
  .fb .hp{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
  .fb .hp .bar{flex:1;height:8px;border-radius:4px;background:rgba(251,247,243,.15);overflow:hidden}
  .fb .hp .bar i{display:block;height:100%;background:var(--gold-2);transition:width .9s cubic-bezier(.2,1.4,.3,1)}
  .fb.lose .hp .bar i{background:var(--red)}
  .fb .hp .num{min-width:88px;text-align:right}
  .fb .hp .num .drop{color:var(--gold-2);display:inline-block;animation:drop .8s cubic-bezier(.2,1.4,.3,1)}
  .fb.lose .hp .num .drop{color:#FF8A8E}
  @keyframes drop{0%{transform:translateY(-10px) scale(1.4);opacity:0}100%{transform:none;opacity:1}}
  .fb .pawrow{display:flex;gap:12px;align-items:flex-start}
  .fb .pawrow svg{width:44px;height:44px;flex:none}
  .next{margin:0 16px 22px;height:58px;border-radius:18px;background:var(--gold);color:var(--ink);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}

  /* ---------- LAPORAN ---------- */
  .res{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 16px 30px;gap:14px}

    raf=(parts.length||rings.length)?requestAnimationFrame(step):(ctx.clearRect(0,0,innerWidth,innerHeight),0);
  }
  function flash(gold){var f=$('#flash');f.className='flash'+(gold?' gold':'');void f.offsetWidth;f.classList.add('on')}
  function shake(cls){document.body.classList.remove('shake','shake-hit');void document.body.offsetWidth;document.body.classList.add(cls)}
  function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2400)}

  /* ---------------- BEAT PREDIKSI (signature moment) ---------------- */
  var beat=$('#beat');
  function runBeat(q,done){
    var b=BUGS[q.bug];
    beat.style.setProperty('--eye',b.color);
    $('#beatName').innerHTML='<span>'+b.name+'</span> mengunci target…';
    $('#beatPct').innerHTML='0<small>%</small>';
    $('#beatHint').textContent='peluang kamu kegigit menurut '+b.name;
    beat.classList.remove('hidden','hold');requestAnimationFrame(function(){beat.classList.add('on')});
    var t0=null,D=REDUCED?400:1100,last=-1;
    function frame(ts){
      if(!t0)t0=ts;var k=Math.min((ts-t0)/D,1),e=1-Math.pow(1-k,2.6),v=Math.round(q.bet*e);
      if(v!==last){$('#beatPct').innerHTML=v+'<small>%</small>';if(v%3===0)safe(sfx.tick);last=v}
      if(k<1)requestAnimationFrame(frame);
      else{$('#beatPct').innerHTML=q.bet+'<small>%!</small>';$('#beatName').innerHTML='<span>'+b.name+'</span> mengincar';beat.classList.add('hold');safe(sfx.lock);vib(40);
        setTimeout(function(){beat.classList.remove('on');setTimeout(function(){beat.classList.add('hidden');done()},240)},REDUCED?300:800);}
    }
    setTimeout(function(){requestAnimationFrame(frame)},REDUCED?100:600);
  }

  /* ---------------- CRUCIBLE TIMER ---------------- */
  var T={raf:0,end:0,total:8000,panic:false,hb:0,onEnd:null};
  function startTimer(ms,onEnd){stopTimer();T.total=ms;T.end=performance.now()+ms;T.panic=false;T.onEnd=onEnd;$('#vignette').className='vignette';T.raf=requestAnimationFrame(tick)}
  function tick(){
    var left=Math.max(0,T.end-performance.now()),bar=$('#cbar'),txt=$('#ctime'),wrap=$('#crucible'),meta=$('#cmeta');
    if(bar)bar.style.transform='scaleX('+(left/T.total)+')';
    if(txt)txt.textContent=(left/1000).toFixed(1)+'s';
    if(left<3000&&!T.panic){T.panic=true;wrap&&wrap.classList.add('panic');meta&&meta.classList.add('panic');$('#vignette').classList.add('panic');T.hb=setInterval(function(){safe(sfx.heart);vib(15)},600)}
    if(left<=0){var f=T.onEnd;stopTimer();f&&f();return}
    T.raf=requestAnimationFrame(tick);
  }
  function stopTimer(){cancelAnimationFrame(T.raf);T.raf=0;clearInterval(T.hb);T.hb=0;$('#vignette').className='vignette'}

  /* ---------------- HUNT ---------------- */
  var hunt=$('#hunt');
  function progHTML(){return '<div class="prog">'+Q.map(function(_,i){var r=results[i];return '<i class="'+(r==='ok'?'ok':r==='ko'?'ko':r==='paw'?'paw':i===idx?'now':'')+'"></i>'}).join('')+'</div>'}
  function renderQ(q){
    var b=BUGS[q.bug];dd=false;
    document.body.classList.add('dark');
    hunt.innerHTML='<div class="top"><div class="mini" id="mini">'+bugSVG(b,58)+'</div>'+
      '<div class="meta"><b>'+b.name+'</b><span>'+b.tag+' · HP '+b.hp+'%</span></div><div class="bet" id="bet">'+q.bet+'% kegigit</div></div>'+progHTML()+
      '<div class="crucible" id="crucible"><i id="cbar"></i></div><div class="crucible-meta" id="cmeta"><span>CRUCIBLE</span><b id="ctime">8.0s</b></div>'+
      '<div class="q"><div class="kicker">'+q.kicker+'</div><p class="stem">'+q.stem[0]+'<u>'+q.stem[1]+'</u>'+q.stem[2]+'</p></div>'+
      '<div class="opts" id="opts">'+q.opts.map(function(o,i){return '<button data-i="'+i+'" data-testid="opt-'+i+'">'+o+'<i></i></button>'}).join('')+'</div>'+
      '<div class="tools"><button class="dd" id="ddBtn" data-testid="umpan-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>UMPAN 2× <small>· 5 detik</small></button>'+
      '<button class="paw-help" id="pawBtn" data-testid="paw-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 9l3-6 4 4 4-4 3 6v4a7 7 0 0 1-14 0z"/><circle cx="9.5" cy="12" r=".8"/><circle cx="14.5" cy="12" r=".8"/></svg>PAW, bantu!</button></div>'+
      '<div class="fb" id="fb"></div><button class="next hidden" id="next" data-testid="next-btn"></button>';
    hunt.classList.remove('hidden');hunt.classList.remove('enter');void hunt.offsetWidth;hunt.classList.add('enter');hunt.scrollTop=0;
    $('#opts').addEventListener('click',function(e){var btn=e.target.closest('button');if(btn)answer(q,+btn.dataset.i,'pick')});
    $('#ddBtn').addEventListener('click',function(){if(dd)return;dd=true;this.classList.add('armed');this.innerHTML='UMPAN AKTIF · DAMAGE & GEMS 2×';$('#bet').classList.add('dd');$('#bet').textContent='2× · '+q.bet+'%';
      var left=Math.max(0,T.end-performance.now());var ms=Math.min(left,5000);startTimer(ms,function(){answer(q,-1,'timeout')});T.total=5000;safe(sfx.arm);vib([20,20,20]);shake('shake-hit')});
    $('#pawBtn').addEventListener('click',function(){answer(q,-1,'paw')});
    startTimer(8000,function(){answer(q,-1,'timeout')});
  }
  function lockOpts(q,i){var opts=$('#opts').children;for(var k=0;k<opts.length;k++){opts[k].disabled=true;if(k===q.ans){opts[k].classList.add('ok');opts[k].lastChild.textContent='BENAR'}else if(k===i){opts[k].classList.add('ko');opts[k].lastChild.textContent='KAMU'}else opts[k].classList.add('dim')}
    $('#ddBtn').disabled=true;$('#pawBtn').disabled=true}
  function hpRow(b,before,after){return '<div class="hp">HP '+b.name+' <span class="bar"><i style="width:'+before+'%"></i></span><span class="num">'+before+'% → <span class="drop">'+after+'%</span>'+(after<=0?' · <b>FOSIL</b>':'')+'</span></div>'}
  function answer(q,i,mode){
    if(answer.locked)return;answer.locked=true;stopTimer();
    var b=BUGS[q.bug],fb=$('#fb'),next=$('#next'),mini=$('#mini'),before=b.hp,ok=mode==='pick'&&i===q.ans;
    lockOpts(q,i);
    if(mode==='paw'){
      results[idx]='paw';
      safe(sfx.soft);
      fb.className='fb help';
      fb.innerHTML='<div class="tag">PAW TURUN TANGAN · TANPA ROASTING</div><div class="pawrow">'+pawSVG(true)+'<div><div class="say">Nggak apa-apa bingung. Jujur nggak tahu lebih keren daripada nebak.</div>'+
        '<div class="why">Jawabannya <b>'+q.opts[q.ans]+'</b>. '+q.why+'</div></div></div>';
    }else if(ok){
      var dmg=dd?50:25,g=dd?24:12;b.hp=Math.max(0,b.hp-dmg);gems+=g;results[idx]='ok';
      var r=mini.getBoundingClientRect();
      safe(sfx.crack);vib(dd?[30,40,90,40,60]:[25,30,70]);
      shatter(r.left+r.width/2,r.top+r.height/2,b.color,dd);mini.classList.add('pop');flash(true);shake('shake-hit');
      fb.className='fb win';
      fb.innerHTML='<div class="tag">BUG PECAH · TEBAKAN '+q.bet+'% MELESET'+(dd?' · UMPAN 2× BERHASIL':'')+'</div>'+
        '<div class="say">'+b.name+' salah nebak. <b>−'+dmg+' HP</b> · <b>+'+g+' gems</b></div>'+hpRow(b,before,b.hp)+
        '<div class="why"><b>PAW:</b> '+q.why+'</div>';
    }else{
      var hit=dd?16:8;b.hp=Math.min(100,b.hp+hit);results[idx]='ko';
      safe(mode==='timeout'?sfx.buzz:sfx.bite);vib([90,40,140]);
      flash(false);shake('shake');mini.classList.add('bite');
      var chosen=i>=0?q.opts[i]:null;
      var say=mode==='timeout'?'Kehabisan waktu. Ragu-ragu itu makanan gue juga.':((q.taunt&&q.taunt[chosen])||('Kena. <b>'+chosen+'</b>. Persis yang gue tebak.'));
      fb.className='fb lose';
      fb.innerHTML='<div class="tag">DIGIGIT · '+b.name.toUpperCase()+' MENANG TARUHAN'+(dd?' · UMPAN GAGAL':'')+'</div>'+
        '<div class="say">'+say+'</div>'+hpRow(b,before,b.hp)+
        '<div class="why"><b>PAW:</b> '+q.why+'</div>';
    }
    hpDelta.push(b.hp-before);
    requestAnimationFrame(function(){fb.classList.add('on');var bar=fb.querySelector('.bar i');if(bar)setTimeout(function(){bar.style.width=b.hp+'%'},120);fb.scrollIntoView({behavior:'smooth',block:'nearest'})});
    next.textContent=idx<Q.length-1?'BUG BERIKUTNYA →':'LIHAT LAPORAN PERBURUAN →';
    next.classList.remove('hidden');
    next.onclick=function(){answer.locked=false;idx++;idx<Q.length?runBeat(Q[idx],function(){renderQ(Q[idx])}):renderResult()};
  }

  /* ---------------- LAPORAN PERBURUAN ---------------- */
  function verdict(pecah,gigit){
    if(pecah===5)return{t:'SEMPURNA',c:'gold'};if(pecah>=3)return{t:'PEMBURU',c:'mint'};if(pecah>=1)return{t:'BERTAHAN',c:''};return{t:'DIGIGIT HABIS',c:''}}
  function renderResult(){
    var pecah=results.filter(function(r){return r==='ok'}).length,gigit=results.filter(function(r){return r==='ko'}).length,bantu=results.length-pecah-gigit;
    var acc=pecah+gigit?Math.round(pecah/(pecah+gigit)*100):0,v=verdict(pecah,gigit),got=gems-340;
    var date=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'});
    hunt.innerHTML='<div class="res"><div class="report" id="report">'+
      '<div class="hd"><b>FIEZEL</b><span>LAPORAN PERBURUAN · '+date.toUpperCase()+'</span></div>'+
      '<h2>Sarang Fitra</h2><div class="sub">'+pecah+' bug pecah · '+gigit+' lolos'+(bantu?' · '+bantu+' dibantu PAW':'')+'</div>'+
      '<div class="stamp '+v.c+'">'+v.t+'</div>'+
      '<div class="stats"><div><b>'+acc+'%</b><small>AKURASI</small></div><div><b>'+pecah+'/5</b><small>PECAH</small></div><div><b>+'+got+'</b><small>GEMS</small></div></div>'+
      '<div class="list">'+Q.map(function(q,i){var b=BUGS[q.bug],r=results[i];return '<div class="'+(r==='ok'?'pecah':r==='ko'?'gigit':'bantu')+'">'+bugSVG(b,30)+b.name+' <small style="color:#8A7F79;font-weight:700">R'+(i+1)+'</small><span>'+(r==='ok'?'PECAH':r==='ko'?'MENGGIGIT':'DIBANTU PAW')+'</span></div>'}).join('')+'</div>'+
      '<div class="ft"><span>fiezel.my.id · #BuruBug</span><span class="paw-mini">'+pawSVG(true)+'</span></div>'+
      '</div>'+
      '<div class="share"><button class="wa" id="shareBtn" data-testid="share-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.1.6 2.7.5a2.3 2.3 0 0 0 1.5-1.1c.2-.5.2-1 .1-1.1l-.4-.3z"/></svg>BAGIKAN KE WHATSAPP</button>'+
      '<button class="back" id="back" data-testid="back-btn">SARANG</button></div></div>';
    setTimeout(function(){safe(sfx.stamp);vib(30)},350);
    $('#back').onclick=function(){hunt.classList.add('hidden');document.body.classList.remove('dark');idx=0;results=[];hpDelta=[];renderSarang();scrollTo({top:0,behavior:'smooth'})};
    $('#shareBtn').onclick=function(){shareCard(pecah,gigit,bantu,acc,v,got,date)};
  }

  /* ---------------- kartu share (Canvas 2D → PNG → Web Share) ---------------- */
  function svgImage(svg){return new Promise(function(res){var img=new Image();img.onload=function(){res(img)};img.onerror=function(){res(null)};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '))})}
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function shareCard(pecah,gigit,bantu,acc,v,got,date){
    var W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
    var F='900 %dpx "Nunito","Avenir Next","Segoe UI",system-ui,sans-serif';
    Promise.all(Q.map(function(q){return svgImage(bugSVG(BUGS[q.bug],120))}).concat([svgImage(pawSVG(true))])).then(function(imgs){
      g.fillStyle='#2E2724';g.fillRect(0,0,W,H);
      var rg=g.createRadialGradient(540,300,50,540,300,700);rg.addColorStop(0,'rgba(155,58,74,.45)');rg.addColorStop(1,'rgba(155,58,74,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
      g.fillStyle='#FBF7F3';rr(g,70,120,940,1110,44);g.fill();
      g.fillStyle='#9B3A4A';g.font=F.replace('%d','30');g.fillText('F I E Z E L',120,190);
      g.fillStyle='#8A7F79';g.font=F.replace('%d','22');g.textAlign='right';g.fillText('LAPORAN PERBURUAN · '+date.toUpperCase(),960,190);g.textAlign='left';
      g.fillStyle='#2E2724';g.font=F.replace('%d','78');g.fillText('Sarang Fitra',120,300);
      g.fillStyle='#8A7F79';g.font='800 30px system-ui,sans-serif';g.fillText(pecah+' bug pecah · '+gigit+' lolos'+(bantu?' · '+bantu+' dibantu PAW':''),120,350);
      // stempel
      g.save();g.translate(800,300);g.rotate(-.21);var col=v.c==='gold'?'#B8860B':v.c==='mint'?'#3E8E75':'#9B3A4A';g.strokeStyle=col;g.lineWidth=9;g.font=F.replace('%d','44');var tw=g.measureText(v.t).width;rr(g,-tw/2-28,-46,tw+56,84,16);g.stroke();g.fillStyle=col;g.textAlign='center';g.fillText(v.t,0,16);g.restore();g.textAlign='left';
      // stats
      [[acc+'%','AKURASI'],[pecah+'/5','PECAH'],['+'+got,'GEMS']].forEach(function(s,i){var x=120+i*300;g.fillStyle='#F3ECE4';rr(g,x,400,270,150,28);g.fill();g.fillStyle='#2E2724';g.font=F.replace('%d','64');g.textAlign='center';g.fillText(s[0],x+135,470);g.fillStyle='#8A7F79';g.font=F.replace('%d','22');g.fillText(s[1],x+135,520);g.textAlign='left'});
      // daftar bug
      Q.forEach(function(q,i){var y=590+i*108,b=BUGS[q.bug],r=results[i];g.fillStyle='rgba(46,39,36,.05)';rr(g,120,y,840,92,22);g.fill();
        var im=imgs[i];if(im){g.save();if(r==='ok')g.globalAlpha=.45;g.drawImage(im,140,y+6,80,80);g.restore()}
        g.fillStyle='#2E2724';g.font=F.replace('%d','34');g.fillText(b.name,240,y+58);
        g.fillStyle='#8A7F79';g.font='800 24px system-ui,sans-serif';g.fillText('RONDE '+(i+1)+' · '+b.tag,240+g.measureText(b.name).width+120,y+58);
        var st=r==='ok'?['PECAH','#3E8E75']:r==='ko'?['MENGGIGIT','#9B3A4A']:['DIBANTU PAW','#6E8FB0'];g.fillStyle=st[1];g.font=F.replace('%d','24');g.textAlign='right';g.fillText(st[0],930,y+58);g.textAlign='left'});
      g.fillStyle='#8A7F79';g.font=F.replace('%d','24');g.fillText('fiezel.my.id  ·  #BuruBug  ·  Bug = kebiasaan salah yang tinggal di kepalamu',120,1185);
      if(imgs[5])g.drawImage(imgs[5],880,1120,90,90);
      c.toBlob(function(blob){
        var file=new File([blob],'fiezel-laporan-perburuan.png',{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Laporan Perburuan Sarang',text:'Sarang gue hari ini: '+pecah+' bug pecah, '+gigit+' lolos. Berani buru bug lo sendiri? fiezel.my.id #BuruBug'}).catch(function(){})}
        else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fiezel-laporan-perburuan.png';document.body.appendChild(a);a.click();a.remove();toast('Gambar laporan tersimpan — kirim ke grup kelas!')}
      },'image/png');
    });
  }

  $('#cta').addEventListener('click',function(){
    safe(ac);idx=0;results=[];hpDelta=[];answer.locked=false;
    runBeat(Q[0],function(){renderQ(Q[0])});
  });
})();
</script>
