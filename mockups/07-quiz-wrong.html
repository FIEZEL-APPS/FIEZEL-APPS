<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
<style>
.q{font-size:24px;font-weight:700;line-height:1.35;margin-top:14px}
.q u{text-decoration:none;background:var(--bad-soft);border-bottom:3px solid var(--bad);padding:0 6px;border-radius:6px;color:var(--bad)}
.sheet .paw{width:74px;position:absolute;right:18px;top:-44px}
.sheet h3{color:var(--bad);font-size:22px}
.sheet .why{margin-top:10px;font-size:14px}
.cmp{display:flex;gap:8px;margin-top:12px}
.cmp span{flex:1;padding:10px 12px;border-radius:14px;font-weight:700;font-size:14px;text-align:center}
.cmp .no{background:#fff;color:var(--bad);text-decoration:line-through;border:1px solid #F6D3C9}
.cmp .yes{background:var(--good-soft);color:var(--good);border:1px solid #CDE9DD}
.acts{display:flex;gap:10px;margin-top:16px}
.acts .btn{flex:1}
</style></head><body>
<div class="screen">
  <div class="toprow">
    <span class="iconbtn"><i data-lucide="x" class="i"></i></span>
    <div style="flex:1"><div class="dots"><i class="g"></i><i class="g"></i><i class="b"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="b"></i><i></i><i></i></div></div>
    <span class="chip flame" style="opacity:.5"><i data-lucide="flame" class="i sm"></i>0</span>
  </div>
  <div class="mt-3">
    <span class="eyebrow">Lesson 4 · Present Simple · soal 8/10</span>
    <p class="q">My brother <u>don't</u> like coffee.</p>
  </div>
  <div class="stack mt-3">
    <div class="opt bad"><span class="k"><i data-lucide="x" class="i sm"></i></span>don't</div>
    <div class="opt good"><span class="k"><i data-lucide="check" class="i sm"></i></span>doesn't</div>
    <div class="opt dim"><span class="k">C</span>isn't</div>
    <div class="opt dim"><span class="k">D</span>not</div>
  </div>
  <div class="sheet bad">
    <img class="paw" src="/assets/brand/paw-mascot-full.svg" alt="">
    <span class="eyebrow" style="color:var(--bad)">Hampir</span>
    <h3>Nggak apa-apa, ini yang sering ketuker.</h3>
    <div class="cmp"><span class="no">don't</span><span class="yes">doesn't</span></div>
    <p class="why"><b>My brother</b> = he. Untuk he/she/it, kalimat negatif pakai <b>doesn't</b>, kata kerjanya kembali ke bentuk dasar.</p>
    <div class="acts"><a class="btn ghost">Contoh lain</a><a class="btn ink">Lanjut <i data-lucide="arrow-right" class="i sm"></i></a></div>
  </div>
</div>
<script src="/lucide.min.js"></script><script>lucide.createIcons()</script></body></html>
