<title>FIEZEL — Halaman tidak ditemukan</title>
<script>
/* GitHub Pages project site ini hidup di /FIEZEL-APPS/ dan path-nya case-sensitive.
   Pengguna yang mengetik fitrajft-ux.github.io/fiezel-apps (huruf kecil) mendarat di 404 ini.
   Bila segmen repo pada path cocok dengan "fiezel-apps" tanpa memedulikan besar-kecil huruf
   tetapi penulisannya belum persis "FIEZEL-APPS", perbaiki case segmen itu dan alihkan
   otomatis — query string dan hash dipertahankan apa adanya. Redirect dijalankan sebelum
   render supaya pengguna nyaris tidak melihat halaman ini. */
(function () {
  var CANON = 'FIEZEL-APPS';
  try {
    var segs = window.location.pathname.split('/');
    if (segs.length > 1 && segs[1] !== CANON && segs[1].toLowerCase() === CANON.toLowerCase()) {
      segs[1] = CANON;
      window.location.replace(segs.join('/') + window.location.search + window.location.hash);
    }
  } catch (_) { /* biarkan fallback manual di bawah yang bekerja */ }
})();
</script>

</style>
