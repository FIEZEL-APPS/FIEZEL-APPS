<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>FIEZEL — Latihan selesai (redesign D)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="d.css">
<style>
  .content{justify-content:flex-start;gap:10px;padding:14px 16px}
</style>
</head>
<body>
<div class="phone">

  <!-- topbar -->
  <header class="topbar">
    <span class="wordmark" aria-label="FIEZEL">F<span class="wm-i" aria-hidden="true"><i></i><i></i></span>EZEL</span>
    <div class="top-actions">
      <button class="ask-btn">
        <svg class="ic s16" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>
        Tanya FIEZEL
      </button>
      <button class="icon-btn" aria-label="Pengaturan">
        <svg class="ic" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
      </button>
    </div>
  </header>

  <main class="content">

    <!-- kartu perayaan -->
    <section class="card celebrate" aria-label="Hasil sesi">
      <svg class="confetti" viewBox="0 0 358 120" aria-hidden="true" preserveAspectRatio="xMidYMin slice">
        <circle cx="34" cy="34" r="4" fill="#FFC700"/>
        <rect x="72" y="14" width="7" height="7" rx="2" fill="#B8432D" transform="rotate(18 75 17)"/>
        <path d="M310 18 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#FFA500"/>
        <circle cx="336" cy="58" r="3.4" fill="#B8432D" opacity=".8"/>
        <rect x="290" y="86" width="6" height="6" rx="2" fill="#FFC700" transform="rotate(-20 293 89)"/>
        <circle cx="20" cy="86" r="3" fill="#FFA500"/>
        <path d="M118 6 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 Z" fill="#FFDE59"/>
      </svg>

      <p class="eyebrow">Session Complete</p>
      <h1 class="h1" style="margin-top:5px">Latihan selesai, Rara!</h1>

      <div class="ring-row">
        <!-- ring skor -->
        <div class="ring" role="img" aria-label="Skor sesi 84 persen">
          <svg viewBox="0 0 148 148" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFDE59"/><stop offset="100%" stop-color="#FFA500"/>
              </linearGradient>
            </defs>
            <circle cx="74" cy="74" r="63" fill="none" stroke="var(--line-soft)" stroke-width="13"/>
            <circle cx="74" cy="74" r="63" fill="none" stroke="url(#ringGrad)" stroke-width="13"
                    stroke-linecap="round" stroke-dasharray="332.5 395.8"/>
          </svg>
          <div class="rv"><b>84%</b><span>SKOR SESI</span></div>
        </div>

        <!-- maskot celebrating (mata happy + mulut terbuka + bintang) -->
        <svg class="mascot-cel" viewBox="0 0 320 300" role="img" aria-label="PAW merayakan">
          <ellipse cx="160" cy="284" rx="86" ry="10" fill="#000" opacity=".08"/>
          <path d="M212 244 C 266 258 298 238 296 200 C 295 180 284 164 268 158" stroke="#EDB93A" stroke-width="25" fill="none" stroke-linecap="round"/>
          <rect x="102" y="164" width="116" height="96" rx="42" fill="#FFD94F"/>
          <ellipse cx="132" cy="257" rx="24" ry="11" fill="#EDB93A"/>
          <ellipse cx="188" cy="257" rx="24" ry="11" fill="#EDB93A"/>
          <ellipse cx="160" cy="226" rx="36" ry="28" fill="#FFF4DA"/>
          <g transform="translate(160,224)" fill="#8C2233">
            <ellipse cx="0" cy="5" rx="10" ry="8"/>
            <circle cx="-10" cy="-7" r="4"/><circle cx="0" cy="-10" r="4"/><circle cx="10" cy="-7" r="4"/>
          </g>
          <path d="M76 66 L 95 0 L 140 34 Z" fill="#FFD94F"/><path d="M90 52 L 101 17 L 125 35 Z" fill="#8C2233"/>
          <path d="M244 66 L 225 0 L 180 34 Z" fill="#FFD94F"/><path d="M230 52 L 219 17 L 195 35 Z" fill="#8C2233"/>
          <circle cx="160" cy="106" r="88" fill="#FFD94F"/>
          <ellipse cx="160" cy="140" rx="36" ry="25" fill="#FFF4DA"/>
          <path d="M153 126 L 167 126 L 160 136 Z" fill="#8C2233"/>
          <circle cx="102" cy="126" r="11" fill="#F0A0AC"/><circle cx="218" cy="126" r="11" fill="#F0A0AC"/>
          <!-- mata happy (celebrating) -->
          <path d="M112 101 C 119 90 133 90 140 101" stroke="#33201F" stroke-width="7" stroke-linecap="round" fill="none"/>
          <path d="M180 101 C 187 90 201 90 208 101" stroke="#33201F" stroke-width="7" stroke-linecap="round" fill="none"/>
          <!-- mulut terbuka senang -->
          <path d="M145 146 C 148 162 172 162 175 146 C 165 150 155 150 145 146 Z" fill="#33201F"/>
          <!-- lengan kiri diangkat -->
          <g transform="rotate(-38 122 236)"><ellipse cx="122" cy="206" rx="14" ry="30" fill="#FFD94F"/></g>
          <ellipse cx="198" cy="206" rx="14" ry="30" fill="#FFD94F"/>
          <!-- bintang perayaan -->
          <g fill="#D8B36B">
            <path d="M42 46 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
            <path d="M282 78 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 Z"/>
            <path d="M258 6 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#D9536A"/>
          </g>
        </svg>
      </div>

      <div class="gain-rows">
        <div class="gain">
          <span class="gi good"><svg class="ic s16" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
          <p><b class="num">21 dari 25</b> benar pada percobaan pertama.</p>
        </div>
        <div class="gain">
          <span class="gi sun"><svg class="ic s16" viewBox="0 0 24 24"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></span>
          <p>Kamu melewati <b class="num">3 hal</b> yang tadinya bikin keliru.</p>
        </div>
      </div>
    </section>

    <!-- tombol lanjut -->
    <button class="btn btn-primary">Lanjut lesson berikutnya
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <button class="btn btn-ghost">Kembali ke Home</button>
    <p class="sub" style="text-align:center;padding:4px 24px 0">Progres sudah masuk ke profil skill dan latihan adaptif berikutnya.</p>

  </main>

  <!-- toast BARU: ink + krem (perbaikan audit: toast navy gagal kontras) -->
  <div class="toast" role="status">
    <span class="ti"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
    <p>Progres tersimpan untuk rekomendasi berikutnya.</p>
  </div>

  <!-- bottom nav -->
  <nav class="bottom-nav" aria-label="Navigasi utama">
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Home</button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m9 16 3-8 3 8"/><path d="M10 13.5h4"/></svg>Vocab</button>
    <button class="nav-item is-on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Grammar</button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Reading</button>
    <button class="nav-item"><svg viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>Peta</button>
  </nav>

</div>
</body>
</html>
