<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 -10 208 216" role="img"
     aria-label="PAW — ikon kepala maskot FIEZEL (master rig, neutral state)">
  <!-- ============================================================
       FIEZEL PAW — HEAD-ONLY MASTER EXPORT (neutral state)
       Derivation: the fz-head subtree of assets/paw-master.svg,
       byte-equal geometry, cropped to the production head-crop
       viewBox of assets/brand/paw-mascot-head.svg (56 -10 208 216).
       Carries the full head rig (ears, lids, pupils, brows, 10-shape
       mouth set) so head-crop usages stay animation-ready.
       Clip ids namespaced -head; per-instance-uid required if inlined
       ([P0-1] rule). See assets/README.md.
       ============================================================ -->
  <defs>
    <clipPath id="fzcEyeL-head"><circle cx="126" cy="98" r="16"/></clipPath>
    <clipPath id="fzcEyeR-head"><circle cx="194" cy="98" r="16"/></clipPath>
  </defs>

  <g id="paw-head" class="fz-head"><!-- P2: tx -6..6, ty -4..4; neutral 0,0 -->
    <g id="paw-ear-l" class="fz-ear fz-ear-l"><!-- P3: rotate @ (108,52); literal - = perk, + = droop; -14..+18 -->
      <path id="paw-ear-l-outer" d="M76 66 L95 0 L140 34 Q104 66 76 66 Z" fill="#FFD94F"/>
      <path id="paw-ear-l-inner" d="M90 52 L 101 17 L 125 35 Z" fill="#8C2233"/>
    </g>
    <g id="paw-ear-r" class="fz-ear fz-ear-r"><!-- P4: rotate @ (212,52); literal + = perk, - = droop; -18..+14 -->
      <path id="paw-ear-r-outer" d="M244 66 L225 0 L180 34 Q216 66 244 66 Z" fill="#FFD94F"/>
      <path id="paw-ear-r-inner" d="M230 52 L 219 17 L 195 35 Z" fill="#8C2233"/>
    </g>
    <circle id="paw-skull" cx="160" cy="106" r="88" fill="#FFD94F"/>

    <g id="paw-face" class="fz-face">
