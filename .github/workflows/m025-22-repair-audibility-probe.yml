name: m025-22 Audibility Probe Repair
on:
  push:
    branches:
      - master/perf39-real-wasm-proxy-m02522
    paths:
      - '.github/workflows/m025-22-repair-audibility-probe.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject explicit VM runtime into adapter probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('neural-voice-audibility-test.js')
          text=p.read_text()
          old="wasmBasePath:'./vendor/kokoro-js/wasm/',dtype:'q8',device:'wasm',onStage:entry=>stages.push(entry)"
          new="wasmBasePath:'./vendor/kokoro-js/wasm/',dtype:'q8',device:'wasm',runtime:ctx,onStage:entry=>stages.push(entry)"
          if new not in text:
            if old not in text:
              raise SystemExit('audibility adapter probe source not found')
            text=text.replace(old,new,1)
          p.write_text(text)
          PY
          node --check neural-voice-audibility-test.js
          node neural-voice-audibility-test.js
      - name: Commit repaired audibility harness
        shell: bash
        run: |
          git config user.name 'FIEZEL MASTER CI'
          git config user.email 'actions@users.noreply.github.com'
          git add neural-voice-audibility-test.js
          git diff --cached --quiet && exit 0
          git commit -m 'test: inject runtime into audibility proxy probe'
          git push origin HEAD:master/perf39-real-wasm-proxy-m02522
