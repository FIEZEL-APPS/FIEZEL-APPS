name: m025-25 ORT non-JSEP bootstrap

on:
  push:
    branches:
      - master/perf67-m02525-runtime-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Extract source-locked ORT package
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION='1.22.0-dev.20250409-89f8206ba4'
          mkdir -p .m02525/pack .m02525/out
          cd .m02525/pack
          npm pack "onnxruntime-web@${ORT_VERSION}" --silent > pack-name.txt
          PKG="$(cat pack-name.txt)"
          tar -xzf "$PKG"
          cp package/dist/ort-wasm-simd-threaded.mjs ../out/
          cp package/dist/ort-wasm-simd-threaded.wasm ../out/
          cp package/dist/ort-wasm-simd-threaded.jsep.mjs ../out/
          cp package/dist/ort-wasm-simd-threaded.jsep.wasm ../out/
          cd ../out
          sha256sum * | sort > SHA256SUMS
          {
            echo "ortVersion=${ORT_VERSION}"
            echo "source=npm:onnxruntime-web@${ORT_VERSION}"
            echo "target=Safari/WebKit CPU WASM differential"
            echo "candidateVariant=standard-non-jsep"
            echo "controlVariant=jsep"
          } > MANIFEST.txt

      - name: Verify package and repository control provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s .m02525/out/ort-wasm-simd-threaded.mjs
          test -s .m02525/out/ort-wasm-simd-threaded.wasm
          test -s .m02525/out/ort-wasm-simd-threaded.jsep.mjs
          test -s .m02525/out/ort-wasm-simd-threaded.jsep.wasm
          cmp .m02525/out/ort-wasm-simd-threaded.jsep.mjs vendor/kokoro-js/wasm/ort-wasm-simd-threaded.jsep.mjs
          cmp .m02525/out/ort-wasm-simd-threaded.jsep.wasm vendor/kokoro-js/wasm/ort-wasm-simd-threaded.jsep.wasm
          test "$(sha256sum .m02525/out/ort-wasm-simd-threaded.wasm | cut -d' ' -f1)" != "$(sha256sum .m02525/out/ort-wasm-simd-threaded.jsep.wasm | cut -d' ' -f1)"
          cat .m02525/out/MANIFEST.txt
          cat .m02525/out/SHA256SUMS

      - name: Upload exact non-JSEP bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: m02525-ort-nonjsep-1.22.0-dev-89f8206ba4
          path: .m02525/out/
          if-no-files-found: error
          retention-days: 30
