name: One-shot Neural Device Hotfix
on:
  push:
    branches:
      - agent/neural-voice-device-hotfix-20260815
permissions:
  contents: write
jobs:
  hotfix:
    if: ${{ github.event.head_commit.message != 'Apply neural device hotfix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neural-voice-device-hotfix-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded device hotfix
        run: |
          python .github/neural-device-hotfix.py
          python .github/neural-device-hotfix-fixup.py
      - name: Validate targeted neural hotfix
        run: |
          node --check features/neural-voice/fiezel-neural-voice-bootstrap.js
          node --check features/neural-voice/fiezel-neural-voice-audibility-fix.js
          node --check sw.js
          node neural-voice-device-hotfix-test.js
          node neural-voice-fix-test.js
          node neural-voice-product-repair-test.js
          node neural-voice-audibility-test.js
          node neural-voice-test.js
          node ios-cache-compat-test.js
          node sw-corp-test.js
          node diag-panel-test.js
          python release-audit.py
      - name: Commit validated hotfix
        run: |
          git config user.name 'fitrarustqi'
          git config user.email 'fitrajft@gmail.com'
          git add app.js sw.js features/neural-voice/fiezel-neural-voice-bootstrap.js features/neural-voice/fiezel-neural-voice-audibility-fix.js features/neural-voice/fiezel-diag-panel.js sw-corp-test.js neural-voice-product-repair-test.js neural-voice-device-hotfix-test.js neural-voice-test.js
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- version.js VERSION.json)"
          git commit -m 'Apply neural device hotfix'
          git push origin HEAD:agent/neural-voice-device-hotfix-20260815
