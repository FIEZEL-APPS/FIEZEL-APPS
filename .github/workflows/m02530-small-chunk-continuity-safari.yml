name: m025-30 small chunk continuity Safari

on:
  push:
    branches:
      - master/perf67-m02530-small-chunk-continuity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari26:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple runner
        run: |
          set -euo pipefail
          sw_vers
          /usr/bin/safaridriver --version
          /usr/bin/arch
      - name: Create continuity benchmark page
        run: |
          cat > .m02530-bench.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-30 continuity</title>
          <script src="./features/neural-voice/fiezel-neural-voice.js"></script>
          <script src="./features/neural-voice/fiezel-kokoro-adapter.js"></script>
          <script type="module">
          const SAMPLE_RATE=24000;
          const events=[]; window.__benchResult=null; window.__benchStatus='boot';
          const finish=x=>{window.__benchResult=x;window.__benchStatus=x.success?'done':'error'};
          const text='The learner explains the main idea clearly and supports it with one useful example. Then the learner connects the evidence to the conclusion.';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          try{
            const mod=await import('./vendor/kokoro-js/kokoro.web.js?nv=m025-22');
            mod.env.wasmEnv.numThreads=1; mod.env.wasmEnv.proxy=true;
            const runtime={navigator:{standalone:true,gpu:navigator.gpu||null},crossOriginIsolated:false,matchMedia(){return{matches:true}}};
            const adapter=FiezelKokoroAdapter.createKokoroAdapter({KokoroTTS:mod.KokoroTTS,kokoroEnv:mod.env,setVoiceDataUrl:mod.setVoiceDataUrl,
              modelId:'kokoro-model',localModelPath:'./vendor/',voiceBaseUrl:'./vendor/kokoro-model/voices',wasmBasePath:location.origin+'/vendor/kokoro-js/wasm/',runtimeOrigin:location.origin,
              runtime,dtype:'q8',device:'wasm',onStage:e=>events.push({t:performance.now(),...e})});
            const init0=performance.now(); await adapter.initialize(); const initMs=Math.round(performance.now()-init0);

            async function runVariant(name, firstChars, restChars){
              const baseChunks=FiezelNeuralVoice.splitIntoChunks(text,140,190,firstChars);
              const chunks=[];
              if(firstChars===restChars){ chunks.push(...baseChunks); }
              else {
                const first=baseChunks.shift(); if(first) chunks.push(first);
                const restText=baseChunks.join(' ').trim();
                if(restText) chunks.push(...FiezelNeuralVoice.splitIntoChunks(restText,140,190,restChars));
              }
              const started=performance.now();
              const rows=[];
              let prefetched=null, previousPlaybackDoneAt=null;
              async function generate(index){
                const before=events.length, t0=performance.now();
                const out=await adapter.generate(chunks[index],{voice:'af_heart',speed:1});
                const slice=events.slice(before);
                const samples=out?.audio?.length??out?.data?.length??0;
                return {out,readyAt:performance.now(),elapsedMs:Math.round(performance.now()-t0),modelMs:slice.find(e=>e.phase==='adapter_model_resolved')?.elapsedMs??null,tokenCount:slice.find(e=>e.phase==='adapter_tokenizer_resolved')?.tokenCount??null,samples};
              }
              for(let i=0;i<chunks.length;i++){
                const g=prefetched?await prefetched:await generate(i); prefetched=null;
                const playStart=performance.now();
                const audioDurationMs=Math.round((g.samples/SAMPLE_RATE)*1000);
                const stallMs=previousPlaybackDoneAt==null?0:Math.max(0,Math.round(playStart-previousPlaybackDoneAt));
                const row={index:i,chars:chunks[i].length,tokenCount:g.tokenCount,modelMs:g.modelMs,generateMs:g.elapsedMs,samples:g.samples,audioDurationMs,readyMs:Math.round(g.readyAt-started),playStartMs:Math.round(playStart-started),stallMs};
                rows.push(row);
                if(i+1<chunks.length){ await sleep(0); prefetched=generate(i+1); }
                await sleep(audioDurationMs);
                previousPlaybackDoneAt=performance.now();
              }
              const firstPlaybackStartMs=rows[0]?.playStartMs??null;
              const maxStallMs=Math.max(0,...rows.slice(1).map(r=>r.stallMs));
              const maxModelMs=Math.max(0,...rows.map(r=>Number(r.modelMs)||0));
              return {name,firstChars,restChars,chunkCount:chunks.length,chunks,rows,firstPlaybackStartMs,maxStallMs,maxModelMs,totalMs:Math.round(performance.now()-started),qualified:Boolean(firstPlaybackStartMs!=null&&firstPlaybackStartMs<=5000&&maxModelMs<=5000&&maxStallMs<=500)};
            }

            const all24=await runVariant('all-24',24,24);
            const first24Rest64=await runVariant('first-24-rest-64',24,64);
            finish({success:true,userAgent:navigator.userAgent,initMs,backend:adapter.getBackendState(),artifact:events.filter(e=>e.phase==='wasm_artifact_variant'),policy:events.filter(e=>e.phase==='wasm_policy'),variants:[all24,first24Rest64]});
          }catch(error){finish({success:false,status:window.__benchStatus,error:String(error?.stack||error),events});}
          </script>
          HTML
      - name: Start server and SafariDriver
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/m02530-http.log 2>&1 &
          sudo /usr/bin/safaridriver --enable || /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver --port 4444 >/tmp/m02530-safaridriver.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4444/status >/tmp/m02530-status.json 2>/dev/null && break; sleep 1; done
      - name: Run continuity profile
        run: |
          set -euo pipefail
          SJ="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
          SID="$(echo "$SJ"|jq -r '.value.sessionId // .sessionId // empty')"; test -n "$SID"
          curl -fsS -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:8000/.m02530-bench.html"}' "http://127.0.0.1:4444/session/$SID/url" >/dev/null
          RESULT=''
          for i in {1..300}; do
            RESP="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return window.__benchResult||null;","args":[]}' "http://127.0.0.1:4444/session/$SID/execute/sync" 2>/dev/null || true)"
            RESULT="$(echo "$RESP"|jq -c '.value // empty' 2>/dev/null || true)"
            [ -n "$RESULT" ] && [ "$RESULT" != null ] && break
            sleep 1
          done
          curl -sS -X DELETE "http://127.0.0.1:4444/session/$SID" >/dev/null || true
          test -n "$RESULT"
          echo "$RESULT"|jq .|tee m02530-continuity.json
          test "$(echo "$RESULT"|jq -r '.success')" = true
          jq -e '.variants | length == 2' m02530-continuity.json >/dev/null
          jq -r '.variants[] | [.name,.firstPlaybackStartMs,.maxModelMs,.maxStallMs,.totalMs,.qualified] | @tsv' m02530-continuity.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02530-small-chunk-continuity-${{ github.sha }}
          path: |
            m02530-continuity.json
            /tmp/m02530-http.log
            /tmp/m02530-safaridriver.log
          if-no-files-found: warn
          retention-days: 30
