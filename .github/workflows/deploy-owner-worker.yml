# Deploy Worker `fiezel-owner` (workers/owner) ke Cloudflare.
name: FIEZEL Owner Worker Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiezel-owner-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker fiezel-owner
        working-directory: workers/owner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check index.js
          node --check queries.js
          node <<'JS'
          const fs = require('fs');
          let toml = fs.readFileSync('wrangler.toml', 'utf8');
          const rblok = /\[\[routes\]\]\s*\npattern\s*=\s*"owner\.fiezel\.my\.id"[\s\S]*?custom_domain\s*=\s*true\s*\n/;
          if (rblok.test(toml)) {
            toml = toml.replace(rblok, '# (blok routes dilepas saat deploy: token CI tanpa izin zona; custom domain live tetap menempel)\n');
            fs.writeFileSync('wrangler.toml', toml);
          }
          JS
          OUTPUT=$(npx --yes wrangler@3 deploy)
          echo "$OUTPUT"
          VERSION_ID=$(echo "$OUTPUT" | grep -oE 'Current Version ID: [a-f0-9-]+' | awk '{print $4}')
          echo "Uploaded Version ID: $VERSION_ID"
          if [ -n "$VERSION_ID" ]; then
            echo "Deploying version $VERSION_ID to 100% traffic..."
            curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/fiezel-owner/deployments" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"versions\":[{\"version_id\":\"$VERSION_ID\",\"percentage\":100}]}" || echo "Deployments endpoint call attempted"
          fi
