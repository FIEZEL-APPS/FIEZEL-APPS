name: m025-22 Exact Vendor Promotion
on:
  push:
    branches:
      - master/perf39-real-wasm-proxy-m02522
    paths:
      - '.github/workflows/m025-22-promote-vendor.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild exact source-derived candidate
        shell: bash
        run: |
          set +e
          bash tools/rebuild-neural-vendor.sh
          rc=$?
          set -e
          echo "rebuild_exit=$rc"
          test -f .vendor-repro/kokoro.web.js
          actual_sha="$(sha256sum .vendor-repro/kokoro.web.js | awk '{print $1}')"
          actual_size="$(wc -c < .vendor-repro/kokoro.web.js | tr -d ' ')"
          echo "candidate_sha=$actual_sha"
          echo "candidate_size=$actual_size"
          test "$actual_sha" = '91d849dc97a2e43edab1e576721792211bc240da4d086591d42b5356959dc32f'
          test "$actual_size" = '2136728'
      - name: Promote exact candidate bytes on repair branch
        shell: bash
        run: |
          cp .vendor-repro/kokoro.web.js vendor/kokoro-js/kokoro.web.js
          test "$(sha256sum vendor/kokoro-js/kokoro.web.js | awk '{print $1}')" = '91d849dc97a2e43edab1e576721792211bc240da4d086591d42b5356959dc32f'
          git config user.name 'FIEZEL MASTER CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vendor/kokoro-js/kokoro.web.js
          git diff --cached --quiet && { echo 'Vendor already promoted'; exit 0; }
          git commit -m 'build: promote m025-22 source-derived Kokoro vendor'
          git push origin HEAD:master/perf39-real-wasm-proxy-m02522
