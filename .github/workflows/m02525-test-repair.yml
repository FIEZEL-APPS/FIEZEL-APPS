name: m025-25 test repair

on:
  push:
    branches:
      - master/perf67-m02525-runtime-matrix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master/perf67-m02525-runtime-matrix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extend legacy neural warmup fixture for the m025-25 standard WASM pair
        shell: python
        run: |
          from pathlib import Path
          path = Path('neural-voice-test.js')
          text = path.read_text()
          old = "['vendor/kokoro-js/wasm/ort-wasm-simd-threaded.jsep.wasm',21596019],['vendor/kokoro-model/config.json',45]"
          new = "['vendor/kokoro-js/wasm/ort-wasm-simd-threaded.jsep.wasm',21596019],['vendor/kokoro-js/wasm/ort-wasm-simd-threaded.mjs',20856],['vendor/kokoro-js/wasm/ort-wasm-simd-threaded.wasm',11133407],['vendor/kokoro-model/config.json',45]"
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('legacy fakeAssets anchor mismatch')
          path.write_text(text.replace(old, new, 1))
      - name: Verify focused legacy and m025-25 gates
        shell: bash
        run: |
          set -euo pipefail
          node neural-voice-test.js
          node neural-voice-m02522-real-wasm-proxy-test.js
          node neural-voice-m02524-proxy-timeout-recovery-test.js
          node neural-voice-m02525-safari-nonjsep-test.js
      - name: Publish test repair only
        shell: bash
        run: |
          set -euo pipefail
          git add neural-voice-test.js
          if git diff --cached --quiet; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: include standard ORT pair in neural warmup fixture'
          git push origin HEAD:master/perf67-m02525-runtime-matrix
