name: Braincore Standalone Runtime Gate

on:
  push:
    branches:
      - claude/braincore-ip-audit-d3uk0o
    paths:
      - 'braincore-runtime.js'
      - 'braincore-runtime-test.js'
      - 'braincore-state.js'
      - 'braincore-pipeline.js'
      - 'braincore-item-governance.js'
      - 'braincore-item-governance-test.js'
      - 'features/brain/**'
      - 'examples/braincore-standalone-demo.js'
      - '.github/workflows/braincore-runtime.yml'
  pull_request:
    paths:
      - 'braincore-runtime.js'
      - 'braincore-runtime-test.js'
      - 'braincore-state.js'
      - 'braincore-pipeline.js'
      - 'braincore-item-governance.js'
      - 'braincore-item-governance-test.js'
      - 'features/brain/**'
      - 'examples/braincore-standalone-demo.js'
      - '.github/workflows/braincore-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check braincore-state.js
          node --check braincore-item-governance.js
          node --check braincore-item-governance-test.js
          node --check braincore-runtime.js
          node --check braincore-runtime-test.js
          node --check examples/braincore-standalone-demo.js
      - name: Item admission and quarantine invariants
        run: node braincore-item-governance-test.js
      - name: Standalone runtime behavior
        run: node braincore-runtime-test.js
      - name: Standalone integration demo
        run: |
          node examples/braincore-standalone-demo.js > /tmp/braincore-demo.json
          node -e "const d=require('/tmp/braincore-demo.json'); if(!d.healthy||d.restoredRevision!==5||d.runtimeSchema!=='fiezel-braincore-runtime-v1'||d.stateSchema!=='fiezel-braincore-state-v1') process.exit(1); console.log('BraincoreDemo: PASS · revision='+d.restoredRevision+' · persistedBytes='+d.persistedBytes)"
