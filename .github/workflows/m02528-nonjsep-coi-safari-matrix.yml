name: m025-28 non-JSEP COI Safari matrix

on:
  push:
    branches:
      - master/perf67-m02528-nonjsep-coi-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari26:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          /usr/bin/safaridriver --version
          /usr/bin/arch

      - name: Create isolated server and benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat > .m02528-server.py <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Cross-Origin-Opener-Policy','same-origin')
                  self.send_header('Cross-Origin-Embedder-Policy','require-corp')
                  self.send_header('Cross-Origin-Resource-Policy','same-origin')
                  self.send_header('Cache-Control','no-store')
                  super().end_headers()
          ThreadingHTTPServer(('127.0.0.1',8000),Handler).serve_forever()
          PY
          cat > .m02528-bench.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-28</title>
          <script src="./features/neural-voice/fiezel-kokoro-adapter.js"></script>
          <script type="module">
          const q=new URL(location.href).searchParams, threads=Number(q.get('threads')||1), proxy=q.get('proxy')==='1';
          const events=[]; window.__benchResult=null; window.__benchStatus='boot';
          const finish=x=>{window.__benchResult=x;window.__benchStatus=x.success?'done':'error'};
          try{
            const mod=await import('./vendor/kokoro-js/kokoro.web.js?nv=m025-22');
            if(!globalThis.crossOriginIsolated)throw new Error('crossOriginIsolated=false');
            mod.env.wasmEnv.numThreads=threads; mod.env.wasmEnv.proxy=proxy;
            const runtime={navigator:{standalone:true,gpu:navigator.gpu||null},crossOriginIsolated:true,matchMedia(){return{matches:true}}};
            const adapter=FiezelKokoroAdapter.createKokoroAdapter({KokoroTTS:mod.KokoroTTS,kokoroEnv:mod.env,setVoiceDataUrl:mod.setVoiceDataUrl,
              modelId:'kokoro-model',localModelPath:'./vendor/',voiceBaseUrl:'./vendor/kokoro-model/voices',wasmBasePath:location.origin+'/vendor/kokoro-js/wasm/',runtimeOrigin:location.origin,
              runtime,dtype:'q8',device:'wasm',onStage:e=>events.push({t:Date.now(),...e})});
            window.__benchStatus='init';const i0=performance.now();await adapter.initialize();const initMs=Math.round(performance.now()-i0);
            const text='The learner explains the main idea clearly and supports it with one example.',times=[],samples=[];
            for(let n=0;n<3;n++){window.__benchStatus='generate-'+(n+1);const t0=performance.now();const out=await adapter.generate(text,{voice:'af_heart',speed:1});times.push(Math.round(performance.now()-t0));samples.push(out?.audio?.length??out?.data?.length??null);}
            finish({success:true,threads,proxy,initMs,times,samples,crossOriginIsolated:globalThis.crossOriginIsolated,sharedArrayBuffer:typeof SharedArrayBuffer==='function',
              modelMs:events.filter(e=>e.phase==='adapter_model_resolved').map(e=>e.elapsedMs),generateMs:events.filter(e=>e.phase==='adapter_generate_resolved').map(e=>e.elapsedMs),
              artifact:events.filter(e=>e.phase==='wasm_artifact_variant'),policy:events.filter(e=>e.phase==='wasm_policy'),backend:adapter.getBackendState()});
          }catch(error){finish({success:false,threads,proxy,status:window.__benchStatus,error:String(error?.stack||error),events});}
          </script>
          HTML

      - name: Start Safari
        shell: bash
        run: |
          set -euo pipefail
          python3 .m02528-server.py >/tmp/m02528-http.log 2>&1 &
          sudo /usr/bin/safaridriver --enable || /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver --port 4444 >/tmp/m02528-safaridriver.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4444/status >/tmp/m02528-status.json 2>/dev/null && break; sleep 1; done

      - name: Run non-JSEP isolated matrix
        shell: bash
        run: |
          set -euo pipefail
          run_one(){
            local threads="$1" proxy="$2"; local label="t${threads}-p${proxy}" out="m02528-${label}.json" sj sid resp result=''
            sj="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
            sid="$(echo "$sj"|jq -r '.value.sessionId // .sessionId // empty')"; test -n "$sid"
            curl -fsS -H 'Content-Type: application/json' -d "{\"url\":\"http://127.0.0.1:8000/.m02528-bench.html?threads=$threads&proxy=$proxy\"}" "http://127.0.0.1:4444/session/$sid/url" >/dev/null
            for i in {1..150}; do resp="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return window.__benchResult||null;","args":[]}' "http://127.0.0.1:4444/session/$sid/execute/sync" 2>/dev/null || true)"; result="$(echo "$resp"|jq -c '.value // empty' 2>/dev/null || true)"; [ -n "$result" ] && [ "$result" != null ] && break; sleep 1; done
            curl -sS -X DELETE "http://127.0.0.1:4444/session/$sid" >/dev/null || true
            if [ -z "$result" ]; then result="{\"success\":false,\"threads\":$threads,\"proxy\":$([ "$proxy" = 1 ]&&echo true||echo false),\"error\":\"no_terminal_result\"}"; fi
            echo "$result"|jq .|tee "$out"
          }
          run_one 2 1
          run_one 4 1
          run_one 4 0
          jq -s '[.[]|{threads,proxy,success,initMs,modelMs,generateMs,samples,artifact,policy}]' m02528-t*-p*.json | tee m02528-summary.json
          BEST="$(jq -s '[.[]|select(.success==true)|.modelMs[1:][]?]|if length==0 then 999999 else min end' m02528-t*-p*.json)"
          echo "best_warm_model_ms=$BEST"
          test "$BEST" -le 5000

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02528-nonjsep-coi-${{ github.sha }}
          path: |
            m02528-t*-p*.json
            m02528-summary.json
            /tmp/m02528-http.log
            /tmp/m02528-safaridriver.log
          if-no-files-found: warn
          retention-days: 30
