name: FIEZEL Nightwatch
# Nightwatch (D19, wave D): patroli malam yang menjalankan suite gate inti setiap
# 01:00 WIB, terlepas dari ada/tidaknya push. Motivasi: repo bergerak ~74 commit/hari
# (peta D10) dan drift lintas-branch bisa mematahkan gate tanpa push pemicunya sendiri
# (contoh nyata: needle release-audit basi setelah refactor app.js — temuan D1).
#
# KEAMANAN: workflow ini SENGAJA hanya membaca repo dan menulis issue.
# JANGAN pernah menambahkan permission contents:write / pull-requests:write di sini —
# nightwatch tidak boleh bisa push/merge apa pun.
on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 01:00 WIB
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nightwatch:
    runs-on: ubuntu-latest
    # Batas keras: tanpa ini GitHub memakai 360 menit, dan satu langkah
    # yang menggantung membakar enam jam dalam diam (lihat
    # tests/workflow-timeout-gate-test.js).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned push dependency
        run: npm install --ignore-scripts
      - name: Siapkan direktori log
        run: mkdir -p .nightwatch/logs
      - name: 'Gate: tests/regression-test.js'
        id: gate_regression_test
        continue-on-error: true
        shell: bash
        run: |
          rc=0
          node tests/regression-test.js 2>&1 | tee '.nightwatch/logs/regression-test.js.log' || rc=$?
          printf '%s\t%s\n' 'tests/regression-test.js' "$rc" >> .nightwatch/status.tsv
          exit "$rc"
      - name: 'Gate: validator.js'
        id: gate_validator
        continue-on-error: true
        shell: bash
