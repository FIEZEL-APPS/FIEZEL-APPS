          printf '%s\t%s\n' 'adaptivity-simulation-v3.js' "$rc" >> .nightwatch/status.tsv
          exit "$rc"
      - name: Rekap
        # Langkah ini yang membuat run MERAH bila ada gate gagal (setiap gate di atas
        # memakai continue-on-error supaya seluruh suite tetap berjalan sampai habis).
        if: always()
        shell: bash
        run: |
          total=0; merah=0
          {
            echo '## Nightwatch — rekap gate'
            echo ''
            echo '| Gate | Status | Exit |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r gate rc; do
            total=$((total+1))
            if [ "$rc" = "0" ]; then
              status='PASS'
            else
              status='**FAIL**'; merah=$((merah+1))
            fi
            echo "| \`$gate\` | $status | $rc |" >> "$GITHUB_STEP_SUMMARY"
          done < .nightwatch/status.tsv
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Total: $total gate, merah: $merah" >> "$GITHUB_STEP_SUMMARY"
          echo "Nightwatch: $merah dari $total gate merah"
          [ "$merah" -eq 0 ]
      - name: Buat/update/tutup issue Nightwatch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const TITLE_PREFIX = 'Nightwatch: gate merah';
            const statusPath = '.nightwatch/status.tsv';
            const rows = fs.existsSync(statusPath)
              ? fs.readFileSync(statusPath, 'utf8').split('\n').filter(Boolean).map((line) => {
                  const [gate, rc] = line.split('\t');
                  return { gate, rc: Number(rc) };
                })
              : [];
            const failures = rows.filter((r) => r.rc !== 0);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tanggal = new Intl.DateTimeFormat('id-ID', {
              timeZone: 'Asia/Jakarta', day: 'numeric', month: 'long', year: 'numeric',
            }).format(new Date());
            // Guard anti-duplikat: cari SEMUA issue nightwatch yang masih terbuka.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.filter((i) => !i.pull_request && i.title.startsWith(TITLE_PREFIX));
            if (rows.length === 0) {
              // Suite tidak sempat lari sama sekali (mis. npm install gagal) — jangan
              // menutup issue lama berdasarkan ketiadaan bukti.
              core.warning('Tidak ada status gate yang tercatat; issue nightwatch dibiarkan apa adanya.');
              return;
            }
            if (failures.length > 0) {
              const sections = failures.map((f) => {
                const logFile = `.nightwatch/logs/${f.gate}.log`;
                let tail = '(log tidak ditemukan)';
                if (fs.existsSync(logFile)) {
                  const lines = fs.readFileSync(logFile, 'utf8').split('\n');
                  while (lines.length && lines[lines.length - 1] === '') lines.pop();
                  tail = lines.slice(-20).join('\n');
                }
                return `### \`${f.gate}\` (exit ${f.rc})\n\n20 baris log terakhir:\n\n\u0060\u0060\u0060\u0060\n${tail}\n\u0060\u0060\u0060\u0060`;
              });
              const body = [
                `Nightwatch ${tanggal} (01:00 WIB): **${failures.length} dari ${rows.length} gate merah**.`,
                '',
                `Run: ${runUrl}`,
                '',
                `Gate gagal: ${failures.map((f) => `\`${f.gate}\``).join(', ')}`,
                '',
                ...sections,
                '',
                '_Issue ini dikelola otomatis oleh workflow nightwatch.yml; ia di-update (bukan diduplikasi) selama masih terbuka, dan ditutup otomatis saat semua gate hijau._',
              ].join('\n');
              const title = `${TITLE_PREFIX} ${tanggal}`;
              if (existing.length > 0) {
                // Update issue yang ada, jangan buat duplikat.
                const issue = existing[0];
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, title, body,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Nightwatch ${tanggal}: masih merah (${failures.length} gate). Detail diperbarui di deskripsi issue. Run: ${runUrl}`,
                });
                core.info(`Issue #${issue.number} di-update (${failures.length} gate merah).`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body,
                });
                core.info(`Issue #${created.data.number} dibuat (${failures.length} gate merah).`);
              }
            } else {
              // Semua hijau: tutup issue nightwatch yang masih terbuka dengan komentar.
              for (const issue of existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Nightwatch ${tanggal}: semua ${rows.length} gate hijau — issue ditutup otomatis. Run: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
                core.info(`Issue #${issue.number} ditutup (semua gate hijau).`);
              }
              if (existing.length === 0) core.info('Semua gate hijau; tidak ada issue nightwatch terbuka.');
            }
