name: Deploy FIEZEL Core Worker
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Puter Worker name
        required: true
        default: fiezel-core
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-core-worker.yml'
      - 'fiezel-core-worker.js'
      - 'fiezel-core-worker-proof-route.js'
      - 'core-proof-build.mjs'
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-core]') || contains(github.event.head_commit.message, '[deploy-core-proof]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @heyputer/cli@0.1.2
      - name: Prepare guarded deploy source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.event.head_commit.message }}" == *"[deploy-core-proof]"* ]]; then
            node core-proof-build.mjs
          else
            cp fiezel-core-worker.js fiezel-core-worker-deploy.js
          fi
          node --check fiezel-core-worker-deploy.js
      - name: Core deployment preflight
        env:
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
        run: node core-deploy-preflight.mjs
      - name: Resolve Worker name
        id: worker
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.worker_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=fiezel-core" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Core Worker with official Puter action
        id: puter_worker
        uses: HeyPuter/puter-worker-deploy-action@3ea96548afcf0815fd2338f58ebc2032050bfd9d # v1.0.1
        with:
          worker_name: ${{ steps.worker.outputs.name }}
          source_path: fiezel-core-worker-deploy.js
          puter_path: ~/Workers/${{ steps.worker.outputs.name }}
          puter_token: ${{ secrets.PUTER_AUTH_TOKEN }}
      - name: Confirm deployed Worker URL
        run: |
          test -n "${{ steps.puter_worker.outputs.worker_url }}"
          echo "Core Worker deployed successfully. URL: ${{ steps.puter_worker.outputs.worker_url }}"
      - name: Proof route live smoke
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-core-proof]')
        env:
          WORKER_URL: ${{ steps.puter_worker.outputs.worker_url }}
          FIEZEL_REMINDER_CRON_TOKEN: ${{ secrets.FIEZEL_REMINDER_CRON_TOKEN }}
        shell: bash
        run: |
          node --input-type=module -e "const base=String(process.env.WORKER_URL||'').replace(/\/$/,'');let lastStatus=0,lastCount=0;for(let attempt=1;attempt<=7;attempt++){const res=await fetch(base+'/api/reminders/proof',{method:'POST',headers:{Authorization:'Bearer '+process.env.FIEZEL_REMINDER_CRON_TOKEN}});const body=await res.json().catch(()=>({}));lastStatus=res.status;lastCount=Number(body.count||0);if(res.ok&&lastCount>=1){console.log(JSON.stringify({proofRoute:'LIVE',subscriptionsAvailable:lastCount,attempt}));process.exit(0)}if(attempt<7)await new Promise(r=>setTimeout(r,5000))}throw new Error('Proof route smoke failed after propagation window: HTTP '+lastStatus+' count '+lastCount);"
