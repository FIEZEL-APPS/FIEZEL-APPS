name: Deploy FIEZEL Core Worker
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Puter Worker name
        required: true
        default: fiezel-core
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-core-worker.yml'
      - 'fiezel-core-worker.js'
      - 'fiezel-core-worker-proof-route.js'
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-core]') || contains(github.event.head_commit.message, '[deploy-core-proof]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Retained only because core-deploy-preflight.mjs currently checks CLI availability.
      # The actual deployment no longer uses the CLI WebSocket path that failed previously.
      - run: npm install -g @heyputer/cli@0.1.2
      - name: Prepare guarded deploy source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.event.head_commit.message }}" == *"[deploy-core-proof]"* ]]; then
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const base=fs.readFileSync('fiezel-core-worker.js','utf8');
            const proof=fs.readFileSync('fiezel-core-worker-proof-route.js','utf8').trim();
            const marker="router.post('/api/reminders/due'";
            if(!base.includes(marker)) throw new Error('Core reminder route insertion marker missing');
            const next=base.replace(marker, `${proof}\n${marker}`);
            fs.writeFileSync('fiezel-core-worker-deploy.js',next);
            console.log(JSON.stringify({proofRouteInserted:next.includes("router.post('/api/reminders/proof'"),markerPreserved:next.includes(marker)}));
            NODE
          else
            cp fiezel-core-worker.js fiezel-core-worker-deploy.js
          fi
          node --check fiezel-core-worker-deploy.js
      - name: Core deployment preflight
        env:
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
        run: node core-deploy-preflight.mjs
      - name: Resolve Worker name
        id: worker
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.worker_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=fiezel-core" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Core Worker with official Puter action
        id: puter_worker
        uses: HeyPuter/puter-worker-deploy-action@3ea96548afcf0815fd2338f58ebc2032050bfd9d # v1.0.1
        with:
          worker_name: ${{ steps.worker.outputs.name }}
          source_path: fiezel-core-worker-deploy.js
          puter_path: ~/Workers/${{ steps.worker.outputs.name }}
          puter_token: ${{ secrets.PUTER_AUTH_TOKEN }}
      - name: Confirm deployed Worker URL
        run: |
          test -n "${{ steps.puter_worker.outputs.worker_url }}"
          echo "Core Worker deployed successfully. URL: ${{ steps.puter_worker.outputs.worker_url }}"
