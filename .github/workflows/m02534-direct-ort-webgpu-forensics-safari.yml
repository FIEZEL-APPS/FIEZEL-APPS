name: m025-34 direct ORT WebGPU Safari forensics

on:
  push:
    branches:
      - master/perf67-m02534-direct-ort-webgpu-forensics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari26:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record Apple runner
        run: |
          set -euo pipefail
          sw_vers | tee m02534-runner.txt
          /usr/bin/safaridriver --version | tee -a m02534-runner.txt
          /usr/bin/arch | tee -a m02534-runner.txt

      - name: Install exact ORT-Web forensic runtime
        run: |
          set -euo pipefail
          ORT_VERSION='1.26.0-dev.20260416-b7804b056c'
          mkdir -p .m02534/pkg .m02534/runtime
          cd .m02534/pkg
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "onnxruntime-web@${ORT_VERSION}"
          ACTUAL="$(node -p "require('./node_modules/onnxruntime-web/package.json').version")"
          test "$ACTUAL" = "$ORT_VERSION"
          cd "$GITHUB_WORKSPACE"
          cp -R .m02534/pkg/node_modules/onnxruntime-web/dist .m02534/runtime/ort-dist
          test -f .m02534/runtime/ort-dist/ort.webgpu.mjs
          test -f .m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.mjs
          test -f .m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.wasm
          printf 'onnxruntime-web=%s\n' "$ACTUAL" | tee m02534-runtime.txt
          sha256sum .m02534/runtime/ort-dist/ort.webgpu.mjs .m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.mjs .m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.wasm | tee m02534-ort-sha256.txt

      - name: Fetch immutable fp32 Kokoro model
        run: |
          set -euo pipefail
          REV='1939ad2a8e416c0acfeecc08a694d14ef25f2231'
          URL="https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/${REV}/onnx/model.onnx?download=true"
          mkdir -p vendor/kokoro-model/onnx
          curl --fail --location --retry 3 --retry-all-errors --output vendor/kokoro-model/onnx/model.onnx "$URL"
          test -s vendor/kokoro-model/onnx/model.onnx
          printf '%s\n' "$REV" | tee m02534-model-revision.txt
          stat -f '%z' vendor/kokoro-model/onnx/model.onnx | tee m02534-model-size.txt
          shasum -a 256 vendor/kokoro-model/onnx/model.onnx | tee m02534-model-sha256.txt

      - name: Create refined direct ORT forensic page
        run: |
          cat > .m02534-bench.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-34 refined WebGPU forensics</title>
          <script type="module">
          const started=performance.now(), captured=[];
          window.__benchResult=null; window.__benchStatus='boot';
          const safe=v=>{try{return typeof v==='string'?v:JSON.stringify(v)}catch{return String(v)}};
          const ser=e=>e==null?null:{name:e?.name??null,message:e?.message??String(e),stack:e?.stack??null,type:Object.prototype.toString.call(e)};
          for(const level of ['log','warn','error']){
            const orig=console[level].bind(console);
            console[level]=(...args)=>{captured.push({kind:'console-'+level,t:Math.round(performance.now()-started),args:args.map(safe)});orig(...args)};
          }
          addEventListener('error',e=>captured.push({kind:'window-error',t:Math.round(performance.now()-started),message:e.message,error:ser(e.error)}));
          addEventListener('unhandledrejection',e=>captured.push({kind:'unhandledrejection',t:Math.round(performance.now()-started),reason:ser(e.reason)}));
          const finish=x=>{window.__benchResult={harnessSuccess:true,elapsedMs:Math.round(performance.now()-started),captured,...x};window.__benchStatus='done'};
          const gpu={available:!!navigator.gpu,adapters:{}};
          const resources={};
          const moduleImports={};
          async function probeAdapter(label,options){
            try{
              const a=await navigator.gpu.requestAdapter(options);
              const r={available:!!a};
              if(a){
                try{r.features=[...a.features].sort()}catch{}
                try{const d=await a.requestDevice();r.device=true;try{r.deviceFeatures=[...d.features].sort()}catch{};try{d.destroy?.()}catch{}}catch(e){r.device=false;r.deviceError=ser(e)}
              }
              gpu.adapters[label]=r;
            }catch(e){gpu.adapters[label]={available:false,error:ser(e)}}
          }
          async function head(path){
            try{const r=await fetch(path,{method:'HEAD',cache:'no-store'});resources[path]={ok:r.ok,status:r.status,type:r.headers.get('content-type'),length:r.headers.get('content-length')}}catch(e){resources[path]={ok:false,error:ser(e)}}
          }
          async function importProbe(label,path){
            try{const m=await import(path);moduleImports[label]={success:true,exports:Object.keys(m).sort()}}catch(e){moduleImports[label]={success:false,error:ser(e)}}
          }
          try{
            if(!navigator.gpu)throw new Error('navigator.gpu unavailable');
            window.__benchStatus='gpu-probes';
            await probeAdapter('default',undefined);
            await probeAdapter('low-power',{powerPreference:'low-power'});
            await probeAdapter('high-performance',{powerPreference:'high-performance'});

            window.__benchStatus='resource-preflight';
            await head('./.m02534/runtime/ort-dist/ort.webgpu.mjs');
            await head('./.m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.mjs');
            await head('./.m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.wasm');
            await head('./vendor/kokoro-model/onnx/model.onnx');

            window.__benchStatus='jsep-direct-import';
            await importProbe('jsep','./.m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.mjs');

            window.__benchStatus='ort-import';
            const ort=await import('./.m02534/runtime/ort-dist/ort.webgpu.mjs');
            try{ort.env.logLevel='verbose'}catch{}
            try{ort.env.debug=true}catch{}
            try{ort.env.wasm.numThreads=1}catch{}
            try{ort.env.wasm.proxy=false}catch{}
            try{ort.env.wasm.wasmPaths=location.origin+'/.m02534/runtime/ort-dist/'}catch{}

            window.__benchStatus='session-create';
            const t0=performance.now();
            let session=null,sessionSuccess=false,sessionError=null,sessionTimedOut=false,inputNames=null,outputNames=null;
            try{
              session=await Promise.race([
                ort.InferenceSession.create('./vendor/kokoro-model/onnx/model.onnx',{executionProviders:['webgpu'],graphOptimizationLevel:'all'}),
                new Promise((_,reject)=>setTimeout(()=>reject(Object.assign(new Error('direct_ort_session_create_timeout_120s'),{name:'ForensicTimeoutError'})),120000))
              ]);
              sessionSuccess=true; inputNames=session.inputNames; outputNames=session.outputNames;
            }catch(e){sessionError=ser(e);sessionTimedOut=e?.name==='ForensicTimeoutError'}
            const sessionMs=Math.round(performance.now()-t0);
            try{await session?.release?.()}catch(e){captured.push({kind:'release-error',error:ser(e)})}
            await new Promise(r=>setTimeout(r,300));
            finish({userAgent:navigator.userAgent,crossOriginIsolated:globalThis.crossOriginIsolated,gpu,resources,moduleImports,sessionTerminal:true,sessionSuccess,sessionTimedOut,sessionMs,sessionError,inputNames,outputNames});
          }catch(e){finish({userAgent:navigator.userAgent,crossOriginIsolated:globalThis.crossOriginIsolated,gpu,resources,moduleImports,sessionTerminal:true,sessionSuccess:false,sessionTimedOut:false,sessionMs:null,sessionError:ser(e),fatalStage:window.__benchStatus})}
          </script>
          HTML

      - name: Start same-origin server and SafariDriver
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/m02534-http.log 2>&1 &
          sudo /usr/bin/safaridriver --enable || /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver --port 4444 >/tmp/m02534-safaridriver.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4444/status >/tmp/m02534-status.json 2>/dev/null && break; sleep 1; done
          {
            curl -sSI http://127.0.0.1:8000/.m02534/runtime/ort-dist/ort.webgpu.mjs
            curl -sSI http://127.0.0.1:8000/.m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.mjs
            curl -sSI http://127.0.0.1:8000/.m02534/runtime/ort-dist/ort-wasm-simd-threaded.jsep.wasm
          } | tee m02534-http-preflight.txt

      - name: Capture refined terminal classification
        run: |
          set -euo pipefail
          SJ="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
          SID="$(echo "$SJ"|jq -r '.value.sessionId // .sessionId // empty')"; test -n "$SID"
          curl -fsS -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:8000/.m02534-bench.html"}' "http://127.0.0.1:4444/session/$SID/url" >/dev/null
          RESULT=''
          for i in {1..180}; do
            RESP="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return window.__benchResult||null;","args":[]}' "http://127.0.0.1:4444/session/$SID/execute/sync" 2>/dev/null || true)"
            RESULT="$(echo "$RESP"|jq -c '.value // empty' 2>/dev/null || true)"
            [ -n "$RESULT" ] && [ "$RESULT" != null ] && break
            sleep 1
          done
          curl -sS -X DELETE "http://127.0.0.1:4444/session/$SID" >/dev/null || true
          test -n "$RESULT"
          echo "$RESULT" | jq . | tee m02534-direct-ort.json
          jq -e '.harnessSuccess == true and .sessionTerminal == true and .gpu.available == true' m02534-direct-ort.json >/dev/null
          jq '{gpu,resources,moduleImports,sessionSuccess,sessionTimedOut,sessionMs,sessionError,captured}' m02534-direct-ort.json | tee m02534-classification.json
          cat /tmp/m02534-http.log | tail -100 | tee m02534-http-tail.txt

      - name: Preserve forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02534-direct-ort-webgpu-${{ github.sha }}
          path: |
            m02534-direct-ort.json
            m02534-classification.json
            m02534-runner.txt
            m02534-runtime.txt
            m02534-ort-sha256.txt
            m02534-model-revision.txt
            m02534-model-size.txt
            m02534-model-sha256.txt
            m02534-http-preflight.txt
            m02534-http-tail.txt
            /tmp/m02534-http.log
            /tmp/m02534-safaridriver.log
          if-no-files-found: warn
          retention-days: 30
