name: m025-34 direct ORT WebGPU Safari forensics

on:
  push:
    branches:
      - master/perf67-m02534-direct-ort-webgpu-forensics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari26:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record Apple runner
        run: |
          set -euo pipefail
          sw_vers | tee m02534-runner.txt
          /usr/bin/safaridriver --version | tee -a m02534-runner.txt
          /usr/bin/arch | tee -a m02534-runner.txt

      - name: Install exact ORT-Web forensic runtime
        run: |
          set -euo pipefail
          ORT_VERSION='1.26.0-dev.20260416-b7804b056c'
          mkdir -p .m02534/pkg .m02534/runtime
          cd .m02534/pkg
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "onnxruntime-web@${ORT_VERSION}"
          ACTUAL="$(node -p "require('./node_modules/onnxruntime-web/package.json').version")"
          test "$ACTUAL" = "$ORT_VERSION"
          cd "$GITHUB_WORKSPACE"
          cp -R .m02534/pkg/node_modules/onnxruntime-web/dist .m02534/runtime/ort-dist
          if [ -f .m02534/runtime/ort-dist/ort.webgpu.mjs ]; then
            ENTRY='ort.webgpu.mjs'
          elif [ -f .m02534/runtime/ort-dist/ort.webgpu.min.mjs ]; then
            ENTRY='ort.webgpu.min.mjs'
          else
            ENTRY="$(find .m02534/runtime/ort-dist -maxdepth 1 -type f -name 'ort.webgpu*.mjs' -print | sort | head -1 | xargs basename)"
          fi
          test -n "$ENTRY"
          printf '%s\n' "$ENTRY" | tee m02534-ort-entry.txt
          printf 'onnxruntime-web=%s\n' "$ACTUAL" | tee m02534-runtime.txt
          sha256sum ".m02534/runtime/ort-dist/$ENTRY" | tee m02534-ort-entry-sha256.txt
          find .m02534/runtime/ort-dist -maxdepth 1 -type f \( -name 'ort-wasm*.wasm' -o -name 'ort-wasm*.mjs' \) -print | sort | tee m02534-ort-artifacts.txt
          while IFS= read -r f; do sha256sum "$f"; done < m02534-ort-artifacts.txt | tee m02534-ort-artifacts-sha256.txt

      - name: Fetch immutable fp32 Kokoro model
        run: |
          set -euo pipefail
          REV='1939ad2a8e416c0acfeecc08a694d14ef25f2231'
          URL="https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/${REV}/onnx/model.onnx?download=true"
          mkdir -p vendor/kokoro-model/onnx
          curl --fail --location --retry 3 --retry-all-errors --output vendor/kokoro-model/onnx/model.onnx "$URL"
          test -s vendor/kokoro-model/onnx/model.onnx
          printf '%s\n' "$REV" | tee m02534-model-revision.txt
          stat -f '%z' vendor/kokoro-model/onnx/model.onnx | tee m02534-model-size.txt
          shasum -a 256 vendor/kokoro-model/onnx/model.onnx | tee m02534-model-sha256.txt

      - name: Create direct ORT WebGPU forensic page
        run: |
          set -euo pipefail
          ENTRY="$(cat m02534-ort-entry.txt)"
          cat > .m02534-bench.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-34 direct ORT WebGPU forensics</title>
          <script type="module">
          const started=performance.now();
          const captured=[];
          window.__benchResult=null;
          window.__benchStatus='boot';
          const safe=(v)=>{try{if(typeof v==='string')return v;return JSON.stringify(v)}catch{return String(v)}};
          const ser=(e)=>{
            if(e==null)return null;
            const out={type:Object.prototype.toString.call(e),name:e?.name??null,message:e?.message??String(e),stack:e?.stack??null};
            try{if(e?.cause!==undefined)out.cause=safe(e.cause)}catch{}
            try{
              for(const k of Object.getOwnPropertyNames(e)){
                if(k in out)continue;
                try{
                  const v=e[k];
                  out[k]=(v==null||['string','number','boolean'].includes(typeof v))?v:safe(v);
                }catch{}
              }
            }catch{}
            return out;
          };
          for(const level of ['log','warn','error']){
            const orig=console[level].bind(console);
            console[level]=(...args)=>{captured.push({kind:'console-'+level,t:Math.round(performance.now()-started),args:args.map(safe)});orig(...args)};
          }
          addEventListener('error',e=>captured.push({kind:'window-error',t:Math.round(performance.now()-started),message:e.message,filename:e.filename,lineno:e.lineno,colno:e.colno,error:ser(e.error)}));
          addEventListener('unhandledrejection',e=>captured.push({kind:'unhandledrejection',t:Math.round(performance.now()-started),reason:ser(e.reason)}));
          const finish=(x)=>{window.__benchResult={harnessSuccess:true,elapsedMs:Math.round(performance.now()-started),captured,...x};window.__benchStatus='done'};
          const gpuProbe={available:!!navigator.gpu,requestDeviceHook:false,uncaptured:[]};
          try{
            const p=globalThis.GPUAdapter?.prototype;
            if(p?.requestDevice){
              const original=p.requestDevice;
              p.requestDevice=async function(...args){
                const device=await original.apply(this,args);
                try{device.addEventListener?.('uncapturederror',ev=>{const item={kind:'gpu-uncaptured',t:Math.round(performance.now()-started),error:ser(ev.error)};gpuProbe.uncaptured.push(item);captured.push(item)})}catch{}
                return device;
              };
              gpuProbe.requestDeviceHook=true;
            }
          }catch(e){gpuProbe.hookError=ser(e)}
          try{
            if(!navigator.gpu)throw new Error('navigator.gpu unavailable');
            window.__benchStatus='gpu-probe';
            const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
            gpuProbe.adapter=!!adapter;
            if(adapter){
              try{gpuProbe.features=[...adapter.features].sort()}catch{}
              try{
                const limits={};
                for(const k of Object.keys(adapter.limits||{})){const v=adapter.limits[k];if(typeof v==='number')limits[k]=v}
                gpuProbe.limits=limits;
              }catch{}
              try{
                const device=await adapter.requestDevice();
                gpuProbe.device=true;
                try{gpuProbe.deviceFeatures=[...device.features].sort()}catch{}
                try{device.destroy?.()}catch{}
              }catch(e){gpuProbe.device=false;gpuProbe.deviceError=ser(e)}
            }

            window.__benchStatus='ort-import';
            const ort=await import('./.m02534/runtime/ort-dist/__ORT_ENTRY__');
            try{ort.env.logLevel='verbose'}catch{}
            try{ort.env.debug=true}catch{}
            try{ort.env.wasm.numThreads=1}catch{}
            try{ort.env.wasm.proxy=false}catch{}
            try{ort.env.wasm.wasmPaths='./.m02534/runtime/ort-dist/'}catch{}

            window.__benchStatus='session-create';
            const sessionStart=performance.now();
            let session=null,sessionSuccess=false,sessionError=null,sessionTimedOut=false,inputNames=null,outputNames=null;
            const createPromise=ort.InferenceSession.create('./vendor/kokoro-model/onnx/model.onnx',{
              executionProviders:['webgpu'],
              graphOptimizationLevel:'all'
            });
            const timeoutPromise=new Promise((_,reject)=>setTimeout(()=>reject(Object.assign(new Error('direct_ort_session_create_timeout_120s'),{name:'ForensicTimeoutError'})),120000));
            try{
              session=await Promise.race([createPromise,timeoutPromise]);
              sessionSuccess=true;
              try{inputNames=session.inputNames}catch{}
              try{outputNames=session.outputNames}catch{}
            }catch(e){
              sessionError=ser(e);
              sessionTimedOut=e?.name==='ForensicTimeoutError';
            }
            const sessionMs=Math.round(performance.now()-sessionStart);
            try{await session?.release?.()}catch(e){captured.push({kind:'session-release-error',error:ser(e)})}
            await new Promise(r=>setTimeout(r,500));
            finish({
              userAgent:navigator.userAgent,
              crossOriginIsolated:globalThis.crossOriginIsolated,
              gpuProbe,
              sessionTerminal:true,
              sessionSuccess,
              sessionTimedOut,
              sessionMs,
              sessionError,
              inputNames,
              outputNames,
              ortExports:Object.keys(ort).sort()
            });
          }catch(e){
            finish({userAgent:navigator.userAgent,crossOriginIsolated:globalThis.crossOriginIsolated,gpuProbe,sessionTerminal:true,sessionSuccess:false,sessionTimedOut:false,sessionMs:null,sessionError:ser(e),fatalStage:window.__benchStatus});
          }
          </script>
          HTML
          python3 - <<PY
          from pathlib import Path
          p=Path('.m02534-bench.html')
          p.write_text(p.read_text().replace('__ORT_ENTRY__', ${ENTRY@Q}))
          PY

      - name: Start same-origin server and SafariDriver
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/m02534-http.log 2>&1 &
          sudo /usr/bin/safaridriver --enable || /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver --port 4444 >/tmp/m02534-safaridriver.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4444/status >/tmp/m02534-status.json 2>/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/.m02534-bench.html >/dev/null

      - name: Capture direct ORT WebGPU terminal classification
        run: |
          set -euo pipefail
          SJ="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
          SID="$(echo "$SJ"|jq -r '.value.sessionId // .sessionId // empty')"
          test -n "$SID"
          curl -fsS -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:8000/.m02534-bench.html"}' "http://127.0.0.1:4444/session/$SID/url" >/dev/null
          RESULT=''
          for i in {1..180}; do
            RESP="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return window.__benchResult||null;","args":[]}' "http://127.0.0.1:4444/session/$SID/execute/sync" 2>/dev/null || true)"
            RESULT="$(echo "$RESP"|jq -c '.value // empty' 2>/dev/null || true)"
            [ -n "$RESULT" ] && [ "$RESULT" != null ] && break
            sleep 1
          done
          curl -sS -X DELETE "http://127.0.0.1:4444/session/$SID" >/dev/null || true
          test -n "$RESULT"
          echo "$RESULT" | jq . | tee m02534-direct-ort.json
          jq -e '.harnessSuccess == true and .sessionTerminal == true' m02534-direct-ort.json >/dev/null
          jq -e '.gpuProbe.available == true' m02534-direct-ort.json >/dev/null
          jq -e '(.sessionSuccess == true) or (.sessionError != null) or (.sessionTimedOut == true)' m02534-direct-ort.json >/dev/null
          jq '{sessionSuccess,sessionTimedOut,sessionMs,sessionError,gpuProbe:{available:.gpuProbe.available,adapter:.gpuProbe.adapter,device:.gpuProbe.device,requestDeviceHook:.gpuProbe.requestDeviceHook,uncaptured:.gpuProbe.uncaptured},captured}' m02534-direct-ort.json | tee m02534-classification.json

      - name: Preserve forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02534-direct-ort-webgpu-${{ github.sha }}
          path: |
            m02534-direct-ort.json
            m02534-classification.json
            m02534-runner.txt
            m02534-runtime.txt
            m02534-ort-entry.txt
            m02534-ort-entry-sha256.txt
            m02534-ort-artifacts.txt
            m02534-ort-artifacts-sha256.txt
            m02534-model-revision.txt
            m02534-model-size.txt
            m02534-model-sha256.txt
            /tmp/m02534-http.log
            /tmp/m02534-safaridriver.log
          if-no-files-found: warn
          retention-days: 30
