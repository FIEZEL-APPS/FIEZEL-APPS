# Produksi aset audio menggunakan Gemini TTS ke Cloudflare R2
name: FIEZEL Gemini Audio Assets

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Kumpulan konten: listening / vocabulary'
        required: true
        default: 'listening'
      voice:
        description: 'Pilihan suara Gemini (Aoede / Puck / Kore / Fenrir)'
        required: true
        default: 'Aoede'
      limit:
        description: 'Jumlah materi audio untuk sekali jalan (0 = seluruh sisa materi)'
        required: false
        default: '50'
      apply:
        description: 'Ketik APPLY untuk memproduksi ke R2. Kosongkan untuk dry-run.'
        required: false
        default: ''
      verify_only:
        description: 'Ketik VERIFY untuk tes koneksi API Gemini saja (tanpa R2).'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fiezel-gemini-audio-generate
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rencana (dry-run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT: ${{ inputs.content }}
          LIMIT: ${{ inputs.limit }}
          VOICE: ${{ inputs.voice }}
        run: |
          node tools/audio-gemini-generate.mjs \
            --content="$CONTENT" \
            --limit="$LIMIT" \
            --voice="$VOICE"

      - name: Periksa koneksi Gemini API
        if: ${{ inputs.verify_only == 'VERIFY' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT: ${{ inputs.content }}
          VOICE: ${{ inputs.voice }}
        run: |
          node tools/audio-gemini-generate.mjs \
            --content="$CONTENT" \
            --voice="$VOICE" \
            --verify-only

      - name: Produksi audio Gemini ke R2
        if: ${{ inputs.apply == 'APPLY' && inputs.verify_only != 'VERIFY' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTENT: ${{ inputs.content }}
          LIMIT: ${{ inputs.limit }}
          VOICE: ${{ inputs.voice }}
        run: |
          node tools/audio-gemini-generate.mjs \
            --content="$CONTENT" \
            --limit="$LIMIT" \
            --voice="$VOICE" \
            --apply

      - name: Pemeriksaan rahasia dan kontrak audio
        if: ${{ inputs.apply == 'APPLY' }}
        run: node tests/audio-asset-pipeline-test.js

      - name: Simpan perubahan manifest ke Git
        if: ${{ inputs.apply == 'APPLY' }}
        env:
          CONTENT: ${{ inputs.content }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain audio/manifest.json)" ]; then
            echo 'Tidak ada aset baru.'
            exit 0
          fi
          git config user.name 'fiezel-audio-bot'
          git config user.email 'noreply@github.com'
          git add audio/manifest.json
          git commit -m "Audio: aset $CONTENT hasil produksi Gemini TTS"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin main; then
              pushed=true
              break
            fi
            echo "Push langsung ke main ditolak (percobaan $attempt), sinkronisasi manifest remote..."
            git fetch origin main
            node -e '
              const fs = require("fs");
              const cp = require("child_process");
              const local = JSON.parse(fs.readFileSync("audio/manifest.json", "utf8"));
              const remote = JSON.parse(cp.execSync("git show origin/main:audio/manifest.json").toString());
              local.assets = Object.assign({}, remote.assets, local.assets);
              local.version = Math.max(Number(local.version) || 0, Number(remote.version) || 0) + 1;
              fs.writeFileSync("audio/manifest.json", JSON.stringify(local, null, 2) + "\n");
            '
            git reset --mixed origin/main
            git add audio/manifest.json
            git commit -m "Audio: aset $CONTENT hasil produksi Gemini TTS (merged)" || true
            sleep 2
          done

          if [ "$pushed" = false ]; then
            echo "Proteksi branch main aktif. Mendorong ke branch audio-update dan membuat pull request..."
            BRANCH_NAME="audio-update-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git push -u origin "$BRANCH_NAME"
            gh pr create --base main --head "$BRANCH_NAME" \
              --title "Audio: sinkronisasi manifest ($CONTENT via Gemini TTS)" \
              --body "Aset audio telah berhasil diproduksi dan diverifikasi di Cloudflare R2. PR ini menyinkronkan manifest.json ke branch main."
            echo "Pull request untuk update manifest berhasil dibuat."
          fi
