# Produksi aset audio menggunakan Gemini TTS ke Cloudflare R2
name: FIEZEL Gemini Audio Assets

on:
  workflow_dispatch:
    inputs:
      content:
        description: 'Kumpulan konten: listening'
        required: true
        default: 'listening'
      voice:
        description: 'Pilihan suara Gemini (Aoede / Puck / Kore / Fenrir)'
        required: true
        default: 'Aoede'
      limit:
        description: 'Jumlah materi audio untuk sekali jalan (0 = seluruh sisa materi)'
        required: false
        default: '50'
      apply:
        description: 'Ketik APPLY untuk memproduksi ke R2. Kosongkan untuk dry-run.'
        required: false
        default: ''
      verify_only:
        description: 'Ketik VERIFY untuk tes koneksi API Gemini saja (tanpa R2).'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fiezel-gemini-audio-generate
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rencana (dry-run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT: ${{ inputs.content }}
          LIMIT: ${{ inputs.limit }}
          VOICE: ${{ inputs.voice }}
        run: |
          node tools/audio-gemini-generate.mjs \
            --content="$CONTENT" \
            --limit="$LIMIT" \
            --voice="$VOICE"

      - name: Periksa koneksi Gemini API
        if: ${{ inputs.verify_only == 'VERIFY' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT: ${{ inputs.content }}
          VOICE: ${{ inputs.voice }}
        run: |
          node tools/audio-gemini-generate.mjs \
            --content="$CONTENT" \
            --voice="$VOICE" \
            --verify-only

      - name: Produksi audio Gemini ke R2
        if: ${{ inputs.apply == 'APPLY' && inputs.verify_only != 'VERIFY' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTENT: ${{ inputs.content }}
          LIMIT: ${{ inputs.limit }}
          VOICE: ${{ inputs.voice }}
        run: |
          node tools/audio-gemini-generate.mjs \
            --content="$CONTENT" \
            --limit="$LIMIT" \
            --voice="$VOICE" \
            --apply

      - name: Pemeriksaan rahasia dan kontrak audio
        if: ${{ inputs.apply == 'APPLY' }}
        run: node tests/audio-asset-pipeline-test.js

      - name: Simpan perubahan manifest ke Git
        if: ${{ inputs.apply == 'APPLY' }}
        env:
          CONTENT: ${{ inputs.content }}
        run: |
          if [ -z "$(git status --porcelain audio/manifest.json)" ]; then
            echo 'Tidak ada aset baru.'
            exit 0
          fi
          git config user.name 'fiezel-audio-bot'
          git config user.email 'noreply@github.com'
          git add audio/manifest.json
          git commit -m "Audio: aset listening $CONTENT hasil produksi Gemini TTS"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push gagal (percobaan $attempt); menarik rebase lalu mencoba lagi."
            git pull --rebase --autostash || true
          done
          echo 'Manifest tidak bisa didorong. Aset sudah ada di R2.' >&2
          exit 1
