name: m025-31 q4 WASM Safari differential

on:
  push:
    branches:
      - master/perf67-m02531-q4-wasm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari26:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple runner
        run: |
          set -euo pipefail
          sw_vers
          /usr/bin/safaridriver --version
          /usr/bin/arch
      - name: Fetch immutable q4 model artifact
        run: |
          set -euo pipefail
          REV='1939ad2a8e416c0acfeecc08a694d14ef25f2231'
          URL="https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/${REV}/onnx/model_q4.onnx?download=true"
          mkdir -p vendor/kokoro-model/onnx
          curl --fail --location --retry 3 --retry-all-errors --output vendor/kokoro-model/onnx/model_q4.onnx "$URL"
          test -s vendor/kokoro-model/onnx/model_q4.onnx
          stat -f '%z' vendor/kokoro-model/onnx/model_q4.onnx | tee m02531-q4-size.txt
          shasum -a 256 vendor/kokoro-model/onnx/model_q4.onnx | tee m02531-q4-sha256.txt
          printf '%s\n' "$REV" | tee m02531-model-revision.txt
      - name: Create benchmark page
        run: |
          cat > .m02531-bench.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-31 q4</title>
          <script src="./features/neural-voice/fiezel-kokoro-adapter.js"></script>
          <script type="module">
          const q=new URL(location.href).searchParams;
          const dtype=q.get('dtype')||'q8';
          const events=[]; window.__benchResult=null; window.__benchStatus='boot';
          const finish=x=>{window.__benchResult=x;window.__benchStatus=x.success?'done':'error'};
          const text='The learner explains the main idea clearly and gives one example.';
          function stats(out){
            const a=out?.audio??out?.data??null;
            if(!a||typeof a.length!=='number')return{samples:0,finite:false,rms:null,peak:null};
            let sum=0,peak=0,finite=true;
            for(let i=0;i<a.length;i++){
              const v=Number(a[i]);
              if(!Number.isFinite(v)){finite=false;break;}
              sum+=v*v; const av=Math.abs(v); if(av>peak)peak=av;
            }
            return{samples:a.length,finite,rms:finite&&a.length?Math.sqrt(sum/a.length):null,peak:finite?peak:null};
          }
          try{
            const mod=await import('./vendor/kokoro-js/kokoro.web.js?nv=m025-22');
            mod.env.wasmEnv.numThreads=1; mod.env.wasmEnv.proxy=true;
            const runtime={navigator:{standalone:true,gpu:navigator.gpu||null},crossOriginIsolated:false,matchMedia(){return{matches:true}}};
            const adapter=FiezelKokoroAdapter.createKokoroAdapter({KokoroTTS:mod.KokoroTTS,kokoroEnv:mod.env,setVoiceDataUrl:mod.setVoiceDataUrl,
              modelId:'kokoro-model',localModelPath:'./vendor/',voiceBaseUrl:'./vendor/kokoro-model/voices',wasmBasePath:location.origin+'/vendor/kokoro-js/wasm/',runtimeOrigin:location.origin,
              runtime,dtype,device:'wasm',onStage:e=>events.push({t:performance.now(),...e})});
            const i0=performance.now(); await adapter.initialize(); const initMs=Math.round(performance.now()-i0);
            const rows=[];
            for(let n=0;n<3;n++){
              const before=events.length,t0=performance.now();
              const out=await adapter.generate(text,{voice:'af_heart',speed:1});
              const slice=events.slice(before),s=stats(out);
              rows.push({iteration:n+1,elapsedMs:Math.round(performance.now()-t0),modelMs:slice.find(e=>e.phase==='adapter_model_resolved')?.elapsedMs??null,
                tokenCount:slice.find(e=>e.phase==='adapter_tokenizer_resolved')?.tokenCount??null,...s});
            }
            const warm=rows.slice(1).map(r=>Number(r.modelMs)||999999);
            const warmMax=Math.max(...warm);
            finish({success:true,dtype,userAgent:navigator.userAgent,initMs,rows,warmMax,backend:adapter.getBackendState(),policy:events.filter(e=>e.phase==='wasm_policy')});
          }catch(error){finish({success:false,dtype,status:window.__benchStatus,error:String(error?.stack||error),events});}
          </script>
          HTML
      - name: Start server and SafariDriver
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/m02531-http.log 2>&1 &
          sudo /usr/bin/safaridriver --enable || /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver --port 4444 >/tmp/m02531-safaridriver.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4444/status >/tmp/m02531-status.json 2>/dev/null && break; sleep 1; done
      - name: Run q8 and q4 differential
        run: |
          set -euo pipefail
          run_one(){
            dtype="$1"; out="m02531-${dtype}.json"
            sj="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
            sid="$(echo "$sj"|jq -r '.value.sessionId // .sessionId // empty')"; test -n "$sid"
            curl -fsS -H 'Content-Type: application/json' -d "{\"url\":\"http://127.0.0.1:8000/.m02531-bench.html?dtype=${dtype}\"}" "http://127.0.0.1:4444/session/$sid/url" >/dev/null
            result=''
            for i in {1..300}; do
              resp="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return window.__benchResult||null;","args":[]}' "http://127.0.0.1:4444/session/$sid/execute/sync" 2>/dev/null || true)"
              result="$(echo "$resp"|jq -c '.value // empty' 2>/dev/null || true)"
              [ -n "$result" ] && [ "$result" != null ] && break
              sleep 1
            done
            curl -sS -X DELETE "http://127.0.0.1:4444/session/$sid" >/dev/null || true
            test -n "$result"
            echo "$result"|jq .|tee "$out"
            test "$(echo "$result"|jq -r '.success')" = true
          }
          run_one q8
          run_one q4
          jq -s '.' m02531-q8.json m02531-q4.json | tee m02531-summary.json
          Q8_SAMPLES="$(jq -r '.rows[1].samples' m02531-q8.json)"
          Q4_SAMPLES="$(jq -r '.rows[1].samples' m02531-q4.json)"
          jq -n --argjson a "$Q4_SAMPLES" --argjson b "$Q8_SAMPLES" '$a / $b' | tee m02531-duration-ratio.txt
          RATIO="$(cat m02531-duration-ratio.txt)"
          Q4_WARM_MAX="$(jq -r '.warmMax' m02531-q4.json)"
          Q4_FINITE="$(jq -r '[.rows[].finite] | all' m02531-q4.json)"
          Q4_RMS_OK="$(jq -r '[.rows[].rms > 0.0001] | all' m02531-q4.json)"
          echo "q4_warm_max_ms=$Q4_WARM_MAX duration_ratio=$RATIO finite=$Q4_FINITE rms_ok=$Q4_RMS_OK"
          test "$Q4_FINITE" = true
          test "$Q4_RMS_OK" = true
          awk -v r="$RATIO" 'BEGIN{exit !(r>=0.80 && r<=1.20)}'
          test "$Q4_WARM_MAX" -le 5000
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02531-q4-wasm-${{ github.sha }}
          path: |
            m02531-q8.json
            m02531-q4.json
            m02531-summary.json
            m02531-duration-ratio.txt
            m02531-q4-size.txt
            m02531-q4-sha256.txt
            m02531-model-revision.txt
            /tmp/m02531-http.log
            /tmp/m02531-safaridriver.log
          if-no-files-found: warn
          retention-days: 30
