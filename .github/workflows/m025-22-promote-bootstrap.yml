name: m025-22 Proxy Bootstrap Promotion
on:
  push:
    branches:
      - master/perf39-real-wasm-proxy-m02522
    paths:
      - '.github/workflows/m025-22-promote-bootstrap.yml'
      - '.github/scripts/m02522-promote-bootstrap.py'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact m025-22 bootstrap, marker, and gate contract
        run: python .github/scripts/m02522-promote-bootstrap.py
      - name: Syntax check
        run: |
          node --check features/neural-voice/fiezel-neural-voice-bootstrap.js
          node --check features/neural-voice/fiezel-diag-panel.js
          node --check sw.js
          node --check neural-voice-test.js
      - name: Commit coherent repair files on branch
        shell: bash
        run: |
          git config user.name 'FIEZEL MASTER CI'
          git config user.email 'actions@users.noreply.github.com'
          git add features/neural-voice/fiezel-neural-voice-bootstrap.js features/neural-voice/fiezel-diag-panel.js sw.js neural-voice-test.js
          if git diff --cached --quiet; then
            echo 'Bootstrap, markers, and gate already promoted'
            exit 0
          fi
          git commit -m 'test: make physical acceptance gate state-aware'
          git push origin HEAD:master/perf39-real-wasm-proxy-m02522
