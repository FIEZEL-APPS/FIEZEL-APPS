# SEMENTARA - generate VO promo via ElevenLabs (secrets: ELEVENLABS_API_KEY + VOICE_ID).
# Hanya workflow_dispatch. Hapus file ini setelah VO promo selesai diproduksi.
name: Promo VO (temp)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: promo-vo-temp
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate promo VO
        env:
          XI_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          XI_VOICE: ${{ secrets.ELEVENLABS_VOICE_ID }}
          XI_MODEL: ${{ secrets.ELEVENLABS_MODEL_ID }}
        run: |
          mkdir -p vo_out
          gen() {
            name="$1"; text="$2"; voice="${3:-$XI_VOICE}"
            curl -sS -f -X POST "https://api.elevenlabs.io/v1/text-to-speech/${voice}?output_format=mp3_44100_128" \
              -H "xi-api-key: ${XI_KEY}" -H "Content-Type: application/json" \
              --data "$(jq -n --arg t "$text" --arg m "${XI_MODEL:-eleven_multilingual_v2}" \
                '{text:$t, model_id:$m, voice_settings:{stability:0.35, similarity_boost:0.8, style:0.6}}')" \
              -o "vo_out/${name}.mp3"
            echo "ok ${name} $(stat -c%s vo_out/${name}.mp3) bytes"
          }
          gen s00 "Aplikasi kamu cuma bilang salah? Ya udah, gitu doang?"
          gen s01 "Gimana kalau ada yang beneran merhatiin cara kamu mikir?"
          gen s03 "Buat Fizel, salah itu data — biar dia makin ngerti kamu!"
          gen s08 "Ratusan pelajaran, dari A satu sampe C dua — dan semuanya gratis!"
          gen s02 "Kenalin — Fizel! Bareng maskotnya, PAW!"
          gen s04 "Fizel nggak cuma bilang bener apa salah — dia jelasin kenapa!"
          gen s05 "Pas kamu stuck? Nggak langsung dikasih jawaban. Kamu dipancing mikir dulu, baru dibantu pelan-pelan."
          gen s06_listening_en "Hello! I am Anna, from London!" "21m00Tcm4TlvDq8ikWAM"
          gen s06 "Tiap sesi, dia makin ngerti kamu!"
          gen s07 "Fizel nyari pola lemah kamu — biar sesi berikutnya emang yang kamu butuhin!"
          gen s09 "Fizel! Ngerti kamu, bukan cuma ngajar kamu. Gas, mulai belajar!"
      - uses: actions/upload-artifact@v4
        with:
          name: promo-vo
          path: vo_out/
          retention-days: 3
