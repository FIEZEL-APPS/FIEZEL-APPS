name: FIEZEL m025-5 Read-only Candidate Build

on:
  push:
    branches:
      - master/m025-5-safari-phonemizer-compat
    paths:
      - 'NEURAL-VOICE-SOURCE-LOCK.json'
      - 'vendor/kokoro-js/source-overrides/**'
      - 'vendor/kokoro-js/source-patches/**'
      - 'tools/rebuild-neural-vendor.sh'
      - 'tools/promote-m0255-runtime.mjs'
      - 'tools/materialize-m0255-vendor.sh'
      - '.github/workflows/m025-5-candidate-build.yml'

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build m025-5 vendor candidate (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify source-derived candidate without repository writes
        shell: bash
        run: |
          set +e
          bash tools/rebuild-neural-vendor.sh
          rc=$?
          set -e

          mkdir -p .vendor-repro
          echo "runtime_compare_exit=$rc" | tee -a .vendor-repro/candidate-report.txt
          test -s .vendor-repro/kokoro.web.js

          expected_sha="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.bundle.sha256")"
          expected_size="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.bundle.sizeBytes")"
          candidate_state="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.state")"
          runtime_promoted="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.provenance.runtimePromoted")"
          runtime_sha="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').runtime.bundle.sha256")"
          runtime_size="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').runtime.bundle.sizeBytes")"
          actual_sha="$(sha256sum .vendor-repro/kokoro.web.js | awk '{print $1}')"
          actual_size="$(stat -c '%s' .vendor-repro/kokoro.web.js)"

          printf 'candidateState=%s\nruntimePromoted=%s\nruntimeSha256=%s\nruntimeSize=%s\nexpectedCandidateSha256=%s\nactualCandidateSha256=%s\nexpectedCandidateSize=%s\nactualCandidateSize=%s\n' \
            "$candidate_state" "$runtime_promoted" "$runtime_sha" "$runtime_size" "$expected_sha" "$actual_sha" "$expected_size" "$actual_size" \
            | tee -a .vendor-repro/candidate-report.txt

          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"

          # Semantic guard: the exact m025-5 bundle must visibly carry the
          # Safari ReadableStream async-iterator compatibility implementation.
          # Historical clean-room m025-4 has zero occurrences of the explicit
          # ReadableStream prototype guard and zero releaseLock() occurrences.
          node <<'NODE'
          const fs = require('fs');
          const bundle = fs.readFileSync('.vendor-repro/kokoro.web.js', 'utf8');
          const count = needle => bundle.split(needle).length - 1;
          const asyncIteratorGuards = count('ReadableStream.prototype[Symbol.asyncIterator]');
          const releaseLocks = count('releaseLock()');
          if (asyncIteratorGuards !== 2) {
            throw new Error(`m025-5 Safari guard drift: expected 2 ReadableStream.prototype[Symbol.asyncIterator] occurrences, got ${asyncIteratorGuards}`);
          }
          if (releaseLocks !== 1) {
            throw new Error(`m025-5 Safari guard drift: expected 1 releaseLock() occurrence, got ${releaseLocks}`);
          }
          if (!bundle.includes('ReadableStream.prototype[Symbol.asyncIterator]=async function*()')) {
            throw new Error('m025-5 Safari guard missing async-generator assignment');
          }
          if (!bundle.includes('this.getReader()')) {
            throw new Error('m025-5 Safari guard missing getReader() path');
          }
          console.log(`m025-5 Safari semantic guard PASS: asyncIteratorGuards=${asyncIteratorGuards} releaseLocks=${releaseLocks}`);
          NODE

          if [[ "$runtime_promoted" == 'false' ]]; then
            test "$candidate_state" = 'SOURCE_CANDIDATE_PROVEN / PROMOTION_BLOCKED'
            test "$rc" -ne 0
            test "$runtime_sha" != "$expected_sha"
            test "$runtime_size" != "$expected_size"
            echo 'Candidate bytes match the staged m025-5 lock; mismatch with the m025-4 runtime lock remains an intentional promotion barrier.' \
              | tee -a .vendor-repro/candidate-report.txt
          elif [[ "$runtime_promoted" == 'true' ]]; then
            test "$candidate_state" != 'SOURCE_CANDIDATE_PROVEN / PROMOTION_BLOCKED'
            test "$rc" -eq 0
            test "$runtime_sha" = "$expected_sha"
            test "$runtime_size" = "$expected_size"
            echo 'Promoted runtime reproduces byte-for-byte from the locked m025-5 source candidate.' \
              | tee -a .vendor-repro/candidate-report.txt
          else
            echo "Candidate runtimePromoted must be boolean, got: $runtime_promoted" >&2
            exit 1
          fi
      - name: Verify permanent transport delta reconstructs the same exact candidate
        shell: bash
        run: |
          set -euo pipefail
          runtime_promoted="$(node -p "String(require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.provenance.runtimePromoted)")"
          if [[ "$runtime_promoted" == 'false' ]]; then
            bash tools/materialize-m0255-vendor.sh \
              vendor/kokoro-js/kokoro.web.js \
              .vendor-repro/delta-materialized-kokoro.web.js
            cmp .vendor-repro/kokoro.web.js .vendor-repro/delta-materialized-kokoro.web.js
            echo 'Permanent m025-4 -> m025-5 transport delta reconstructs source-build candidate byte-for-byte.' \
              | tee -a .vendor-repro/candidate-report.txt
          else
            echo 'Runtime already promoted; transport delta remains historical recovery evidence and is intentionally not applied to an m025-5 base.' \
              | tee -a .vendor-repro/candidate-report.txt
          fi
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: m025-5-vendor-candidate-${{ github.sha }}
          path: .vendor-repro/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  promoted-preflight:
    name: Simulate atomic m025-5 promotion (read-only)
    needs: build-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download exact candidate produced by this head
        uses: actions/download-artifact@v4
        with:
          name: m025-5-vendor-candidate-${{ github.sha }}
          path: .candidate-artifact
      - name: Detect committed promotion state
        id: state
        shell: bash
        run: |
          echo "runtime_promoted=$(node -p "String(require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.provenance.runtimePromoted)")" >> "$GITHUB_OUTPUT"
      - name: Apply exact candidate only inside the ephemeral runner workspace
        if: steps.state.outputs.runtime_promoted == 'false'
        run: node tools/promote-m0255-runtime.mjs .candidate-artifact/kokoro.web.js --apply
      - name: Verify atomic six-file promotion scope
        if: steps.state.outputs.runtime_promoted == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/promoted-files.txt
          cat > /tmp/expected-promoted-files.txt <<'EOF'
          NEURAL-VOICE-SOURCE-LOCK.json
          features/neural-voice/fiezel-diag-panel.js
          features/neural-voice/fiezel-neural-voice-bootstrap.js
          neural-voice-device-hotfix-test.js
          sw.js
          vendor/kokoro-js/kokoro.web.js
          EOF
          sort -o /tmp/expected-promoted-files.txt /tmp/expected-promoted-files.txt
          diff -u /tmp/expected-promoted-files.txt /tmp/promoted-files.txt
          git diff --check
      - name: Verify promoted release markers against current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base_diag="$(git show origin/main:features/neural-voice/fiezel-diag-panel.js | sed -nE "s/.*var DIAG_BUILD = 'm025-([0-9]+)'.*/\1/p" | head -n1)"
          head_diag="$(sed -nE "s/.*var DIAG_BUILD = 'm025-([0-9]+)'.*/\1/p" features/neural-voice/fiezel-diag-panel.js | head -n1)"
          test -n "$base_diag"
          test -n "$head_diag"
          test "$head_diag" -eq "$((base_diag + 1))"
          grep -F "const SW_REV='m025-${head_diag}-" sw.js >/dev/null
      - name: Prove strict clean-room reproduction in the promoted state
        shell: bash
        run: |
          set -euo pipefail
          bash tools/rebuild-neural-vendor.sh
          node neural-voice-m0255-promotion-test.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned push dependency
        run: npm install --ignore-scripts
      - name: Syntax in simulated promoted state
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0)
      - name: Full Quality core validation in simulated promoted state
        run: |
          node validator.js
          node regression-test.js
          node content-audit.js
          node content-qa-agent.js
          node content-qa-agent-test.js
          node content-patch-gate-test.js
          node content-canary-test.js
          node content-promotion-test.js
          node content-adoption-evidence-test.js
          node content-evidence-origin-test.js
          node content-adoption-rehearsal-test.js
          node content-adoption-test.js
          node product-audit.js
          node runtime-stage8-test.js
          node ai-integration-test.js
          node experience-integration-test.js
          node lesson-experience-test.js
          node ui-structure-test.js
          node grammar-quality-audit.js
          node notification-reminder-test.js
          node remote-push-test.js
          node core-brain-test.js
          node core-worker-contract-test.js
          node learner-evidence-test.js
          node alrs-behavior-test.js
          node adaptive-policy-test.js
          node policy-outcome-test.js
          node pwa-cache-test.js
          node http-smoke-test.js
          node speaking-listening-test.js
          node neural-voice-test.js
          node ios-wasm-module-test.js
          node ios-cache-compat-test.js
          node neural-voice-http-test.js
          node neural-voice-audibility-test.js
          node diag-panel-test.js
          node diag-search-test.js
          node neural-voice-fix-test.js
          node sw-corp-test.js
          node neural-voice-product-repair-test.js
          node neural-voice-device-hotfix-test.js
          node neural-voice-m0255-promotion-test.js
          node neural-voice-timeout-phase-test.js
          node neural-voice-generation-timeout-test.js
          node neural-voice-single-flight-test.js
          node neural-voice-diagnostics-retention-test.js
          node puter-auth-coop-test.js
          node puter-auth-diagnostics-test.js
