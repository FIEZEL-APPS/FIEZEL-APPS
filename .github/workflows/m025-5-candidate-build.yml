name: FIEZEL m025-5 Read-only Candidate Build

on:
  push:
    branches:
      - master/m025-5-safari-phonemizer-compat
    paths:
      - 'NEURAL-VOICE-SOURCE-LOCK.json'
      - 'vendor/kokoro-js/source-overrides/**'
      - 'vendor/kokoro-js/source-patches/**'
      - 'tools/rebuild-neural-vendor.sh'
      - '.github/workflows/m025-5-candidate-build.yml'

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build m025-5 vendor candidate (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify source-derived candidate without repository writes
        shell: bash
        run: |
          set +e
          bash tools/rebuild-neural-vendor.sh
          rc=$?
          set -e

          mkdir -p .vendor-repro
          echo "baseline_compare_exit=$rc" | tee -a .vendor-repro/candidate-report.txt
          test "$rc" -ne 0
          test -s .vendor-repro/kokoro.web.js

          expected_sha="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.bundle.sha256")"
          expected_size="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.bundle.sizeBytes")"
          candidate_state="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.state")"
          runtime_promoted="$(node -p "require('./NEURAL-VOICE-SOURCE-LOCK.json').candidate.provenance.runtimePromoted")"
          actual_sha="$(sha256sum .vendor-repro/kokoro.web.js | awk '{print $1}')"
          actual_size="$(stat -c '%s' .vendor-repro/kokoro.web.js)"

          printf 'candidateState=%s\nruntimePromoted=%s\nexpectedCandidateSha256=%s\nactualCandidateSha256=%s\nexpectedCandidateSize=%s\nactualCandidateSize=%s\n' \
            "$candidate_state" "$runtime_promoted" "$expected_sha" "$actual_sha" "$expected_size" "$actual_size" \
            | tee -a .vendor-repro/candidate-report.txt

          test "$candidate_state" = 'SOURCE_CANDIDATE_PROVEN / PROMOTION_BLOCKED'
          test "$runtime_promoted" = 'false'
          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"

          echo 'Candidate bytes match the staged m025-5 lock; mismatch with the m025-4 runtime lock remains an intentional promotion barrier.' \
            | tee -a .vendor-repro/candidate-report.txt
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: m025-5-vendor-candidate-${{ github.sha }}
          path: .vendor-repro/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
