name: m025-22 Stale Test Repair
on:
  push:
    branches:
      - master/perf39-real-wasm-proxy-m02522
    paths:
      - '.github/workflows/m025-22-repair-stale-tests.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance device-hotfix invariants to m025-22 real proxy contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('neural-voice-device-hotfix-test.js')
          text=p.read_text()
          replacements={
            "assert.ok(boot.includes(\"wasmEnv.proxy=false\"),'Apple policy must avoid the proxy-worker roundtrip when the env is directly exposed');": "assert.ok(boot.includes(\"wasmEnv.proxy=true\"),'Apple standalone policy must enable the real ORT proxy worker before session creation');",
            "assert.ok(boot.includes(\"apple-standalone-single-thread-direct\"));": "assert.ok(boot.includes(\"apple-standalone-single-thread-proxy-worker\"));",
            "assert.ok(adapter.includes(\"apple-standalone-single-thread-direct-default\"),'m025-5 must label the pinned ORT default policy without pretending read-back verification');": "assert.ok(adapter.includes(\"apple-standalone-single-thread-proxy-worker\"),'m025-22 must label the real Apple ORT proxy-worker policy');",
            "assert.ok(adapter.includes('readBack: false'),'effective default diagnostics must not claim a setter/read-back verification that the Kokoro wrapper cannot expose');": "assert.ok(adapter.includes('readBack: !!wasm'),'m025-22 diagnostics must report whether the real source-derived WASM env is available for readback');",
            "assert.ok(boot.includes(\"vendor/kokoro-js/kokoro.web.js?nv=m025-5\"),'m025-5 must import the versioned vendor URL');": "assert.ok(boot.includes(\"vendor/kokoro-js/kokoro.web.js?nv=m025-22\"),'m025-22 must import the fresh source-derived vendor URL');",
            "assert.ok(!sw.includes(\"'./vendor/kokoro-js/kokoro.web.js?nv=m025-5'\"),'m025-16 SW install must not own/pre-cache the versioned neural runtime URL');": "assert.ok(!sw.includes(\"'./vendor/kokoro-js/kokoro.web.js?nv=m025-22'\"),'shell SW must not own/pre-cache the m025-22 neural runtime URL');",
          }
          for old,new in replacements.items():
            if new in text:
              continue
            if old not in text:
              raise SystemExit('stale device-hotfix assertion missing: '+old[:100])
            text=text.replace(old,new)
          stale=["wasmEnv.proxy=false","apple-standalone-single-thread-direct'","kokoro.web.js?nv=m025-5"]
          for value in stale:
            if value in text:
              raise SystemExit('stale m025-5/direct assertion remains: '+value)
          p.write_text(text)
          PY
          node --check neural-voice-device-hotfix-test.js
          node neural-voice-device-hotfix-test.js
      - name: Commit repaired invariant
        shell: bash
        run: |
          git config user.name 'FIEZEL MASTER CI'
          git config user.email 'actions@users.noreply.github.com'
          git add neural-voice-device-hotfix-test.js
          git diff --cached --quiet && exit 0
          git commit -m 'test: align device hotfix gate with real WASM proxy'
          git push origin HEAD:master/perf39-real-wasm-proxy-m02522
