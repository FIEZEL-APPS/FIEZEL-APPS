name: m025-49 rebase marker fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  markers:
    runs-on: ubuntu-latest
    if: github.head_ref == 'claude/neural-voice-crackin-delayed-259tmj'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/neural-voice-crackin-delayed-259tmj
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact release marker increment
        run: python3 tools/m02549-rebase-marker.py
      - name: Verify combined milestones before commit
        run: |
          node neural-voice-m02549-puter-test.js
          node neural-voice-m026-raw-pcm-ab-test.js
          node pwa-release-coherence-test.js
          git diff --check
          grep -q "DIAG_BUILD = 'm025-49'" features/neural-voice/fiezel-diag-panel.js
          grep -q "SW_REV='m025-49-" sw.js
      - name: Commit marker-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fitrajft-ux'
          git config user.email 'fitrajft@gmail.com'
          git add features/neural-voice/fiezel-diag-panel.js sw.js
          git commit -m 'm025-49: advance release markers over T-026 baseline'
          git push origin HEAD:claude/neural-voice-crackin-delayed-259tmj
