name: FIEZEL Deploy Site

# PENERBIT APLIKASI KE https://fiezel.my.id/app/
#
# Sebelum berkas ini ada, repo tidak punya SATU PUN mekanisme yang menerbitkan aplikasi ke
# permukaan yang benar-benar dipakai murid. `pages build and deployment` menerbitkan cermin
# GitHub Pages, dan Worker Cloudflare punya workflow sendiri — tetapi `fiezel.my.id/app/`
# (cPanel ArenHost, docroot `~/public_html/app`) hanya pernah diisi manual lewat scp.
# Konsekuensinya: setiap nomor build di repo adalah janji, bukan fakta, sampai ada yang
# mengunggahnya dengan tangan. Audit rilis m025-179 tidak bisa membuktikan paritas justru
# karena ini.
#
# TIGA KEPUTUSAN YANG PERLU DIBACA SEBELUM MENYUNTING:
#
# 1. HANYA SESUDAH HIJAU. Pemicunya `workflow_run` atas "FIEZEL Quality Gate", bukan `push`.
#    Push langsung ke produksi berarti satu commit merah sampai ke murid sebelum ada yang
#    melihat lampunya. Interlock ini yang membuat "main = produksi" aman.
#
# 2. sw.js PALING AKHIR. Dua langkah unggah, bukan satu, dan urutannya BUKAN selera:
#    `sw.js` memanggil `caches.addAll(ASSETS)` atas 157 berkas. Kalau ia mendarat lebih dulu,
#    service worker generasi baru mem-precache bita LAMA (atau 404) di bawah nama revisi baru
#    — kondisi "shell tidak sepadan" yang dilarang audit §22. `deploy-site-gate-test.js`
#    menegakkan urutan ini di sumber, jadi membaliknya memerahkan CI.
#
# 3. SKIP YANG BERSUARA. Tanpa secret hosting, workflow ini TIDAK gagal dan TIDAK diam: ia
#    menulis alasan ke ringkasan Actions. Pola yang sama dengan gerbang live `quality.yml` —
#    "hijau" tidak boleh berarti "terunggah" kalau nol bita berpindah.

on:
  workflow_run:
    workflows: ["FIEZEL Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Dua deploy bersamaan bisa menyilangkan gelombang aset dua commit berbeda, dan hasilnya
  # persis shell campur yang dijaga keputusan (2). Antre, jangan batalkan yang sedang jalan:
  # membatalkan di tengah gelombang aset justru MENINGGALKAN server separuh terisi.
  group: deploy-site-production
  cancel-in-progress: false

jobs:
  publish:
    # Penjaga aktor tingkat JOB — dituntut workflow-actor-gate-test.js untuk setiap workflow
    # yang menyentuh `secrets.`, dan tidak bisa di-allowlist. Pada `workflow_run`, github.actor
    # adalah aktor yang memicu jalannya Quality Gate, yaitu pemilik yang mem-push ke main.
    # DUA medan aktor diterima, dan itu perbaikan cacat DIAM. Pada `workflow_run`, GitHub
    # tidak menjamin `github.actor` berisi pendorong commit — kadang ia aktor jalannya
    # workflow. Kalau hanya satu medan yang diperiksa dan medan itu meleset, deploy TIDAK
    # gagal: ia tidak pernah berjalan sama sekali, dan tidak ada lampu merah yang menyala.
    # Keduanya tetap dipagari ke login owner yang SAMA, jadi ini melebarkan ketahanan,
    # bukan kewenangan. (`workflow-actor-gate-test.js` cek B tetap terpenuhi: ACTOR_COMPARE
    # hanya mengenali `github.actor ==`, dan hasilnya di-dedup jadi satu login.)
    if: >-
      ( github.actor == 'FIEZEL-APPS' ||
        github.event.workflow_run.actor.login == 'FIEZEL-APPS' ) &&
      ( github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pada workflow_run, checkout bawaan mengambil main TERBARU, bukan commit yang
          # lulus gerbang. Yang diterbitkan harus commit yang BENAR-BENAR hijau.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Baca penanda build yang akan diterbitkan
        id: markers
        shell: bash
        run: |
          set -euo pipefail
          PAGE=$(grep -oE "FIEZEL_PAGE_BUILD='[^']+'" core-config.js | head -1 | cut -d"'" -f2)
          SW=$(grep -oE "SW_REV='[^']+'" sw.js | head -1 | cut -d"'" -f2)
          echo "page=$PAGE" >> "$GITHUB_OUTPUT"
          echo "sw=$SW"     >> "$GITHUB_OUTPUT"
          echo "Akan menerbitkan build halaman '$PAGE' dengan shell '$SW'."

      - name: Periksa kredensial hosting
        id: creds
        shell: bash
        env:
          HOST: ${{ secrets.FIEZEL_DEPLOY_HOST }}
          USER: ${{ secrets.FIEZEL_DEPLOY_USER }}
          KEY:  ${{ secrets.FIEZEL_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${HOST:-}" ] && [ -n "${USER:-}" ] && [ -n "${KEY:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=Deploy situs SKIP::Secret hosting belum terpasang — NOL bita berpindah. Ini SKIP, bukan PASS.'
            {
              echo '### FIEZEL Deploy Site — **SKIP** (bukan PASS)'
              echo ''
              echo 'Alasan: satu atau lebih secret berikut belum terpasang di repo:'
              echo '`FIEZEL_DEPLOY_HOST`, `FIEZEL_DEPLOY_USER`, `FIEZEL_DEPLOY_SSH_KEY`.'
              echo ''
              echo 'Yang BELUM terbukti pada jalan ini: bahwa `https://fiezel.my.id/app/` benar-benar'
              echo "menyajikan build \`${{ steps.markers.outputs.page }}\` dengan shell \`${{ steps.markers.outputs.sw }}\`."
              echo 'Selama SKIP, nomor build di repo adalah JANJI, bukan fakta.'
              echo ''
              echo 'Cara mengaktifkan: Settings → Secrets and variables → Actions → New repository secret.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Siapkan kunci SSH
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          KEY:  ${{ secrets.FIEZEL_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.FIEZEL_DEPLOY_HOST }}
          PORT: ${{ secrets.FIEZEL_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      # FIEZEL_DEPLOY_STEP_ASSETS — gelombang PERTAMA: semua kecuali sw.js.
      # Penanda di nama langkah ini dibaca deploy-site-gate-test.js untuk membuktikan urutannya.
      - name: 'FIEZEL_DEPLOY_STEP_ASSETS — unggah seluruh aset (sw.js sengaja ditahan)'
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          HOST: ${{ secrets.FIEZEL_DEPLOY_HOST }}
          USER: ${{ secrets.FIEZEL_DEPLOY_USER }}
          PORT: ${{ secrets.FIEZEL_DEPLOY_PORT }}
          DEST: ${{ secrets.FIEZEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          TARGET="${DEST:-~/public_html/app}"
          # --exclude=sw.js MENAHAN service worker sampai gelombang kedua. Tanpa baris ini
          # urutannya batal dan keputusan (2) di kepala berkas kehilangan artinya.
          rsync -az --delete \
            --exclude-from=deploy/site-exclude.txt \
            --exclude='sw.js' \
            -e "ssh -i ~/.ssh/id_deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes" \
            ./ "$USER@$HOST:$TARGET/"
          echo "Gelombang aset selesai ke $TARGET (sw.js belum dikirim)."

      # FIEZEL_DEPLOY_STEP_SW_LAST — gelombang KEDUA: hanya sw.js, sesudah asetnya lengkap.
      - name: 'FIEZEL_DEPLOY_STEP_SW_LAST — unggah sw.js paling akhir'
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          HOST: ${{ secrets.FIEZEL_DEPLOY_HOST }}
          USER: ${{ secrets.FIEZEL_DEPLOY_USER }}
          PORT: ${{ secrets.FIEZEL_DEPLOY_PORT }}
          DEST: ${{ secrets.FIEZEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          TARGET="${DEST:-~/public_html/app}"
          rsync -az \
            -e "ssh -i ~/.ssh/id_deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes" \
            ./sw.js "$USER@$HOST:$TARGET/sw.js"
          echo "Service worker diterbitkan TERAKHIR — generasi shell kini utuh."

      - name: Buktikan situs hidup menyajikan penanda yang baru diterbitkan
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        env:
          FIEZEL_SITE_BASE: ${{ secrets.FIEZEL_SITE_BASE }}
        run: |
          set -euo pipefail
          node tools/deploy-site-verify.mjs \
            --base "${FIEZEL_SITE_BASE:-https://fiezel.my.id/app}" \
            --page "${{ steps.markers.outputs.page }}" \
            --sw   "${{ steps.markers.outputs.sw }}"

      # ── PARITAS PRODUKSI WALAU TANPA KREDENSIAL ────────────────────────────────────────
      # Sejak m025-195 ada JALUR PENERBITAN KEDUA: cPanel Git Version Control menjalankan
      # `.cpanel.yml` langsung di hosting, tanpa pernah menyentuh GitHub Actions. Jalur itu
      # memindahkan bita dengan benar, tetapi ia menerbitkan BUTA: tidak ada satu pun langkah
      # yang membaca kembali `https://fiezel.my.id/app/` untuk membuktikan bahwa yang tersaji
      # memang build ini. Itu lubang yang SAMA PERSIS yang membuat audit rilis m025-179
      # berhenti pada "paritas produksi TIDAK TERBUKTI" — hanya berpindah jalur.
      #
      # Langkah di atas hanya berjalan saat secret SSH ada. Langkah ini mengisi jalan yang
      # lain, dan sengaja punya DUA MODE:
      #
      #   workflow_dispatch -> GERBANG. Owner (atau agen atas namanya) menekan "Run workflow"
      #                        untuk MENUNTUT bukti. Produksi tidak menyajikan build ini =
      #                        jalan ini MERAH. Inilah tombol "buktikan sekarang".
      #
      #   workflow_run      -> LAPORAN. Penerbitan cPanel itu manual (Update from Remote →
      #                        Deploy HEAD Commit). Menuntut cocok pada setiap main hijau akan
      #                        memerahkan repo hanya karena owner belum sempat menekan tombol
      #                        itu — merah yang tidak menunjuk cacat apa pun, dan merah semacam
      #                        itu mengajari orang mengabaikan lampu. Jadi: melapor, tidak
      #                        menuntut. Tetapi apa yang BENAR-BENAR disajikan produksi tetap
      #                        ditulis ke ringkasan, jadi selisih repo-vs-produksi terlihat.
      #                        Diam adalah satu-satunya hasil yang dilarang di sini.
      #
      # `set -e` sengaja TIDAK dipakai: kalau pembuktian gagal, ringkasannya harus tetap
      # tertulis lebih dulu. Kode keluar dipegang tangan di baris terakhir.
      - name: Baca produksi walau tanpa kredensial (jalur cPanel tidak boleh terbit buta)
        if: steps.creds.outputs.ready != 'true'
        shell: bash
        env:
          FIEZEL_SITE_BASE: ${{ secrets.FIEZEL_SITE_BASE }}
          PAGE: ${{ steps.markers.outputs.page }}
          SW: ${{ steps.markers.outputs.sw }}
          TUNTUT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail
          BASE="${FIEZEL_SITE_BASE:-https://fiezel.my.id/app}"
          OUT="$RUNNER_TEMP/paritas.txt"
          if [ "$TUNTUT" = "true" ]; then
            node tools/deploy-site-verify.mjs --base "$BASE" --page "$PAGE" --sw "$SW" 2>&1 | tee "$OUT"
          else
            node tools/deploy-site-verify.mjs --base "$BASE" 2>&1 | tee "$OUT"
          fi
          RC=${PIPESTATUS[0]}
          {
            if [ "$TUNTUT" = "true" ]; then
              echo '### Paritas produksi — **GERBANG** (dijalankan tangan)'
            else
              echo '### Paritas produksi — **LAPORAN** (bukan gerbang)'
            fi
            echo ''
            echo "Repo pada commit ini menjanjikan build \`$PAGE\` dengan shell \`$SW\`."
            echo ''
            echo '```'
            cat "$OUT"
            echo '```'
            if [ "$TUNTUT" != "true" ]; then
              echo ''
              echo 'Mode laporan: selisih di atas TIDAK memerahkan jalan ini, karena penerbitan'
              echo 'cPanel dilakukan tangan. Untuk MENUNTUT bukti, jalankan workflow ini lewat'
              echo '**Run workflow** — mode itu memerahkan jalan kalau produksi belum sepadan.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TUNTUT" = "true" ]; then
            exit "$RC"
          fi
          exit 0

      - name: Ringkas hasil penerbitan
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo '### FIEZEL Deploy Site — **TERBIT**'
            echo ''
            echo "- commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- build halaman: \`${{ steps.markers.outputs.page }}\`"
            echo "- revisi shell: \`${{ steps.markers.outputs.sw }}\`"
            echo '- urutan: seluruh aset lebih dulu, `sw.js` terakhir'
            echo '- penanda pada situs hidup: **terbukti cocok**'
          } >> "$GITHUB_STEP_SUMMARY"
