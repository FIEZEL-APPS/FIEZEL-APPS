# m025-184: sakelar KV fitur sosial (`cfg:flags`), dijalankan manual oleh owner.
#
# Fitur sosial lahir MATI di tiga sakelar AND (route-social.js): var FEATURE_SOCIAL,
# KV `enabled.social`, KV `flags.cfSocialEnabled`. Var dinyalakan lewat wrangler.toml +
# deploy; dua sakelar KV dinyalakan/dimatikan lewat workflow ini. PENTING: nilai KV
# di-MERGE, bukan ditimpa — flag AI/TTS yang sudah hidup tidak boleh ikut berubah.
#
# `mode: off` adalah kill switch: mematikan dua kunci sosial tanpa menyentuh yang lain.
name: FIEZEL Social Flag

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "on = nyalakan fitur sosial, off = kill switch"
        required: true
        default: "on"
        type: choice
        options: ["on", "off"]

permissions:
  contents: read

concurrency:
  group: fiezel-social-flag
  cancel-in-progress: false

jobs:
  flag:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge cfg:flags
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Ambil id namespace CFG dari worker fiezel-api yang live (sumber yang sama
          # dengan deploy-api-worker.yml; token tidak berizin me-list namespace).
          KV_ID=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/fiezel-api/settings" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s).result.bindings.find(b=>b.name==='CFG');if(!b)process.exit(1);console.log(b.namespace_id||b.id)})")
          test -n "$KV_ID"
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_ID/values/cfg:flags" || echo '{}')
          MERGED=$(echo "$CUR" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              let j={}; try{j=JSON.parse(s)||{}}catch(_){j={}}
              const on = process.env.MODE === 'on';
              j.enabled = Object.assign({}, j.enabled, { social: on });
              j.flags   = Object.assign({}, j.flags,   { cfSocialEnabled: on });
              process.stdout.write(JSON.stringify(j));
            })")
          echo "$MERGED" | curl -sf -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: text/plain" --data-binary @- \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_ID/values/cfg:flags"
          echo "cfg:flags kini: enabled.social + flags.cfSocialEnabled = $MODE (kunci lain utuh)." >> "$GITHUB_STEP_SUMMARY"
