name: m025-27 COI WASM Safari matrix

on:
  push:
    branches:
      - master/perf67-m02527-coi-wasm-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari26:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          /usr/bin/safaridriver --version
          /usr/bin/arch

      - name: Create COOP COEP server and benchmark page
        shell: bash
        run: |
          set -euo pipefail
          cat > .m02527-server.py <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Cross-Origin-Opener-Policy','same-origin')
                  self.send_header('Cross-Origin-Embedder-Policy','require-corp')
                  self.send_header('Cross-Origin-Resource-Policy','same-origin')
                  self.send_header('Cache-Control','no-store')
                  super().end_headers()
          ThreadingHTTPServer(('127.0.0.1',8000),Handler).serve_forever()
          PY
          cat > .m02527-bench.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-27 COI WASM</title>
          <script src="./features/neural-voice/fiezel-kokoro-adapter.js"></script>
          <script type="module">
          const q=new URL(location.href).searchParams;
          const threads=Number(q.get('threads')||1);
          const proxy=q.get('proxy')==='1';
          const events=[]; window.__benchStatus='boot'; window.__benchResult=null;
          const finish=x=>{window.__benchResult=x;window.__benchStatus=x.success?'done':'error'};
          try{
            const mod=await import('./vendor/kokoro-js/kokoro.web.js?nv=m025-22');
            if(!mod.KokoroTTS||!mod.env||!mod.setVoiceDataUrl)throw new Error('kokoro facade exports missing');
            if(!globalThis.crossOriginIsolated)throw new Error('crossOriginIsolated=false');
            if(!mod.env.wasmEnv)throw new Error('wasmEnv unavailable');
            mod.env.wasmEnv.numThreads=threads;
            mod.env.wasmEnv.proxy=proxy;
            const runtime={navigator:{standalone:true,gpu:navigator.gpu||null},crossOriginIsolated:true,matchMedia(){return{matches:true}}};
            const adapter=FiezelKokoroAdapter.createKokoroAdapter({
              KokoroTTS:mod.KokoroTTS,kokoroEnv:mod.env,setVoiceDataUrl:mod.setVoiceDataUrl,
              modelId:'kokoro-model',localModelPath:'./vendor/',voiceBaseUrl:'./vendor/kokoro-model/voices',
              wasmBasePath:location.origin+'/vendor/kokoro-js/wasm/',runtimeOrigin:location.origin,runtime,
              dtype:'q8',device:'wasm',onStage:e=>events.push({t:Date.now(),...e})
            });
            window.__benchStatus='init'; const i0=performance.now(); await adapter.initialize(); const initMs=Math.round(performance.now()-i0);
            const text='The learner explains the main idea clearly and supports it with one example.';
            const times=[],samples=[];
            for(let n=0;n<2;n++){
              window.__benchStatus='generate-'+(n+1);const t0=performance.now();
              const out=await adapter.generate(text,{voice:'af_heart',speed:1}); times.push(Math.round(performance.now()-t0));
              samples.push(out?.audio?.length??out?.data?.length??null);
            }
            finish({success:true,threads,proxy,userAgent:navigator.userAgent,crossOriginIsolated:globalThis.crossOriginIsolated,
              sharedArrayBuffer:typeof SharedArrayBuffer==='function',initMs,times,samples,
              modelMs:events.filter(e=>e.phase==='adapter_model_resolved').map(e=>e.elapsedMs),
              generateMs:events.filter(e=>e.phase==='adapter_generate_resolved').map(e=>e.elapsedMs),
              policy:events.filter(e=>e.phase==='wasm_policy'),backend:adapter.getBackendState(),eventCount:events.length});
          }catch(error){finish({success:false,threads,proxy,status:window.__benchStatus,error:String(error?.stack||error),crossOriginIsolated:globalThis.crossOriginIsolated,events});}
          </script>
          HTML

      - name: Start isolated local server and SafariDriver
        shell: bash
        run: |
          set -euo pipefail
          python3 .m02527-server.py >/tmp/m02527-http.log 2>&1 &
          sudo /usr/bin/safaridriver --enable || /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver --port 4444 >/tmp/m02527-safaridriver.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4444/status >/tmp/m02527-status.json 2>/dev/null && break; sleep 1; done
          cat /tmp/m02527-status.json

      - name: Run isolated thread matrix in fresh Safari sessions
        shell: bash
        run: |
          set -euo pipefail
          run_one(){
            local threads="$1" proxy="$2" label="t${1}-p${2}" out="m02527-${label}.json"
            local sj sid resp result=''
            sj="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
            sid="$(echo "$sj"|jq -r '.value.sessionId // .sessionId // empty')"; test -n "$sid"
            curl -fsS -H 'Content-Type: application/json' -d "{\"url\":\"http://127.0.0.1:8000/.m02527-bench.html?threads=$threads&proxy=$proxy\"}" "http://127.0.0.1:4444/session/$sid/url" >/dev/null
            for i in {1..180}; do
              resp="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return {status:window.__benchStatus||null,result:window.__benchResult||null};","args":[]}' "http://127.0.0.1:4444/session/$sid/execute/sync" 2>/dev/null || true)"
              result="$(echo "$resp"|jq -c '.value.result // empty' 2>/dev/null || true)"
              [ -n "$result" ] && [ "$result" != null ] && break
              sleep 1
            done
            curl -sS -X DELETE "http://127.0.0.1:4444/session/$sid" >/dev/null || true
            if [ -z "$result" ]; then result="{\"success\":false,\"threads\":$threads,\"proxy\":$([ "$proxy" = 1 ] && echo true || echo false),\"error\":\"no_terminal_result\"}"; fi
            echo "$result"|jq .|tee "$out"
          }
          run_one 1 1
          run_one 2 1
          run_one 4 1
          run_one 4 0
          jq -s '[.[] | {threads,proxy,success,crossOriginIsolated,sharedArrayBuffer,initMs,modelMs,generateMs,samples}]' m02527-t*-p*.json | tee m02527-summary.json
          BEST="$(jq -s '[.[] | select(.success==true) | .modelMs[]?] | if length==0 then 999999 else min end' m02527-t*-p*.json)"
          echo "best_model_ms=$BEST"
          test "$BEST" -le 5000

      - name: Preserve COI matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02527-coi-wasm-safari26-${{ github.sha }}
          path: |
            m02527-t*-p*.json
            m02527-summary.json
            /tmp/m02527-http.log
            /tmp/m02527-safaridriver.log
            /tmp/m02527-status.json
          if-no-files-found: warn
          retention-days: 30
