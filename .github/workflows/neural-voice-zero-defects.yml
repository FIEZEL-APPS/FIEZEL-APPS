name: Neural Voice Zero Defects Repair

on:
  push:
    branches:
      - evidence/neural-voice-zero-defects

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run isolated repair harness v4
        shell: bash
        run: |
          cp tools/evidence/neural-voice-zero-defects-repair-v2.sh /tmp/neural-voice-zero-defects-repair-v2.sh
          cp tools/evidence/neural-voice-zero-defects-repair-v3.sh /tmp/neural-voice-zero-defects-repair-v3.sh
          cp tools/evidence/neural-voice-zero-defects-repair-v4.sh /tmp/neural-voice-zero-defects-repair-v4.sh
          cp tools/evidence/voice-audio-race-test.js /tmp/voice-audio-race-test.js
          cp tools/evidence/tutor-voice-chat-race-test.js /tmp/tutor-voice-chat-race-test.js
          bash /tmp/neural-voice-zero-defects-repair-v4.sh /tmp/neural-voice-zero-defects-repair-v3.sh /tmp/neural-voice-zero-defects-repair-v2.sh tools/evidence/listening-timeout-ownership-test.js
