# m025-176 deploy gateway `fiezel-api` (workers/api) ke Cloudflare.
#
# Kenapa berkas ini ada: sebelum ini fiezel-api adalah SATU-SATUNYA Worker tanpa jalur
# deploy di CI — audio dan core punya workflow-nya sendiri, gateway murid justru manual.
# Akibat nyatanya terasa saat migrasi identitas m025-176: `ALLOWED_ORIGINS` di
# `workers/api/wrangler.toml` sudah menunjuk origin Pages baru (fiezel-apps.github.io),
# tetapi Worker yang berjalan masih memegang nilai lama sampai seseorang deploy ulang
# dari laptop. Workflow ini menutup celah itu.
#
# Dijalankan manual dan idempoten: kode + vars selalu di-deploy ulang dari sumber repo.
# Rahasia TIDAK disentuh (semua lewat `wrangler secret put`, lihat catatan di
# workers/api/wrangler.toml). Migrasi D1 juga TIDAK dijalankan di sini — kontraknya
# eksplisit per berkas per database (lihat quality.yml gerbang d1-schema-contract).
name: FIEZEL API Worker Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiezel-api-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Gate aktor: pola yang sama dengan deploy-core-worker.yml, audio-deploy-worker.yml,
    # configure-core.yml — satu bentuk, satu login owner (FIEZEL-APPS, pasca-rename
    # m025-176). Pemeriksaan event_name ikut serta supaya penambahan pemicu otomatis di
    # masa depan gagal tertutup, bukan lolos diam-diam.
    if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker fiezel-api
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check index.js
          npx --yes wrangler@3 deploy

      - name: Ringkasan
        run: |
          echo "fiezel-api di-deploy ulang dari commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          echo "Vars (termasuk ALLOWED_ORIGINS) kini mengikuti workers/api/wrangler.toml di main." >> "$GITHUB_STEP_SUMMARY"
