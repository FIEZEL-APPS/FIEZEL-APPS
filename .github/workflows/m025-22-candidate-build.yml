name: m025-22 Source-Derived Proxy Candidate
on:
  push:
    branches:
      - master/perf39-real-wasm-proxy-m02522
    paths:
      - '.github/workflows/m025-22-candidate-build.yml'
      - 'NEURAL-VOICE-SOURCE-LOCK.json'
      - 'vendor/kokoro-js/source-overrides/fiezel-integration.patch'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify final runtime source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bootstrap=Path('features/neural-voice/fiezel-neural-voice-bootstrap.js').read_text()
          adapter=Path('features/neural-voice/fiezel-kokoro-adapter.js').read_text()
          required=[
            "vendor/kokoro-js/kokoro.web.js?nv=m025-22",
            "const wasmEnv=kokoro.env?.wasmEnv",
            "wasmEnv.proxy=true",
            "wasmEnv.numThreads=1",
            "readBack:true",
          ]
          for value in required:
            if value not in bootstrap:
              raise SystemExit(f'bootstrap final contract missing: {value}')
          if "kokoro.web.js?nv=m025-5" in bootstrap or "env?.backends?.onnx?.wasm" in bootstrap:
            raise SystemExit('bootstrap retains stale m025-5/fabricated WASM path')
          if "wasm: kokoroEnv?.wasmEnv || null" not in adapter:
            raise SystemExit('adapter is not bound to source-derived wasmEnv')
          PY
      - name: Rebuild pinned vendor and require byte-identical runtime closure
        run: bash tools/rebuild-neural-vendor.sh
      - name: Record candidate integrity
        shell: bash
        run: |
          sha256sum .vendor-repro/kokoro.web.js | tee .vendor-repro/kokoro.web.js.sha256
          wc -c < .vendor-repro/kokoro.web.js | tr -d ' ' | tee .vendor-repro/kokoro.web.js.size
          grep -F '91d849dc97a2e43edab1e576721792211bc240da4d086591d42b5356959dc32f' .vendor-repro/kokoro.web.js.sha256
          grep -Fx '2136728' .vendor-repro/kokoro.web.js.size
      - uses: actions/upload-artifact@v4
        with:
          name: m025-22-final-closure-${{ github.sha }}
          path: .vendor-repro/
          include-hidden-files: true
          retention-days: 3
      - name: Verify actual rebuilt bundle exposes real WASM env in browser runtime
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome" ]]; then
            echo 'BROWSER_AUDIT_ERROR: no Chrome/Chromium runtime available on runner'
            exit 19
          fi
          cat > .vendor-repro/probe.html <<'HTML'
          <!doctype html><html><body>WAIT<script type="module">
          try {
            const mod=await import('./kokoro.web.js');
            const env=mod.env;
            const descriptor=Object.getOwnPropertyDescriptor(env || {}, 'wasmEnv');
            if(!descriptor || typeof descriptor.get !== 'function') throw new Error('wasmEnv getter missing');
            const wasm=env.wasmEnv;
            if(!wasm || typeof wasm !== 'object') throw new Error('wasmEnv object missing');
            if(!('proxy' in wasm)) throw new Error('proxy control missing');
            if(!Object.isExtensible(wasm) && !('numThreads' in wasm)) throw new Error('numThreads cannot be assigned');
            wasm.proxy=true;
            wasm.numThreads=1;
            if(wasm.proxy!==true || Number(wasm.numThreads)!==1) throw new Error('WASM env readback failed');
            document.body.textContent='M02522_BROWSER_WASM_ENV_PASS proxy='+wasm.proxy+' numThreads='+wasm.numThreads;
          } catch (error) {
            document.body.textContent='M02522_BROWSER_WASM_ENV_FAIL '+(error?.name||'')+' '+(error?.message||String(error));
          }
          </script></body></html>
          HTML
          python -m http.server 8765 --bind 127.0.0.1 --directory .vendor-repro >/tmp/m02522-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/probe.html >/dev/null && break; sleep .25; done
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/probe.html > /tmp/m02522-dom.txt 2>/tmp/m02522-chrome.err || {
            cat /tmp/m02522-chrome.err
            exit 20
          }
          cat /tmp/m02522-dom.txt
          grep -F 'M02522_BROWSER_WASM_ENV_PASS proxy=true numThreads=1' /tmp/m02522-dom.txt
