name: m025-22 Source-Derived Proxy Candidate
on:
  push:
    branches:
      - master/perf39-real-wasm-proxy-m02522
    paths:
      - '.github/workflows/m025-22-candidate-build.yml'
      - 'NEURAL-VOICE-SOURCE-LOCK.json'
      - 'vendor/kokoro-js/source-overrides/fiezel-integration.patch'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch candidate runtime sources without touching branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap=Path('features/neural-voice/fiezel-neural-voice-bootstrap.js')
          text=bootstrap.read_text()
          replacements={
            "vendor/kokoro-js/kokoro.web.js?nv=m025-5":"vendor/kokoro-js/kokoro.web.js?nv=m025-22",
            "const wasmEnv=kokoro.env?.backends?.onnx?.wasm;":"const wasmEnv=kokoro.env?.wasmEnv;",
            "if(appleStandalone)wasmEnv.proxy=false;":"if(appleStandalone)wasmEnv.proxy=true;",
            "apple-standalone-single-thread-direct":"apple-standalone-single-thread-proxy-worker",
          }
          for old,new in replacements.items():
            if new in text:
              continue
            if old not in text:
              raise SystemExit(f'bootstrap replacement source missing: {old}')
            text=text.replace(old,new)
          bootstrap.write_text(text)

          adapter=Path('features/neural-voice/fiezel-kokoro-adapter.js')
          text=adapter.read_text()
          old="wasm: kokoroEnv?.backends?.onnx?.wasm || null"
          new="wasm: kokoroEnv?.wasmEnv || null"
          if new not in text:
            if old not in text:
              raise SystemExit('adapter WASM binding source missing')
            text=text.replace(old,new)
          if "readBack: !!wasm" not in text:
            text=text.replace("readBack: false", "readBack: !!wasm")
          adapter.write_text(text)
          PY
      - name: Build pinned vendor candidate clean-room
        shell: bash
        run: |
          set +e
          bash tools/rebuild-neural-vendor.sh
          rc=$?
          set -e
          test -f .vendor-repro/kokoro.web.js
          echo "rebuild_exit=$rc"
          # Runtime lock still points to released bytes at candidate stage.
          # A nonzero final byte comparison is expected; earlier source/build errors
          # are distinguished because they do not leave the candidate bundle.
          test "$rc" -ne 0
      - name: Record candidate integrity
        shell: bash
        run: |
          sha256sum .vendor-repro/kokoro.web.js | tee .vendor-repro/kokoro.web.js.sha256
          wc -c < .vendor-repro/kokoro.web.js | tr -d ' ' | tee .vendor-repro/kokoro.web.js.size
          cp features/neural-voice/fiezel-neural-voice-bootstrap.js .vendor-repro/fiezel-neural-voice-bootstrap.js
          cp features/neural-voice/fiezel-kokoro-adapter.js .vendor-repro/fiezel-kokoro-adapter.js
      - uses: actions/upload-artifact@v4
        with:
          name: m025-22-proxy-candidate-${{ github.sha }}
          path: .vendor-repro/
          include-hidden-files: true
          retention-days: 3
      - name: Verify actual candidate bundle exposes real WASM env in browser runtime
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome" ]]; then
            echo 'BROWSER_AUDIT_ERROR: no Chrome/Chromium runtime available on runner'
            exit 19
          fi
          cat > .vendor-repro/probe.html <<'HTML'
          <!doctype html><html><body>WAIT<script type="module">
          try {
            const mod=await import('./kokoro.web.js');
            const env=mod.env;
            const descriptor=Object.getOwnPropertyDescriptor(env || {}, 'wasmEnv');
            if(!descriptor || typeof descriptor.get !== 'function') throw new Error('wasmEnv getter missing');
            const wasm=env.wasmEnv;
            if(!wasm || typeof wasm !== 'object') throw new Error('wasmEnv object missing');
            if(!('proxy' in wasm)) throw new Error('proxy control missing');
            if(!('numThreads' in wasm)) throw new Error('numThreads control missing');
            wasm.proxy=true;
            wasm.numThreads=1;
            if(wasm.proxy!==true || Number(wasm.numThreads)!==1) throw new Error('WASM env readback failed');
            document.body.textContent='M02522_BROWSER_WASM_ENV_PASS proxy='+wasm.proxy+' numThreads='+wasm.numThreads;
          } catch (error) {
            document.body.textContent='M02522_BROWSER_WASM_ENV_FAIL '+(error?.name||'')+' '+(error?.message||String(error));
          }
          </script></body></html>
          HTML
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/m02522-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/probe.html >/dev/null && break; sleep .25; done
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/probe.html > /tmp/m02522-dom.txt 2>/tmp/m02522-chrome.err || {
            cat /tmp/m02522-chrome.err
            exit 20
          }
          cat /tmp/m02522-dom.txt
          grep -F 'M02522_BROWSER_WASM_ENV_PASS proxy=true numThreads=1' /tmp/m02522-dom.txt
