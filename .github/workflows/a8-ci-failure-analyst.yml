name: FIEZEL A8 CI Failure Analyst

on:
  workflow_run:
    workflows:
      - FIEZEL Quality Gate
      - FIEZEL A6 A7 Automated Verifiers
      - FIEZEL Neural Vendor Repro
      - MASTER Authority Guard
      - m025-26 product neural Safari proof
      - m025-47 Neural Library Safari gate
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: a8-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  a8-ci-failure-analyst:
    name: A8 CI Failure Analyst
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    # Batas keras: tanpa ini GitHub memakai 360 menit, dan satu langkah
    # yang menggantung membakar enam jam dalam diam (lihat
    # tests/workflow-timeout-gate-test.js).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve PR and capture failed-job evidence
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$pr_number" && -n "$HEAD_BRANCH" ]]; then
            pr_number="$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/a8-failed.log 2>&1 || true
          gh run view "$RUN_ID" --repo "$REPO" --json name,conclusion,headSha,url,jobs > /tmp/a8-run.json 2>/dev/null || true

      - name: Classify failure signals
        env:
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/fiezel-guardians.mjs a8 \
            --log=/tmp/a8-failed.log \
            --workflow="$FAILED_WORKFLOW" \
            --url="$FAILED_RUN_URL" > /tmp/a8-report.md
          cat /tmp/a8-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert A8 failure analysis on PR
        if: steps.collect.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.collect.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- FIEZEL_A8_CI_FAILURE_ANALYST -->';
            const body = fs.readFileSync('/tmp/a8-report.md', 'utf8');
            const issue_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
