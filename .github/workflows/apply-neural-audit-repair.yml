name: Apply audited neural voice repair

on:
  push:
    branches:
      - agent/neural-voice-final-20260815
    paths:
      - .github/workflows/apply-neural-audit-repair.yml

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/neural-voice-final-20260815

      - name: Reconstruct authoritative audit patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fiezel-repair
          for n in 00 01 02 03 04 05; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/fitrajft-ux/fiezel-neural-voice-audit-2026-08-15/main/repair/parts/repair.patch.gz.part${n}" \
              --output "/tmp/fiezel-repair/repair.patch.gz.part${n}"
          done
          cat /tmp/fiezel-repair/repair.patch.gz.part* > /tmp/fiezel-repair/repair.patch.gz
          echo "ca1a1ba775cff188c74a6f1b11ad89263a4e8fc50ef64b4f728ad38ff1b6f870  /tmp/fiezel-repair/repair.patch.gz" | sha256sum -c -
          gzip -dc /tmp/fiezel-repair/repair.patch.gz > /tmp/fiezel-repair/repair.patch
          echo "3e524cfa37fa6ded34413d03ec1bef0e071c1ac4aef4da36d08cdb30baf0f76e  /tmp/fiezel-repair/repair.patch" | sha256sum -c -
          sed -n 's#^diff --git a/\([^ ]*\) b/.*#\1#p' /tmp/fiezel-repair/repair.patch | sort -u > /tmp/fiezel-repair/patch-files.txt
          test -s /tmp/fiezel-repair/patch-files.txt
          echo 'Authoritative patch files:'
          cat /tmp/fiezel-repair/patch-files.txt

      - name: Apply patch and resolve only known conflicts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git apply --3way /tmp/fiezel-repair/repair.patch
          apply_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected_conflicts="$(printf '%s\n' \
            '.github/workflows/quality.yml' \
            'features/neural-voice/fiezel-neural-voice-bootstrap.js' \
            'features/neural-voice/fiezel-neural-voice-ios-cache-fix.js' \
            'sw.js' | sort)"

          if [ "$apply_rc" -ne 0 ]; then
            if [ "$conflicts" != "$expected_conflicts" ]; then
              echo 'Unexpected three-way conflicts; refusing automatic resolution.'
              printf 'Expected:\n%s\nActual:\n%s\n' "$expected_conflicts" "$conflicts"
              exit 1
            fi
            git checkout --theirs -- \
              .github/workflows/quality.yml \
              features/neural-voice/fiezel-neural-voice-bootstrap.js \
              features/neural-voice/fiezel-neural-voice-ios-cache-fix.js \
              sw.js
            git add -- \
              .github/workflows/quality.yml \
              features/neural-voice/fiezel-neural-voice-bootstrap.js \
              features/neural-voice/fiezel-neural-voice-ios-cache-fix.js \
              sw.js
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unmerged paths remain; refusing commit.'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git reset

      - name: Verify scope equals authoritative patch
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u > /tmp/fiezel-repair/actual-files.txt
          grep -v '^\.github/workflows/apply-neural-audit-repair\.yml$' /tmp/fiezel-repair/actual-files.txt > /tmp/fiezel-repair/actual-repair-files.txt || true
          echo 'Actual repair files:'
          cat /tmp/fiezel-repair/actual-repair-files.txt
          unexpected="$(comm -23 /tmp/fiezel-repair/actual-repair-files.txt /tmp/fiezel-repair/patch-files.txt || true)"
          if [ -n "$unexpected" ]; then
            echo 'Changes outside authoritative patch detected:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          missing="$(comm -23 /tmp/fiezel-repair/patch-files.txt /tmp/fiezel-repair/actual-repair-files.txt || true)"
          if [ -n "$missing" ]; then
            echo 'Patch paths with no resulting diff (allowed only when repository already matches):'
            printf '%s\n' "$missing"
          fi
          git diff --exit-code HEAD -- version.js VERSION.json

      - name: Validate mandatory gates
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do node --check "$f"; done
          for f in features/neural-voice/*.js; do node --check "$f"; done
          if grep -rn '^\s*}){' features/ *.js; then
            echo 'broken-pattern gate failed'
            exit 1
          fi
          node neural-voice-fix-test.js
          if [ -f neural-voice-selector-test.js ]; then node neural-voice-selector-test.js; fi
          if [ -f neural-voice-product-repair-test.js ]; then node neural-voice-product-repair-test.js; fi
          node neural-voice-audibility-test.js
          node neural-voice-test.js
          node ios-cache-compat-test.js
          node sw-corp-test.js
          if [ -f diag-panel-test.js ]; then node diag-panel-test.js; fi
          python3 release-audit.py

      - name: Commit authoritative repair to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file=/tmp/fiezel-repair/patch-files.txt
          staged="$(git diff --cached --name-only | sort -u)"
          unexpected="$(comm -23 <(printf '%s\n' "$staged") /tmp/fiezel-repair/patch-files.txt || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected staged paths; refusing commit:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --cached --quiet && { echo 'No repair changes to commit'; exit 0; }
          git commit -m "Apply final audited neural voice repair"
          git push origin HEAD:agent/neural-voice-final-20260815
