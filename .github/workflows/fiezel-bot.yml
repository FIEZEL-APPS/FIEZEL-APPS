name: FIEZEL Bot (Autonomous AI Reviewer & Auto-Fix)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - FIEZEL Quality Gate
      - FIEZEL A6 A7 Automated Verifiers
      - FIEZEL A9 A14 Autonomous Guardians
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Nomor PR yang ingin diproses'
        required: true
      command:
        description: 'Perintah bot (review / fix / heal / bump / explain)'
        required: true
        default: 'review'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: fiezel-bot-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  # 1. Otomatis Review Setiap PR Dibuka atau Diperbarui (Zero Manual Command)
  auto-pr-review:
    name: Auto PR Review & Invariant Audit
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@fiezel-bot') && !contains(github.event.comment.body, 'heal') && !contains(github.event.comment.body, 'fix'))
    steps:
      - name: Resolve PR info
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_num="${{ github.event.pull_request.number }}"
            head_branch="${{ github.event.pull_request.head.ref }}"
          else
            pr_num="${{ github.event.issue.number }}"
            head_branch="$(gh pr view "$pr_num" --repo "$REPO" --json headRefName -q .headRefName)"
          fi
          echo "pr_number=$pr_num" >> "$GITHUB_OUTPUT"
          echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.head_branch }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate AI Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.meta.outputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fiezel-bot
          node tools/fiezel-bot.mjs review --pr="$PR_NUM" > /tmp/fiezel-bot/raw.log 2>&1 || true
          sed -n '/<!-- FIEZEL_BOT_REVIEW -->/,$p' /tmp/fiezel-bot/raw.log > /tmp/fiezel-bot/review.md || cp /tmp/fiezel-bot/raw.log /tmp/fiezel-bot/review.md

      - name: Upsert review comment on PR (No Spam, Single Living Comment)
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/fiezel-bot/review.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8').trim();
            if (!body) return;

            const marker = '<!-- FIEZEL_BOT_REVIEW -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # 2. Otomatis Sembuhkan CI Ketika Gagal (Self-Healing Loop)
  auto-ci-heal:
    name: Auto CI Self-Healing & Fix
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@fiezel-bot heal'))
    steps:
      - name: Resolve Failed PR and Evidence
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fiezel-bot
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            head_branch="${{ github.event.workflow_run.head_branch }}"
            pr_num="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
            if [[ -z "$pr_num" && -n "$head_branch" ]]; then
              pr_num="$(gh pr list --repo "$REPO" --head "$head_branch" --state open --json number --jq '.[0].number // empty')"
            fi
            gh run view "$run_id" --repo "$REPO" --log-failed > /tmp/fiezel-bot/failed.log 2>&1 || true
          else
            pr_num="${{ github.event.issue.number }}"
            head_branch="$(gh pr view "$pr_num" --repo "$REPO" --json headRefName -q .headRefName)"
            # Ambil log kegagalan run terakhir di branch ini
            latest_run="$(gh run list --repo "$REPO" --branch "$head_branch" --status failure --limit 1 --json databaseId -q '.[0].databaseId // empty')"
            if [[ -n "$latest_run" ]]; then
              gh run view "$latest_run" --repo "$REPO" --log-failed > /tmp/fiezel-bot/failed.log 2>&1 || true
            fi
          fi

          echo "pr_number=$pr_num" >> "$GITHUB_OUTPUT"
          echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Branch
        if: steps.collect.outputs.pr_number != '' && steps.collect.outputs.head_branch != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.collect.outputs.head_branch }}
          fetch-depth: 0

      - name: Setup Node.js 22
        if: steps.collect.outputs.pr_number != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose and Auto-Apply Fix
        id: heal
        if: steps.collect.outputs.pr_number != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.collect.outputs.pr_number }}
        run: |
          set -euo pipefail
          node tools/fiezel-bot.mjs heal --pr="$PR_NUM" --log=/tmp/fiezel-bot/failed.log > /tmp/fiezel-bot/heal.log 2>&1 || true
          cat /tmp/fiezel-bot/heal.log

      - name: Commit and Push Self-Heal Fix
        if: steps.collect.outputs.pr_number != '' && steps.collect.outputs.head_branch != ''
        env:
          HEAD_BRANCH: ${{ steps.collect.outputs.head_branch }}
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "Fiezel Bot"
            git config user.email "bot@fiezel.my.id"
            git add -A
            git commit -m "bot(heal): auto-healing CI failure by Fiezel Bot"
            git push origin "HEAD:${HEAD_BRANCH}"
            echo "patched=true" >> "$GITHUB_OUTPUT"
          else
            echo "patched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post CI Heal Report on PR
        if: steps.collect.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.collect.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const logPath = '/tmp/fiezel-bot/heal.log';
            const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8').trim() : 'Auto-heal selesai dijalankan.';

            const marker = '<!-- FIEZEL_BOT_AUTO_HEAL -->';
            const body = `${marker}\n` +
              `## 🤖 Fiezel Bot CI Self-Healing\n\n` +
              `Fiezel Bot mendeteksi adanya kegagalan verifikasi CI pada branch ini dan telah melakukan penanganan otomatis.\n\n` +
              `<details><summary>Catatan Diagnosis & Tindakan</summary>\n\n` +
              `\`\`\`text\n` +
              `\${log.slice(0, 4000)}\n` +
              `\`\`\`\n\n` +
              `</details>\n\n` +
              `*CI akan berjalan ulang secara otomatis untuk memvalidasi perbaikan ini.*`;

            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
