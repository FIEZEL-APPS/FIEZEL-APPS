          # sama dari sisi PERSETUJUAN: gestur tangkap laporan tetap terisolasi, laporan otomatis
          # tidak pernah interaktif, laporan sesi/harian tetap tertunda (bukan hilang) tanpa auth,
          # dan persetujuan eksplisit tidak pernah dilangkahi.
          node app-report-control-path-test.js
          node core-brain-test.js
          node core-brain-v2-test.js
          node tutor-brain-v3-test.js
          node misconception-diagnosis-test.js
          node tutor-reteach-card-test.js
          node fiezel-autonomy-config-test.js
          node fiezel-prompt-library-test.js
          node fiezel-meta-learning-test.js
          node fiezel-evolution-ledger-test.js
          node fiezel-self-refine-test.js
          # Gerbang brain-learning-infra (PR #226) + gerbang i18n yang belum terdaftar
          # (dituntut gate-registry-test: terdaftar atau dikecualikan beralasan).
          node fiezel-stat-gate-test.js
          node brain-manifest-test.js
          node brain-config-test.js
          node learning-metrics-test.js
          node metrics-digest-test.js
          node learning-telemetry-test.js
          node learning-lane-test.js
          node braincore-evidence-test.js
          node braincore-learner-identity-test.js
          node app-telemetry-wiring-test.js
          node analytics-dedup-test.js
          node analytics-stable-id-guard-test.js
          node adaptivity-simulation-v3-hardened-test.js
          node audio-locale-guard-test.js
          node id-golden-snapshot-test.js
          node locale-enum-test.js
          node social-api-contract-test.js
          node social-frontend-test.js
          node social-schema-contract-test.js
          node fiezel-evolution-loop-test.js
          node core-worker-contract-test.js
          # m025-201: dua gerbang penutup lima celah Core Brain (audit m025-201).
          # core-policy-parity-test.js mengadu kebijakan app.js dengan kebijakan Worker atas
          # matriks skenario yang sama - dua salinan yang seharusnya identik dan selama ini
          # tidak pernah dibandingkan, sehingga setiap perbaikan yang mendarat di satu sisi
          # saja lolos tanpa terlihat. Ia juga menuntut tidak ada rute Worker yang memakai
          # kebijakan MENTAH (celah pelatih AI), bahwa highRiskCount/todayAttempts benar-benar
          # mengubah keluaran, bahwa pemotong kode rasional berprioritas (alasan otak berhenti
          # dibuang sebelum sampai ke layar), dan bahwa tren efektivitas dihitung atas sepuluh
          # hasil - masing-masing dengan bukti-bisa-merah terhadap sumber yang sengaja dirusak.
          # Diletakkan tepat sesudah core-worker-contract-test.js karena keduanya memuat Worker
          # yang sama di dalam vm: yang di atas menjaga KONTRAK rutenya, yang ini menjaga
          # KEBIJAKAN yang mengalir lewat rute itu.
          node core-policy-parity-test.js
          # brain-page-wiring-test.js menutup lubang yang brain-manifest-test.js tidak jangkau:
          # manifest mengadu dirinya dengan isi direktori, tetapi NOL gerbang mengadunya dengan
          # index.html/sw.js. Modul yang dinyatakan berwenang tetapi tidak pernah dimuat halaman
