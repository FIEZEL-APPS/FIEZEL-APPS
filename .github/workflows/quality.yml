name: FIEZEL Quality Gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned push dependency
        run: npm install --ignore-scripts
      - name: Syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0)
      # Bab 32 mewajibkan audit rilis lulus sebelum rilis, tetapi sampai commit ini tidak ada
      # satu pun workflow yang menjalankannya (temuan K13, reports/cf-c1-konsistensi.md) — satu
      # setup-python terpasang di atas tanpa ada yang memakai Python. Step ini dibuat berdiri
      # sendiri, bukan disisipkan ke blok `Core validation`, karena tiga alasan: ia bukan node
      # dan butuh toolchain berbeda, ia berjalan menit (bukan detik) sehingga durasinya perlu
      # terlihat sendiri di UI Actions, dan kegagalannya harus punya lampu merah sendiri alih-alih
      # tenggelam di antara ~100 baris `node ...`. Ia sengaja diletakkan SEBELUM Core validation
      # agar gagal cepat, dan agar `release-audit-gate-test.js` di bawah bisa memakai ulang
      # FINAL-AUDIT-REPORT.json yang baru saja ditulisnya.
      - name: Release audit (Python)
        run: python3 release-audit.py
      - name: Core validation
        env:
          # Memberi izin kepada release-audit-gate-test.js untuk memakai ulang laporan dari step
          # di atas alih-alih menjalankan audit menit-menitan dua kali. Gerbang itu TIDAK percaya
          # pada flag ini sendirian: ia memverifikasi sha256 app.js + version di dalam laporan
          # cocok dengan berkas kerja saat ini, dan menjalankan auditnya sendiri kalau tidak.
          FIEZEL_RELEASE_AUDIT_REPORT_FRESH: '1'
        run: |
          node validator.js
          node regression-test.js
          node content-audit.js
          node content-qa-agent.js
          node content-qa-agent-test.js
          node content-patch-gate-test.js
          node content-canary-test.js
          node content-promotion-test.js
          node content-adoption-evidence-test.js
          node content-evidence-origin-test.js
          node content-adoption-rehearsal-test.js
          node content-adoption-test.js
          node content-adoption-receipt-test.js
          node continuity-test.js
          node backup-ui-test.js
          node install-health-test.js
          node onboarding-test.js
          node tour-test.js
          node tours-test.js
          node boot-order-test.js
          node splash-first-paint-test.js
          node splash-choreography-test.js
          node observability-privacy-test.js
          node analytics-privacy-test.js
          node analytics-aggregate-test.js
          node analytics-server-only-test.js
          node a11y-test.js
          node contrast-test.js
          node pastel-field-contrast-test.js
          node topbar-logo-contrast-test.js
          node paw-mascot-test.js
          node voice-offline-fallback-test.js
          node voice-fallback-chain-test.js
          node voice-pipeline-gap-test.js
          node voice-prefetch-neural-test.js
          node voice-callsite-prefetch-test.js
          node tts-transport-switch-test.js
          node audio-asset-pipeline-test.js
          node product-audit.js
          node runtime-stage8-test.js
          node ai-integration-test.js
          node experience-integration-test.js
          node lesson-experience-test.js
          node ui-structure-test.js
          node settings-cache-test.js
          node gems-test.js
          node back-nav-test.js
          node grammar-quality-audit.js
          node content-integrity-audit.js
          node content-integrity-gate-test.js
          node grammar-memory-scope-test.js
          node grammar-curriculum-test.js
          node level-grammar-contract-test.js
          node grammar-unlock-test.js
          node placement-accuracy-test.js
          node level-guard-test.js
          node writing-rubric-test.js
          node reading-exam-test.js
          node level-evidence-test.js
          node neural-cache-isolation-test.js
          node prerequisite-graph-test.js
          node speaking-exam-test.js
          node listening-exam-test.js
          node e2e-level-grammar-test.js
          node notification-reminder-test.js
          node remote-push-test.js
          node core-brain-test.js
          node core-brain-v2-test.js
          node tutor-brain-v3-test.js
          node misconception-diagnosis-test.js
          node tutor-reteach-card-test.js
          node fiezel-autonomy-config-test.js
          node fiezel-prompt-library-test.js
          node fiezel-meta-learning-test.js
          node fiezel-evolution-ledger-test.js
          node fiezel-self-refine-test.js
          node fiezel-evolution-loop-test.js
          node core-worker-contract-test.js
          node learner-evidence-test.js
          node alrs-behavior-test.js
          node adaptive-policy-test.js
          node policy-outcome-test.js
          node personal-journey-test.js
          node personal-journey-ui-test.js
          node skills-evidence-test.js
          node skills-dashboard-test.js
          node academic-readiness-test.js
          node library-integrity-test.js
          node pwa-cache-test.js
          node pwa-release-coherence-test.js
          node pwa-startup-white-screen-recovery-test.js
          node http-smoke-test.js
          node speaking-listening-test.js
          node check-listening-similarity.js
          node search-feedback-test.js
          node diag-panel-test.js
          node diag-search-test.js
          node sw-corp-test.js
          node classroom-test.js
          node diagnostic-scanner-test.js
          node reminder-struggle-test.js
          node prosody-test.js
          node voice-chunker-test.js
          node tutor-classroom-regression-test.js
          node m02542-experience-test.js
          node neural-voice-m02592-puter-subtitle-test.js
          node neural-voice-m02593-subtitle-translate-test.js
          node puter-auth-coop-test.js
          node puter-auth-diagnostics-test.js
          node puter-popup-once-test.js
          node cf-api-contract-test.js
          node cf-wiring-test.js
          # E9: penjaga jembatan edge. Dijalankan tepat sesudah dua gerbang kontrak Worker
          # karena ia menguji berkas yang sama (`workers/api/index.js`, `route-health.js`) dari
          # sisi ketiga: siapa yang BOLEH memanggil Worker sama sekali. Selama zona
          # `fiezel.my.id` belum di Cloudflare, `api.fiezel.my.id` adalah proxy PHP di origin
          # dan alamat `*.workers.dev` tetap publik — gerbang ini yang menjaga header bersama
          # `X-Fiezel-Edge` benar-benar ditegakkan (waktu-konstan), bahwa `/healthz` tidak
          # membocorkan `capabilities`, dan bahwa `deploy/edge/api-index.php` tidak pernah
          # memuat nilai secret sungguhan.
          node edge-guard-test.js
          # S7: pemantauan produksi. DUA langkah, dan pembagiannya sengaja:
          # `health-probe-test.js` adalah gerbangnya (ia yang membuktikan probe menilai
          # `workers.dev` 200 sebagai KRITIS — bukan OK — dan bahwa exit code hanya merah
          # untuk kegagalan kritis), sedangkan baris di bawahnya menjalankan self-test probe
          # itu sendiri terhadap server loopback. TIDAK ADA pemanggilan probe tanpa
          # `--selftest` di CI: mode produksi menembak api.fiezel.my.id sungguhan, dan
          # CI publik yang menembak produksi pada setiap push adalah beban yang kita
          # timpakan ke murid, bukan pengujian. Gerbangnya meng-assert larangan itu.
          node health-probe-test.js
          node tools/fiezel-health-probe.mjs --selftest
          # A3: kontrak Cron Trigger. Dijalankan tepat sesudah gerbang wiring/edge
          # karena ia mengeksekusi Worker yang sama lewat jalur `scheduled()` dan
          # bukan `fetch()` — sisi yang tidak pernah disentuh gerbang lain. Ia
          # membuktikan: satu ekspresi cron = satu job, rollup dua kali tidak
          # menurunkan angka, pepper lama benar-benar dihapus, `cron_run` mencatat
          # sukses DAN gagal tanpa pesan galat mentah, `dau_dedup` kosong +
          # `usage_daily` terisi = `collection_ok=0`, dan `/api/owner/cron-status`
          # 403 tanpa kredensial owner. Butuh tools/cf-test-harness.js.
          node cron-contract-test.js
          # A7: kontrak proxy PHP jembatan. Dijalankan TEPAT SESUDAH edge-guard-test.js
          # karena keduanya menjaga jembatan yang sama dari dua sisi: yang di atas menjaga
          # sisi WORKER (siapa yang boleh memanggil, /healthz minimal, nol nilai secret di
          # artefak), yang ini menjaga sisi PROXY (allowlist 13 jalur tetap default-tolak,
          # X-Fiezel-Edge tetap dikirim, nol cache pada jalur identitas/kuota/Set-Cookie,
          # IP mentah tidak diteruskan, galat curl mentah tidak pernah sampai ke murid,
          # FOLLOWLOCATION tetap false, dan setiap sakelar transport baru punya komentar
          # alasan). Ia memindai berkas PHP sebagai TEKS — tidak ada PHP di runner ini, dan
          # memasangnya demi satu berkas bukan pertukaran yang sehat; batas itu ditulis di
          # kepala gerbangnya, bukan disembunyikan.
          node edge-proxy-contract-test.js
          node quota-core-test.js
          node quota-manipulation-test.js
          node quota-reset-test.js
          node tts-key-test.js
          node ai-task-contract-test.js
          # V4: gerbang bentuk jawaban Workers AI + kontrak mutu keluaran. Dijalankan tepat
          # sesudah gerbang kontrak task karena keduanya menguji berkas yang sama dari dua sisi:
          # yang di atas menjaga bentuk PERMINTAAN (klien tidak mengirim prompt), yang ini menjaga
          # bentuk JAWABAN (dua bentuk terbaca, kosong = gagal, reasoning tidak pernah tampil,
          # batas kalimat dan kanon kata ditegakkan). Ia butuh tools/cf-test-harness.js yang sudah
          # dijalankan sebagai self-test di bawah.
          node ai-response-shape-test.js
          node breaker-test.js
          node prerender-dryrun-test.js
          # A1: gerbang aritmetika pra-render. Dijalankan tepat sesudah gerbang dry-run karena
          # keduanya menguji tools/prerender-tts.mjs dari dua sisi: yang di atas menjaga BENTUK
          # (dry-run kering, workflow bergate, manifest terpisah), yang ini menjaga ANGKA (korpus
          # 604.962 karakter, 5.657 objek/286.851 karakter sesudah dedup, harga aura-1 vs
          # aura-2-en, daftar frasa berisiko "On balance", override model per-item).
          node prerender-plan-test.js
          node owner-dashboard-test.js
          # S4: gerbang jembatan `owner.fiezel.my.id`. Ditempatkan TEPAT sesudah
          # `owner-dashboard-test.js` karena keduanya menguji `workers/owner/index.js`, tetapi
          # dari dua sisi berbeda: yang di atas menjaga siapa yang boleh MELIHAT angka (sesi
          # owner), yang ini menjaga siapa yang boleh MEMANGGIL Worker sama sekali (header
          # jembatan `X-Fiezel-Edge`) — dan bahwa dua lapis itu tidak saling menggantikan.
          # Ia juga membuktikan header keamanan HTML (CSP ketat, noindex) tidak hilang di
          # perjalanan lewat daftar pass-through `deploy/edge/owner-index.php`, dan bahwa
          # berkas PHP itu tidak pernah memuat nilai secret sungguhan.
          node owner-edge-guard-test.js
          node tools/cf-test-harness.js
          node no-network-test.js
          # `cf-live-selftest.js` membuktikan gerbang live di bawah ini bisa MERAH:
          # ia menjalankannya terhadap server HTTP loopback yang meniru jawaban
          # benar dan 20 variasi jawaban salah. Loopback murni (127.0.0.1, port 0),
          # tanpa DNS, tanpa keluar mesin — karena itu ia terdaftar di
          # SOCKET_ALLOWLIST `no-network-test.js` dan dijalankan SESUDAHNYA.
          node cf-live-selftest.js
          # SKIP sampai owner menyetel base URL Worker. Tanpa FIEZEL_CF_LIVE_BASE
          # langkah ini mencetak alasan jujur lalu exit 0 — ia TIDAK memerahkan CI
          # karena lingkungannya belum siap, dan ia TIDAK mengaku PASS (statusnya
          # SKIP, `pass:null`). Untuk menjalankannya sungguhan, setel repository
          # variable/secret FIEZEL_CF_LIVE_BASE ke https://api.fiezel.my.id (atau
          # alamat *.workers.dev sementara) dan teruskan lewat `env:` pada step ini.
          # Petunjuk lengkap: tools/cf-live-runner.md.
          node cf-live-contract-test.js
          node release-audit-gate-test.js
          node cf-transport-test.js
          node cf-shadow-mode-test.js
          # Kill switch server (`GET /api/config`): penggabungan AND (server hanya bisa
          # mematikan), protokol 1.7 wajib cocok, cermin maks 5 menit di sessionStorage,
          # dan boot tidak diblokir. Dijalankan sesudah dua gerbang di atas karena ia
          # menjalankan blok kill switch DAN blok transport bersama-sama.
          node cf-config-killswitch-test.js
          # Konsistensi konfigurasi lintas berkas: bentuk KV di runbook (§4.5-4.7) harus
          # benar-benar bisa dibaca route-config.js, dan angka batas di wrangler [vars]
          # (yang dikirim ke NASKAH murid) harus sama dengan angka yang DITEGAKKAN di
          # quota/quota-config.js. Ditempatkan tepat sesudah gerbang kill switch karena
          # keduanya menjaga sakelar yang sama dari dua sisi: perilaku kode vs perintah
          # yang benar-benar diketik owner saat insiden.
          node config-consistency-test.js
          node cf-shadow-ledger-test.js
          node workflow-actor-gate-test.js
