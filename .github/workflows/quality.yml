name: FIEZEL Quality Gate

# ==========================================================================
# KENAPA `push` DIBATASI KE `main`, DAN KENAPA ADA `concurrency`
# ==========================================================================
# Sebelum ini triggernya `push:` (semua branch) + `pull_request:` tanpa filter
# dan tanpa concurrency group. Akibatnya SETIAP push ke branch ber-PR memicu
# gerbang ~25 menit ini DUA KALI, paralel, atas commit yang sama persis — satu
# dari `push`, satu dari `pull_request`. Itu bukan dugaan: pada PR #333 head
# d15cb71e tercatat dua job `quality` hidup bersamaan (run 33771881451 dan
# 33771878031), dan pada head sebelumnya satu job berjalan 12:41 -> 14:48
# (2 jam 7 menit) sebelum dibatalkan, padahal run sehat selesai 22-24 menit.
# Dua salinan suite yang sama berebut runner membuat keduanya melambat, dan
# yang kalah berakhir sebagai check `cancelled` — merah palsu yang menghabiskan
# waktu review untuk menelusuri kegagalan yang tidak pernah ada.
#
# Perbaikannya dua lapis, dan keduanya perlu:
#
#   1. `push: branches: [main]` — di branch fitur, `pull_request` sudah
#      meliput setiap commit. Membiarkan `push` ikut jalan di sana tidak
#      menambah satu pun pemeriksaan, hanya menggandakannya. Push ke `main`
#      TETAP diperiksa: itu satu-satunya tempat commit bisa mendarat tanpa
#      melewati PR (merge commit, dan perbaikan langsung kalau sampai terjadi).
#
#   2. `concurrency` per branch — push beruntun ke PR yang sama tidak lagi
#      menumpuk. Run lama dibatalkan oleh yang lebih baru, karena hanya commit
#      terakhir yang akan di-merge. `cancel-in-progress` sengaja MATI di `main`:
#      di sana setiap commit adalah sejarah yang sudah mendarat, dan
#      membatalkannya berarti ada commit di `main` yang tidak pernah diperiksa
#      penuh — persis keadaan yang gerbang ini ada untuk mencegahnya.
on:
  push:
    branches: [main]
  pull_request:
  # F5: satu-satunya cara SENGAJA menjalankan gerbang live dari CI.
  #
  # Sebelum ini `quality.yml` memanggil `cf-live-contract-test.js` dan
  # `staging-live-test.js` tanpa meneruskan env apa pun, jadi keduanya SELALU
  # SKIP dan angka "semua gerbang hijau" mengandung dua langkah yang tidak
  # menguji satu byte pun runtime Cloudflare (temuan reports/add-a10-kepatuhan.md
  # §5.1). Jawabannya BUKAN menyalakannya pada setiap push: CI publik yang
  # menembak produksi setiap kali seseorang commit adalah beban yang kita
  # timpakan ke murid, bukan pengujian — dan `health-probe-test.js` memang
  # meng-assert larangan itu.
  #
  # Karena itu jalurnya dibuat MANUAL dan ber-input: owner menekan "Run
  # workflow", mengisi base URL, dan hanya pada jalan itu gerbang live berjalan
  # sungguhan (dan MERAH kalau kontraknya patah). Dikosongkan = SKIP eksplisit,
  # sama seperti push biasa.
  workflow_dispatch:
    inputs:
      cf_live_base:
        description: >-
          Base URL Worker fiezel-api untuk cf-live-contract-test.js
          (mis. https://api.fiezel.my.id). Kosongkan untuk tetap SKIP.
          Gerbang ini hanya MEMBACA (GET/OPTIONS + sesi anon), tidak menulis
          state murid.
        required: false
        default: ''
      staging_base:
        description: >-
          Base URL lingkungan STAGING untuk staging-live-test.js. Gerbang ini
          MENULIS state (kuota harian, objek audio, baris analytics) dan menolak
          berjalan kalau /health tidak mengaku staging — JANGAN isi dengan
          produksi. Butuh secret FIEZEL_STAGING_EDGE terpasang di repo.
          Kosongkan untuk tetap SKIP.
        required: false
        default: ''
      ai_live_base:
        description: >-
          Base URL Worker fiezel-api untuk tools/ai-live-verify.mjs (mis.
          https://api.fiezel.my.id). BERBAYAR: satu panggilan model SUNGGUHAN per
          tipe task (hari ini 5 = ±US$0.002, ±244 neuron dari 10.000/hari jatah
          AKUN) dan MENGHABISKAN 1-5 kuota AI harian sebuah identitas anon.
          Kosongkan untuk tetap SKIP.
        required: false
        default: ''
concurrency:
  # Dikunci ke NAMA BRANCH, bukan ke nomor PR atau `github.ref`: pada peristiwa
  # `pull_request` nilai `github.ref_name` berbentuk `333/merge`, sedangkan pada
  # `push` ia berbentuk `main`. Memakai nama branch kepala membuat kedua jalur
  # jatuh ke group yang sama, sehingga dedupe-nya benar-benar terjadi.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned push dependency
        run: npm install --ignore-scripts
      - name: Syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0)
      # Bab 32 mewajibkan audit rilis lulus sebelum rilis, tetapi sampai commit ini tidak ada
      # satu pun workflow yang menjalankannya (temuan K13, reports/cf-c1-konsistensi.md) — satu
      # setup-python terpasang di atas tanpa ada yang memakai Python. Step ini dibuat berdiri
      # sendiri, bukan disisipkan ke blok `Core validation`, karena tiga alasan: ia bukan node
      # dan butuh toolchain berbeda, ia berjalan menit (bukan detik) sehingga durasinya perlu
      # terlihat sendiri di UI Actions, dan kegagalannya harus punya lampu merah sendiri alih-alih
      # tenggelam di antara ~100 baris `node ...`. Ia sengaja diletakkan SEBELUM Core validation
      # agar gagal cepat, dan agar `release-audit-gate-test.js` di bawah bisa memakai ulang
      # FINAL-AUDIT-REPORT.json yang baru saja ditulisnya.
      - name: Release audit (Python)
        run: python3 release-audit.py
      - name: Core validation
        env:
          # Memberi izin kepada release-audit-gate-test.js untuk memakai ulang laporan dari step
          # di atas alih-alih menjalankan audit menit-menitan dua kali. Gerbang itu TIDAK percaya
          # pada flag ini sendirian: ia memverifikasi sha256 app.js + version di dalam laporan
          # cocok dengan berkas kerja saat ini, dan menjalankan auditnya sendiri kalau tidak.
          FIEZEL_RELEASE_AUDIT_REPORT_FRESH: '1'
        run: |
          node validator.js
          node regression-test.js
          node content-audit.js
          node content-qa-agent.js
          node content-qa-agent-test.js
          node content-patch-gate-test.js
          node content-canary-test.js
          node content-promotion-test.js
          node content-adoption-evidence-test.js
          node content-evidence-origin-test.js
          node content-adoption-rehearsal-test.js
          node content-adoption-test.js
          node content-adoption-receipt-test.js
          node continuity-test.js
          node backup-ui-test.js
          node install-health-test.js
          node onboarding-test.js
          node tour-test.js
          node tours-test.js
          node adaptivity-simulation-v3-hardened-test.js
          node analytics-dedup-test.js
          node analytics-stable-id-guard-test.js
          node app-telemetry-wiring-test.js
          node brain-config-test.js
          node brain-manifest-test.js
          node fiezel-stat-gate-test.js
          node learning-lane-test.js
          node braincore-evidence-test.js
          # --- SLOT 10: akun, peran, konten guru, CSV, Braincore, sosial -------
          node auth-schema-contract-test.js
          node auth-role-test.js
          node role-security-test.js
          node teacher-content-test.js
          node teacher-csv-test.js
          node teacher-braincore-test.js
          node social-notify-test.js
          node braincore-learner-identity-test.js
          node learning-metrics-test.js
          node learning-telemetry-test.js
          node metrics-digest-test.js
          node social-api-contract-test.js
          node social-frontend-test.js
          node social-schema-contract-test.js
          node social-invite-link-test.js
          node audio-locale-guard-test.js
          node id-golden-snapshot-test.js
          node locale-enum-test.js
          node th-coverage-test.js
          # th-coverage-test.js menghitung copy-map/naskah/grammar/vocabulary; ia hijau
          # 143/143 sementara murid Thai membaca bahasa Indonesia sepanjang sesi, karena
          # BANK SOAL punya jalur hidrasi sendiri yang tidak pernah lewat copy-map.
          # th-bank-purity-test.js menutup celah itu (lihat THAI-BANK-PURITY-HANDOFF.md).
          node th-bank-purity-test.js
          # Pemindai KEDUA, sengaja memakai metode lain: th-bank-purity-test.js memakai
          # leksikon selisih korpus, scan-th-bank-leak.js memakai daftar kata. Titik
          # butanya BERBEDA — pemindai daftar kata inilah yang menemukan delapan
          # kebocoran yang gerbang korpus lewatkan ketika korpus Inggrisnya tercemar.
          # Keduanya wajib bersih; jangan menghapus salah satunya.
          node tools/scan-th-bank-leak.js
          # Kedua pemindai di atas memeriksa ISI sidecar, dan tidak satu pun memeriksa
          # bahwa sidecar itu SAMPAI ke murid. Bank ujian Listening lolos keduanya selama
          # berbulan-bulan justru karena itu: overlay-nya mencocokkan id lx-* ke peta yang
          # hanya berisi kunci listen_sc_*, jadi tidak pernah kena sasaran sekali pun.
          # th-exam-overlay-test.js memeriksa jalur bacanya, bukan datanya.
          node th-exam-overlay-test.js
          node boot-order-test.js
          node splash-first-paint-test.js
          # m025-199: m025-84 memindahkan markup splash ke frame pertama, tetapi peramban
          # tetap menahan cat sampai style.css (286 KB) berlaku - separuh cacat yang sama
          # bertahan sampai pemilik melaporkannya lagi. Gerbang ini menjaga separuh kedua,
          # berikut jaminan tirai tidak terangkat sebelum lembarnya berlaku.
          node boot-first-paint-nonblocking-test.js
          node splash-choreography-test.js
          node observability-privacy-test.js
          node analytics-privacy-test.js
          node analytics-aggregate-test.js
          node analytics-server-only-test.js
          # A2: sisi KLIEN dari kontrak analytics. Tiga gerbang di atas menjaga Worker; yang ini
          # menjaga tempat jaminannya sebenarnya dieksekusi — perangkat murid. Ia menjalankan
          # `features/analytics/fiezel-analytics-client.js` di dalam `vm` (tanpa jaringan, tanpa
          # localStorage/navigator nyata) lalu menuntut: installId tidak pernah masuk payload,
          # sepuluh event server-only ditolak klien, field asing dibuang, flag `usage` bukan 'on'
          # = nol permintaan DAN nol akses penyimpanan, antrean offline punya cap yang membuang
          # yang tertua, token berubah saat pepper berubah, dan nol pola PII di seluruh payload.
          # Diletakkan tepat sesudah gerbang server-only supaya kedua sisi kontrak yang sama
          # gagal bersebelahan di UI Actions, bukan terpisah 60 baris.
          node analytics-client-test.js
          # T-031: gerbang NAMA GLOBAL. Ia memindai SUMBER seluruh repo (bukan daftar tangan)
          # dan menuntut satu pemilik per nama global: `FiezelAnalytics` hanya boleh ditugaskan
          # modul analytics, `FiezelABAnalytics` hanya oleh modul A/B. Cacat yang melahirkannya:
          # modul A/B merebut `window.FiezelAnalytics` lewat <script defer>, jadi pemuat analytics
          # di idle menerima objek asing dan modul asli tidak pernah diunduh — analytics murid
          # mati total tanpa satu pun galat konsol. Diletakkan bersebelahan dengan gerbang klien
          # analytics supaya kedua sisi cacat yang sama gagal berdampingan.
          node global-name-collision-test.js
          node a11y-test.js
          node contrast-test.js
          # Gerbang di atas dan di bawah baris ini semuanya membaca TEKS SUMBER dengan regex.
          # Itu sengaja - mereka murah dan berjalan di mana saja - tetapi ada satu kelas cacat
          # yang secara struktural TIDAK BISA mereka lihat, karena cacatnya baru lahir setelah
          # kaskade CSS dihitung dan DOM disusun. Contoh yang benar-benar lolos ke murid:
          # contrast-test.js SUDAH menguji `.section-head h1`, tetapi memodelkan warnanya sebagai
          # var(--ambient-text); warna sungguhannya ditimpa #f8faff dari tutor-v3.css, dan judul
          # tiap layar hilang setiap senja pada 1,18:1 dengan gerbang tetap hijau.
          # ui-render-audit-test.js menutup celah itu dengan MENJALANKAN aplikasinya di Chromium.
          # Ia SKIP (keluar 0) kalau Playwright/Chromium tidak ada, jadi CI publik tidak berubah;
          # ia merah hanya kalau browsernya ada DAN invariannya benar-benar patah.
          node ui-render-audit-test.js
          node pastel-field-contrast-test.js
          node topbar-logo-contrast-test.js
          node paw-mascot-test.js
          # Lima gerbang redesign maskot PAW (spec §35 "New regression nets" + A-10).
          # Ditaruh tepat sesudah paw-mascot-test.js karena kelimanya memperluas kontrak
          # yang gerbang itu mulai jaga: satu sumber bentuk (geometri + checksum ekspor),
          # palet karakter tertutup G1, tubuh bebas rotasi, dan kosakata event react().
          node e5-checksum-gate-test.js
          node pawprint-geometry-gate-test.js
          node palette-gate-test.js
          node keyframe-rotation-gate-test.js
          node event-vocabulary-gate-test.js
          node voice-offline-fallback-test.js
          node voice-fallback-chain-test.js
          node voice-pipeline-gap-test.js
          node voice-prefetch-neural-test.js
          node voice-callsite-prefetch-test.js
          node tts-transport-switch-test.js
          node audio-asset-pipeline-test.js
          node product-audit.js
          node runtime-stage8-test.js
          node ai-integration-test.js
          node experience-integration-test.js
          node lesson-experience-test.js
          node ui-structure-test.js
          node settings-cache-test.js
          node gems-test.js
          node back-nav-test.js
          node grammar-quality-audit.js
          node content-integrity-audit.js
          node content-integrity-gate-test.js
          # F5: ADA di repo sejak m025-124 dan LULUS, tetapi tidak pernah dipanggil satu pun
          # workflow (temuan reports/add-a10-kepatuhan.md §5.3). Didaftarkan di sini, bersebelahan
          # dengan dua gerbang integritas konten di atas, karena ia menjaga permukaan yang sama
          # dari sisi BAHASA: nol judul skill berupa kunci mentah, grammar-labels-id.js dimuat
          # sebelum app.js dan ikut di-precache SW, dan setiap penjelasan/alasan distraktor punya
          # versi Bahasa Indonesia yang menunjuk template yang benar-benar ada. Kelas gerbang yang
          # paling langsung menjaga "murid tidak belajar sesuatu yang salah" adalah kelas yang
          # paling tidak boleh berada di luar CI.
          node bank-soal-audit-test.js
          node grammar-memory-scope-test.js
          node grammar-curriculum-test.js
          node level-grammar-contract-test.js
          node grammar-unlock-test.js
          node placement-accuracy-test.js
          node level-guard-test.js
