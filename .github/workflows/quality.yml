name: FIEZEL Quality Gate
on:
  push:
  pull_request:
  # F5: satu-satunya cara SENGAJA menjalankan gerbang live dari CI.
  #
  # Sebelum ini `quality.yml` memanggil `cf-live-contract-test.js` dan
  # `staging-live-test.js` tanpa meneruskan env apa pun, jadi keduanya SELALU
  # SKIP dan angka "semua gerbang hijau" mengandung dua langkah yang tidak
  # menguji satu byte pun runtime Cloudflare (temuan reports/add-a10-kepatuhan.md
  # §5.1). Jawabannya BUKAN menyalakannya pada setiap push: CI publik yang
  # menembak produksi setiap kali seseorang commit adalah beban yang kita
  # timpakan ke murid, bukan pengujian — dan `health-probe-test.js` memang
  # meng-assert larangan itu.
  #
  # Karena itu jalurnya dibuat MANUAL dan ber-input: owner menekan "Run
  # workflow", mengisi base URL, dan hanya pada jalan itu gerbang live berjalan
  # sungguhan (dan MERAH kalau kontraknya patah). Dikosongkan = SKIP eksplisit,
  # sama seperti push biasa.
  workflow_dispatch:
    inputs:
      cf_live_base:
        description: >-
          Base URL Worker fiezel-api untuk cf-live-contract-test.js
          (mis. https://api.fiezel.my.id). Kosongkan untuk tetap SKIP.
          Gerbang ini hanya MEMBACA (GET/OPTIONS + sesi anon), tidak menulis
          state murid.
        required: false
        default: ''
      staging_base:
        description: >-
          Base URL lingkungan STAGING untuk staging-live-test.js. Gerbang ini
          MENULIS state (kuota harian, objek audio, baris analytics) dan menolak
          berjalan kalau /health tidak mengaku staging — JANGAN isi dengan
          produksi. Butuh secret FIEZEL_STAGING_EDGE terpasang di repo.
          Kosongkan untuk tetap SKIP.
        required: false
        default: ''
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned push dependency
        run: npm install --ignore-scripts
      - name: Syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0)
      # Bab 32 mewajibkan audit rilis lulus sebelum rilis, tetapi sampai commit ini tidak ada
      # satu pun workflow yang menjalankannya (temuan K13, reports/cf-c1-konsistensi.md) — satu
      # setup-python terpasang di atas tanpa ada yang memakai Python. Step ini dibuat berdiri
      # sendiri, bukan disisipkan ke blok `Core validation`, karena tiga alasan: ia bukan node
      # dan butuh toolchain berbeda, ia berjalan menit (bukan detik) sehingga durasinya perlu
      # terlihat sendiri di UI Actions, dan kegagalannya harus punya lampu merah sendiri alih-alih
      # tenggelam di antara ~100 baris `node ...`. Ia sengaja diletakkan SEBELUM Core validation
      # agar gagal cepat, dan agar `release-audit-gate-test.js` di bawah bisa memakai ulang
      # FINAL-AUDIT-REPORT.json yang baru saja ditulisnya.
      - name: Release audit (Python)
        run: python3 release-audit.py
      - name: Core validation
        env:
          # Memberi izin kepada release-audit-gate-test.js untuk memakai ulang laporan dari step
          # di atas alih-alih menjalankan audit menit-menitan dua kali. Gerbang itu TIDAK percaya
          # pada flag ini sendirian: ia memverifikasi sha256 app.js + version di dalam laporan
          # cocok dengan berkas kerja saat ini, dan menjalankan auditnya sendiri kalau tidak.
          FIEZEL_RELEASE_AUDIT_REPORT_FRESH: '1'
        run: |
          node validator.js
          node regression-test.js
          node content-audit.js
          node content-qa-agent.js
          node content-qa-agent-test.js
          node content-patch-gate-test.js
          node content-canary-test.js
          node content-promotion-test.js
          node content-adoption-evidence-test.js
          node content-evidence-origin-test.js
          node content-adoption-rehearsal-test.js
          node content-adoption-test.js
          node content-adoption-receipt-test.js
          node continuity-test.js
          node backup-ui-test.js
          node install-health-test.js
          node onboarding-test.js
          node tour-test.js
          node tours-test.js
          node boot-order-test.js
          node splash-first-paint-test.js
          node splash-choreography-test.js
          node observability-privacy-test.js
          node analytics-privacy-test.js
          node analytics-aggregate-test.js
          node analytics-server-only-test.js
          # A2: sisi KLIEN dari kontrak analytics. Tiga gerbang di atas menjaga Worker; yang ini
          # menjaga tempat jaminannya sebenarnya dieksekusi — perangkat murid. Ia menjalankan
          # `features/analytics/fiezel-analytics-client.js` di dalam `vm` (tanpa jaringan, tanpa
          # localStorage/navigator nyata) lalu menuntut: installId tidak pernah masuk payload,
          # sepuluh event server-only ditolak klien, field asing dibuang, flag `usage` bukan 'on'
          # = nol permintaan DAN nol akses penyimpanan, antrean offline punya cap yang membuang
          # yang tertua, token berubah saat pepper berubah, dan nol pola PII di seluruh payload.
          # Diletakkan tepat sesudah gerbang server-only supaya kedua sisi kontrak yang sama
          # gagal bersebelahan di UI Actions, bukan terpisah 60 baris.
          node analytics-client-test.js
          node a11y-test.js
          node contrast-test.js
          node pastel-field-contrast-test.js
          node topbar-logo-contrast-test.js
          node paw-mascot-test.js
          node voice-offline-fallback-test.js
          node voice-fallback-chain-test.js
          node voice-pipeline-gap-test.js
          node voice-prefetch-neural-test.js
          node voice-callsite-prefetch-test.js
          node tts-transport-switch-test.js
          node audio-asset-pipeline-test.js
          node product-audit.js
          node runtime-stage8-test.js
          node ai-integration-test.js
          node experience-integration-test.js
          node lesson-experience-test.js
          node ui-structure-test.js
          node settings-cache-test.js
          node gems-test.js
          node back-nav-test.js
          node grammar-quality-audit.js
          node content-integrity-audit.js
          node content-integrity-gate-test.js
          # F5: ADA di repo sejak m025-124 dan LULUS, tetapi tidak pernah dipanggil satu pun
          # workflow (temuan reports/add-a10-kepatuhan.md §5.3). Didaftarkan di sini, bersebelahan
          # dengan dua gerbang integritas konten di atas, karena ia menjaga permukaan yang sama
          # dari sisi BAHASA: nol judul skill berupa kunci mentah, grammar-labels-id.js dimuat
          # sebelum app.js dan ikut di-precache SW, dan setiap penjelasan/alasan distraktor punya
          # versi Bahasa Indonesia yang menunjuk template yang benar-benar ada. Kelas gerbang yang
          # paling langsung menjaga "murid tidak belajar sesuatu yang salah" adalah kelas yang
          # paling tidak boleh berada di luar CI.
          node bank-soal-audit-test.js
          node grammar-memory-scope-test.js
          node grammar-curriculum-test.js
          node level-grammar-contract-test.js
          node grammar-unlock-test.js
          node placement-accuracy-test.js
          node level-guard-test.js
          node writing-rubric-test.js
          node reading-exam-test.js
          node level-evidence-test.js
          node neural-cache-isolation-test.js
          node prerequisite-graph-test.js
          node speaking-exam-test.js
          node listening-exam-test.js
          node e2e-level-grammar-test.js
          node notification-reminder-test.js
          node remote-push-test.js
          # F5: gerbang kedua yang ada tapi tidak terdaftar (reports/add-a10-kepatuhan.md §5.3).
          # Diletakkan tepat sesudah dua gerbang pemberitahuan/push karena ia menjaga jalur yang
          # sama dari sisi PERSETUJUAN: gestur tangkap laporan tetap terisolasi, laporan otomatis
          # tidak pernah interaktif, laporan sesi/harian tetap tertunda (bukan hilang) tanpa auth,
          # dan persetujuan eksplisit tidak pernah dilangkahi.
          node app-report-control-path-test.js
          node core-brain-test.js
          node core-brain-v2-test.js
          node tutor-brain-v3-test.js
          node misconception-diagnosis-test.js
          node tutor-reteach-card-test.js
          node fiezel-autonomy-config-test.js
          node fiezel-prompt-library-test.js
          node fiezel-meta-learning-test.js
          node fiezel-evolution-ledger-test.js
          node fiezel-self-refine-test.js
          node fiezel-evolution-loop-test.js
          node core-worker-contract-test.js
          node learner-evidence-test.js
          node alrs-behavior-test.js
          node adaptive-policy-test.js
          node policy-outcome-test.js
          node personal-journey-test.js
          node personal-journey-ui-test.js
          node skills-evidence-test.js
          node skills-dashboard-test.js
          node academic-readiness-test.js
          node library-integrity-test.js
          node pwa-cache-test.js
          node pwa-release-coherence-test.js
          node pwa-startup-white-screen-recovery-test.js
          node http-smoke-test.js
          node speaking-listening-test.js
          node check-listening-similarity.js
          node search-feedback-test.js
          node diag-panel-test.js
          node diag-search-test.js
          node sw-corp-test.js
          node classroom-test.js
          node diagnostic-scanner-test.js
          node reminder-struggle-test.js
          node prosody-test.js
          node voice-chunker-test.js
          node tutor-classroom-regression-test.js
          node m02542-experience-test.js
          node neural-voice-m02592-puter-subtitle-test.js
          node neural-voice-m02593-subtitle-translate-test.js
          node puter-auth-coop-test.js
          node puter-auth-diagnostics-test.js
          node puter-popup-once-test.js
          node cf-api-contract-test.js
          node cf-wiring-test.js
          # A6/D1: kontrak SKEMA D1. Dijalankan tepat sesudah `cf-wiring-test.js` karena
          # keduanya membaca berkas yang sama (`workers/api/migrations/*.sql`) dari dua sisi:
          # yang di atas menjaga PENYAMBUNGAN (binding, salinan byte-identik, nama tabel tidak
          # bertabrakan), yang ini menjaga ISI SKEMA — setiap tabel yang dipakai kode ada
          # migrasinya, tidak ada kolom penghubung antara tabel kuota dan tabel analytics,
          # setiap indeks baru punya kueri yang benar-benar memakainya, tidak ada DELETE/DROP
          # tanpa WHERE+LIMIT di migrasi baru, dan `tools/d1-schema-check.mjs` terbukti bisa
          # MERAH (diuji dengan fixture rusak, bukan hanya fixture benar).
          node d1-schema-contract-test.js
          # E9: penjaga jembatan edge. Dijalankan tepat sesudah dua gerbang kontrak Worker
          # karena ia menguji berkas yang sama (`workers/api/index.js`, `route-health.js`) dari
          # sisi ketiga: siapa yang BOLEH memanggil Worker sama sekali. Selama zona
          # `fiezel.my.id` belum di Cloudflare, `api.fiezel.my.id` adalah proxy PHP di origin
          # dan alamat `*.workers.dev` tetap publik — gerbang ini yang menjaga header bersama
          # `X-Fiezel-Edge` benar-benar ditegakkan (waktu-konstan), bahwa `/healthz` tidak
          # membocorkan `capabilities`, dan bahwa `deploy/edge/api-index.php` tidak pernah
          # memuat nilai secret sungguhan.
          node edge-guard-test.js
          # S7: pemantauan produksi. DUA langkah, dan pembagiannya sengaja:
          # `health-probe-test.js` adalah gerbangnya (ia yang membuktikan probe menilai
          # `workers.dev` 200 sebagai KRITIS — bukan OK — dan bahwa exit code hanya merah
          # untuk kegagalan kritis), sedangkan baris di bawahnya menjalankan self-test probe
          # itu sendiri terhadap server loopback. TIDAK ADA pemanggilan probe tanpa
          # `--selftest` di CI: mode produksi menembak api.fiezel.my.id sungguhan, dan
          # CI publik yang menembak produksi pada setiap push adalah beban yang kita
          # timpakan ke murid, bukan pengujian. Gerbangnya meng-assert larangan itu.
          node health-probe-test.js
          node tools/fiezel-health-probe.mjs --selftest
          # A3: kontrak Cron Trigger. Dijalankan tepat sesudah gerbang wiring/edge
          # karena ia mengeksekusi Worker yang sama lewat jalur `scheduled()` dan
          # bukan `fetch()` — sisi yang tidak pernah disentuh gerbang lain. Ia
          # membuktikan: satu ekspresi cron = satu job, rollup dua kali tidak
          # menurunkan angka, pepper lama benar-benar dihapus, `cron_run` mencatat
          # sukses DAN gagal tanpa pesan galat mentah, `dau_dedup` kosong +
          # `usage_daily` terisi = `collection_ok=0`, dan `/api/owner/cron-status`
          # 403 tanpa kredensial owner. Butuh tools/cf-test-harness.js.
          node cron-contract-test.js
          # A7: kontrak proxy PHP jembatan. Dijalankan TEPAT SESUDAH edge-guard-test.js
          # karena keduanya menjaga jembatan yang sama dari dua sisi: yang di atas menjaga
          # sisi WORKER (siapa yang boleh memanggil, /healthz minimal, nol nilai secret di
          # artefak), yang ini menjaga sisi PROXY (allowlist 13 jalur tetap default-tolak,
          # X-Fiezel-Edge tetap dikirim, nol cache pada jalur identitas/kuota/Set-Cookie,
          # IP mentah tidak diteruskan, galat curl mentah tidak pernah sampai ke murid,
          # FOLLOWLOCATION tetap false, dan setiap sakelar transport baru punya komentar
          # alasan). Ia memindai berkas PHP sebagai TEKS — tidak ada PHP di runner ini, dan
          # memasangnya demi satu berkas bukan pertukaran yang sehat; batas itu ditulis di
          # kepala gerbangnya, bukan disembunyikan.
          node edge-proxy-contract-test.js
          # F4: gerbang cacat "permintaan ke-3 menggantung". Dijalankan TEPAT SESUDAH
          # edge-proxy-contract-test.js karena ia menjaga berkas PHP yang sama dari sudut
          # yang berbeda: yang di atas menjaga KEBIJAKAN (siapa boleh lewat, apa yang
          # di-cache), yang ini menjaga TRANSPORT — header hop-by-hop dibuang DUA ARAH,
          # batas cURL lebih pendek dari batas 8 s yang membuat browser
          # menyerah (angkanya dibaca dari tools/fiezel-e2e-bridge.mjs, bukan ditulis dua
          # kali), nol session_start() tanpa session_write_close(), Content-Length tidak
          # diteruskan mentah, badan ditulis sekali lalu di-flush, dan placeholder secret
          # tetap placeholder. Ia memuat KEDUA proxy (api + owner) sebagai TEKS dan
          # membuktikan setiap detektornya bisa MERAH lewat matriks racun di memori.
          # Batasnya ditulis di kepala gerbangnya: ia mencegah kelas cacat ini KEMBALI, ia
          # TIDAK membuktikan cacat F4 tertutup — itu hanya terbukti sesudah gerbang E2E
          # browser dijalankan ulang terhadap jembatan yang sudah diunggah (deploy/edge/
          # README.md §5e.4).
          node edge-proxy-hopbyhop-test.js
          # A4: pemindai rahasia SELURUH repo. Dijalankan tepat sesudah edge-guard karena
          # keduanya menjaga permukaan yang sama dari dua jangkauan berbeda: edge-guard
          # menjaga SATU berkas (`deploy/edge/api-index.php`) secara mendalam, gerbang ini
          # menjaga SEMUA berkas yang dilacak git — kunci ber-prefiks (sk-/pk_/ghp_/cfut_/
          # AIza), JWT, blok PEM, hash bcrypt, token base64url berentropi tinggi, dan
          # `password=`/`secret=`/`token=` bernilai literal. Ia juga menegakkan higiene git:
          # `.gitignore` memuat berkas laporan bergantung-lingkungan, tidak ada `.env` atau
          # `*.bak`/`*.orig`/`*.rej` yang terlacak, dan `deploy/edge/*.php` tetap placeholder.
          # BATAS yang dilaporkan apa adanya: ia memindai working tree, BUKAN riwayat commit
          # (perintah manual untuk owner ada di reports/add-a4-secret-scan.md).
          node secret-scan-test.js
          node quota-core-test.js
          node quota-manipulation-test.js
          node quota-reset-test.js
          # A8: naskah murid + aksesibilitas pemberitahuan jatah/suara. Diletakkan tepat
          # sesudah tiga gerbang jatah karena ia menguji sisi yang mereka nggak sentuh sama
          # sekali: bukan angkanya, tetapi KALIMAT yang dibaca murid ketika angkanya habis —
          # istilah teknis, "nggak" vs "tidak", ketiadaan permukaan bayar, role="alert" yang
          # terdaftar, larangan jalur toast 2.600 ms, varian jujur untuk keadaan tanpa suara,
          # dan aturan senyap selama sesi listening berjalan.
          node quota-notice-a11y-test.js
          node tts-key-test.js
          # A12: gerbang kontrak provider TTS. Wajib tepat sesudah tts-key-test.js karena keduanya
          # menjaga sisi berlawanan dari SATU invarian biaya: yang di atas menjaga bagaimana voiceId
          # masuk kunci cache, yang ini menjaga bahwa voiceId yang SAMA benar-benar berangkat ke
          # provider. Cacat produksi yang melahirkannya (route-tts memanggil {text} saja, pra-render
          # memanggil {text,speaker}) hijau di kedua gerbang lama: 100% render menjawab
          # source:"unavailable", bytes:0, dan tidak ada gerbang yang memeriksa isi permintaan.
          node tts-provider-contract-test.js
          node ai-task-contract-test.js
          # V4: gerbang bentuk jawaban Workers AI + kontrak mutu keluaran. Dijalankan tepat
          # sesudah gerbang kontrak task karena keduanya menguji berkas yang sama dari dua sisi:
          # yang di atas menjaga bentuk PERMINTAAN (klien tidak mengirim prompt), yang ini menjaga
          # bentuk JAWABAN (dua bentuk terbaca, kosong = gagal, reasoning tidak pernah tampil,
          # batas kalimat dan kanon kata ditegakkan). Ia butuh tools/cf-test-harness.js yang sudah
          # dijalankan sebagai self-test di bawah.
          # A12 memperluasnya dengan dua hal yang tidak bisa dilihat dari bentuk jawaban saja:
          # `quotaCharged` wajib ada dan bertipe boolean di SETIAP jalur route-ai.js, dan keluaran
          # kosong ("{}" dari jsonMode, whitespace, JSON kosong) tidak pernah dinyatakan sukses
          # sekaligus kuotanya DIKEMBALIKAN.
          node ai-response-shape-test.js
          node breaker-test.js
          node prerender-dryrun-test.js
          # A1: gerbang aritmetika pra-render. Dijalankan tepat sesudah gerbang dry-run karena
          # keduanya menguji tools/prerender-tts.mjs dari dua sisi: yang di atas menjaga BENTUK
          # (dry-run kering, workflow bergate, manifest terpisah), yang ini menjaga ANGKA (korpus
          # 604.962 karakter, 5.657 objek/286.851 karakter sesudah dedup, harga aura-1 vs
          # aura-2-en, daftar frasa berisiko "On balance", override model per-item).
          node prerender-plan-test.js
          node owner-dashboard-test.js
          # S4: gerbang jembatan `owner.fiezel.my.id`. Ditempatkan TEPAT sesudah
          # `owner-dashboard-test.js` karena keduanya menguji `workers/owner/index.js`, tetapi
          # dari dua sisi berbeda: yang di atas menjaga siapa yang boleh MELIHAT angka (sesi
          # owner), yang ini menjaga siapa yang boleh MEMANGGIL Worker sama sekali (header
          # jembatan `X-Fiezel-Edge`) — dan bahwa dua lapis itu tidak saling menggantikan.
          # Ia juga membuktikan header keamanan HTML (CSP ketat, noindex) tidak hilang di
          # perjalanan lewat daftar pass-through `deploy/edge/owner-index.php`, dan bahwa
          # berkas PHP itu tidak pernah memuat nilai secret sungguhan.
          node owner-edge-guard-test.js
          node tools/cf-test-harness.js
          node no-network-test.js
          # `cf-live-selftest.js` membuktikan gerbang live di bawah ini bisa MERAH:
          # ia menjalankannya terhadap server HTTP loopback yang meniru jawaban
          # benar dan 20 variasi jawaban salah. Loopback murni (127.0.0.1, port 0),
          # tanpa DNS, tanpa keluar mesin — karena itu ia terdaftar di
          # SOCKET_ALLOWLIST `no-network-test.js` dan dijalankan SESUDAHNYA.
          node cf-live-selftest.js
          # F5: DUA gerbang live (`cf-live-contract-test.js`, `staging-live-test.js`)
          # DIPINDAH KELUAR dari blok ini, menjadi step bernama sendiri di bawah.
          # Alasannya bukan kosmetik. Selama keduanya berada di tengah ~150 baris
          # `node …`, kondisi SKIP-nya tidak terlihat siapa pun: langkah "Core
          # validation" berwarna hijau, dan pembaca menyimpulkan runtime Cloudflare
          # sudah terbukti padahal nol byte pernah menyentuhnya. Sebagai step
          # sendiri, SKIP-nya punya nama, alasan, dan ringkasan di UI Actions.
          # `gate-registry-test.js` meng-assert bahwa keduanya TIDAK dihitung
          # sebagai bukti selama env-nya kosong.
          # `e2e-bridge-selftest.js` membuktikan gerbang E2E BROWSER
          # (`tools/fiezel-e2e-bridge.mjs`) bisa MERAH: ia menjalankannya terhadap
          # aplikasi tiruan + jembatan HTTPS loopback dalam 21 skenario (satu benar,
          # 20 salah), dan menuntut kegagalannya jatuh pada id assert yang tepat.
          # Loopback murni: semua nama host uji dipetakan ke 127.0.0.1 lewat
          # --host-resolver-rules, jadi tanpa DNS dan tanpa keluar mesin. Karena itu
          # namanya ada di SOCKET_ALLOWLIST `no-network-test.js` dan langkah ini
          # dijalankan SESUDAHNYA. Kalau playwright/Chromium tidak terpasang di
          # runner, ia mencetak SKIP dan exit 0 — ketiadaan browser di runner bukan
          # cacat produk.
          #
          # `tools/fiezel-e2e-bridge.mjs` sendiri SENGAJA TIDAK didaftarkan di CI.
          # Ia menembak jembatan HIDUP (api.fiezel.my.id) dengan browser sungguhan:
          # mendaftarkannya berarti setiap push memaksa produksi melayani sesi anon
          # baru dan membuat CI merah karena jaringan, bukan karena kode. Cara
          # menjalankannya ada di reports/add-a5-e2e.md dan tools/cf-live-runner.md.
          node e2e-bridge-selftest.js
          node release-audit-gate-test.js
          node cf-transport-test.js
          node cf-shadow-mode-test.js
          # Kill switch server (`GET /api/config`): penggabungan AND (server hanya bisa
          # mematikan), protokol 1.7 wajib cocok, cermin maks 5 menit di sessionStorage,
          # dan boot tidak diblokir. Dijalankan sesudah dua gerbang di atas karena ia
          # menjalankan blok kill switch DAN blok transport bersama-sama.
          node cf-config-killswitch-test.js
          # Batas waktu klien di jalur CF (paket F6): setiap batas punya nilai eksplisit,
          # nilainya >= p95 terukur + margin yang ditulis di komentar sumber, jalur config
          # tidak pernah menahan render, dan kegagalan config jatuh ke semua-off. Berjalan
          # sesudah gerbang kill switch karena ia memakai blok app.js yang sama.
          node cf-client-timeout-test.js
          # Konsistensi konfigurasi lintas berkas: bentuk KV di runbook (§4.5-4.7) harus
          # benar-benar bisa dibaca route-config.js, dan angka batas di wrangler [vars]
          # (yang dikirim ke NASKAH murid) harus sama dengan angka yang DITEGAKKAN di
          # quota/quota-config.js. Ditempatkan tepat sesudah gerbang kill switch karena
          # keduanya menjaga sakelar yang sama dari dua sisi: perilaku kode vs perintah
          # yang benar-benar diketik owner saat insiden.
          node config-consistency-test.js
          node cf-shadow-ledger-test.js
          node ai-transport-switch-test.js
          # A9: gerbang rencana rollout. Diletakkan tepat sesudah dua gerbang sakelar transport
          # karena ia menguji sisi KETIGA dari sakelar yang sama: bukan bentuknya
          # (`cf-transport-test.js`) dan bukan perilakunya (`cf-shadow-mode-test.js`), tetapi
          # apakah URUTAN PENYALAANNYA bisa dieksekusi tanpa menebak — ambang batal berupa angka
          # per langkah, prosedur pembatalan < 60 detik, dan daftar prasyarat yang BELUM
          # terpenuhi yang masih terverifikasi benar terhadap repo. Ia juga menjalankan
          # `tools/flag-plan-check.mjs` terhadap fixture untuk membuktikan kalkulator keadaan
          # efektif itu benar-benar menangkap kombinasi berbahaya (ai on tanpa auth, ai on tanpa
          # kuota, endpoint hidup tanpa kill switch yang terbaca) dan bersih pada keadaan repo
          # hari ini. Nol jaringan; fixture ditulis ke direktori temporer OS.
          node rollout-plan-test.js
          node workflow-actor-gate-test.js
          # F5: gerbang meta pendaftaran. Diletakkan PALING AKHIR dengan sengaja — ia
          # membaca berkas workflow ini sendiri dan membandingkannya dengan seluruh
          # berkas uji yang dilacak git, jadi ia hanya berarti setelah semua entri di
          # atas ada. Ia membuat kelas cacat "gerbang ada di repo tapi tidak pernah
          # dijalankan CI" (§5.3 add-a10) mustahil terulang tanpa terlihat: setiap
          # berkas uji WAJIB terdaftar di sini ATAU punya entri pengecualian dengan
          # ALASAN TERTULIS di dalam gerbang itu. Ia juga meng-assert bahwa dua gerbang
          # live tidak boleh dihitung sebagai bukti.
          node gate-registry-test.js

      # =================================================================================
      # F5 — GERBANG LIVE: SKIP YANG TERLIHAT, DAN CARA MENJALANKANNYA DENGAN SENGAJA
      # =================================================================================
      # Kedua step di bawah ini SENGAJA berdiri sendiri. Pada push/PR biasa keduanya
      # SKIP dan mengatakannya dengan lantang (nama step + alasan + baris ringkasan di
      # $GITHUB_STEP_SUMMARY), sehingga tidak ada lagi "hijau" yang diam-diam berisi
      # gerbang yang tidak menguji apa pun. Pada `workflow_dispatch` dengan input terisi,
      # keduanya berjalan sungguhan dan MERAH kalau kontraknya patah — gerbangnya sendiri
      # yang menegakkan itu (`cf-live-contract-test.js` exit 1 pada assert gagal;
      # `staging-live-test.js` exit 1 bahkan bila base URL diisi tapi tidak sah).
      - name: 'CF live contract gate (SKIP kecuali workflow_dispatch dengan cf_live_base)'
        # Penjaga aktor per-LANGKAH, bukan per-workflow. `quality.yml` harus tetap
        # berjalan untuk setiap push dan setiap PR dari siapa pun - itu justru gunanya.
        # Yang perlu dijaga hanya DUA langkah yang bisa menembak sistem hidup dan
        # membaca secret jembatan. Menggerbangi seluruh workflow ke satu aktor akan
        # mematikan 150+ gerbang untuk kontributor lain: obatnya lebih buruk dari
        # penyakitnya. (Temuan workflow-actor-gate-test.js, 28 Agu 2026.)
        if: github.event_name == 'workflow_dispatch' && github.actor == 'fitrajft-ux'
        env:
          # Pada push/PR `inputs` tidak ada, jadi nilainya string kosong = SKIP.
          # TIDAK ADA nilai bawaan berupa URL di sini, dan itu diperiksa oleh
          # `no-network-test.js`: satu `|| 'https://…'` akan mengubah CI publik menjadi
          # penembak produksi pada setiap push.
          FIEZEL_CF_LIVE_BASE: ${{ github.event.inputs.cf_live_base }}
        run: |
          if [ -z "${FIEZEL_CF_LIVE_BASE}" ]; then
            echo '::notice title=cf-live-contract-test.js SKIP::FIEZEL_CF_LIVE_BASE kosong — gerbang ini TIDAK menguji runtime Cloudflare pada jalan ini dan TIDAK boleh dikutip sebagai bukti runtime.'
            {
              echo '### cf-live-contract-test.js — **SKIP** (bukan PASS)'
              echo ''
              echo 'Alasan: `FIEZEL_CF_LIVE_BASE` tidak diset, jadi tidak ada Worker hidup untuk diuji.'
              echo 'Yang BELUM terbukti pada jalan ini: rute terpasang di edge, `Set-Cookie fz_id` lolos utuh'
              echo 'melewati Cloudflare, `ALLOWED_ORIGINS`/`COOKIE_DOMAIN` benar-benar ter-deploy, cap byte'
              echo 'ditegakkan sebelum body dibaca. Semua itu saat ini hanya diuji di atas stub.'
              echo ''
              echo 'Cara menjalankannya: Actions → FIEZEL Quality Gate → Run workflow → isi `cf_live_base`.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Menjalankan gerbang live SUNGGUHAN terhadap ${FIEZEL_CF_LIVE_BASE} (dipilih manual lewat workflow_dispatch)."
            echo "### cf-live-contract-test.js — dijalankan terhadap \`${FIEZEL_CF_LIVE_BASE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          node cf-live-contract-test.js
      - name: 'Staging live gate (SKIP kecuali workflow_dispatch dengan staging_base)'
        # Penjaga aktor per-LANGKAH, bukan per-workflow. `quality.yml` harus tetap
        # berjalan untuk setiap push dan setiap PR dari siapa pun - itu justru gunanya.
        # Yang perlu dijaga hanya DUA langkah yang bisa menembak sistem hidup dan
        # membaca secret jembatan. Menggerbangi seluruh workflow ke satu aktor akan
        # mematikan 150+ gerbang untuk kontributor lain: obatnya lebih buruk dari
        # penyakitnya. (Temuan workflow-actor-gate-test.js, 28 Agu 2026.)
        if: github.event_name == 'workflow_dispatch' && github.actor == 'fitrajft-ux'
        env:
          FIEZEL_STAGING_BASE: ${{ github.event.inputs.staging_base }}
          # Rahasia header jembatan HANYA boleh datang dari repository secret, tidak
          # pernah dari berkas di repo dan tidak pernah dari input yang terlihat di UI.
          # Kalau secret-nya belum dipasang, nilainya kosong dan gerbangnya SKIP.
          FIEZEL_STAGING_EDGE: ${{ secrets.FIEZEL_STAGING_EDGE }}
        run: |
          if [ -z "${FIEZEL_STAGING_BASE}" ] || [ -z "${FIEZEL_STAGING_EDGE}" ]; then
            echo '::notice title=staging-live-test.js SKIP::FIEZEL_STAGING_BASE dan/atau secret FIEZEL_STAGING_EDGE kosong — gerbang ini TIDAK menguji runtime Cloudflare pada jalan ini.'
            {
              echo '### staging-live-test.js — **SKIP** (bukan PASS)'
              echo ''
              echo 'Alasan: `FIEZEL_STAGING_BASE` dan/atau secret `FIEZEL_STAGING_EDGE` tidak terisi.'
              echo 'Gerbang ini MENULIS state (kuota harian, objek audio, baris analytics), jadi ia hanya boleh'
              echo 'menembak lingkungan staging yang terpisah dari data murid — dan ia menolak berjalan kalau'
              echo '`/health` tidak mengaku staging.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Menjalankan gerbang staging SUNGGUHAN terhadap ${FIEZEL_STAGING_BASE} (dipilih manual lewat workflow_dispatch)."
            echo "### staging-live-test.js — dijalankan terhadap \`${FIEZEL_STAGING_BASE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          node staging-live-test.js
