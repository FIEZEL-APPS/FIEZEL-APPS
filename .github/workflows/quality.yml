          node puter-auth-coop-test.js
          node puter-auth-diagnostics-test.js
          node puter-popup-once-test.js
          node cf-api-contract-test.js
          node cf-wiring-test.js
          # A6/D1: kontrak SKEMA D1. Dijalankan tepat sesudah `cf-wiring-test.js` karena
          # keduanya membaca berkas yang sama (`workers/api/migrations/*.sql`) dari dua sisi:
          # yang di atas menjaga PENYAMBUNGAN (binding, salinan byte-identik, nama tabel tidak
