        # mematikan 150+ gerbang untuk kontributor lain: obatnya lebih buruk dari
        # penyakitnya. (Temuan workflow-actor-gate-test.js, 28 Agu 2026.)
        if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
        env:
          # Pada push/PR `inputs` tidak ada, jadi nilainya string kosong = SKIP.
          # TIDAK ADA nilai bawaan berupa URL di sini, dan itu diperiksa oleh
          # `no-network-test.js`: satu `|| 'https://…'` akan mengubah CI publik menjadi
          # penembak produksi pada setiap push.
          FIEZEL_CF_LIVE_BASE: ${{ github.event.inputs.cf_live_base }}
          # Laporan diarahkan keluar dari working tree (gerbang lain memeriksa pohon tetap
          # bersih) dan ke tempat yang bisa diunggah sebagai artefak.
          FIEZEL_CF_LIVE_REPORT: ${{ runner.temp }}/CF-LIVE-REPORT.json
        run: |
          if [ -z "${FIEZEL_CF_LIVE_BASE}" ]; then
            echo '::notice title=cf-live-contract-test.js SKIP::FIEZEL_CF_LIVE_BASE kosong — gerbang ini TIDAK menguji runtime Cloudflare pada jalan ini dan TIDAK boleh dikutip sebagai bukti runtime.'
            {
              echo '### cf-live-contract-test.js — **SKIP** (bukan PASS)'
              echo ''
              echo 'Alasan: `FIEZEL_CF_LIVE_BASE` tidak diset, jadi tidak ada Worker hidup untuk diuji.'
              echo 'Yang BELUM terbukti pada jalan ini: rute terpasang di edge, `Set-Cookie fz_id` lolos utuh'
              echo 'melewati Cloudflare, `ALLOWED_ORIGINS`/`COOKIE_DOMAIN` benar-benar ter-deploy, cap byte'
              echo 'ditegakkan sebelum body dibaca. Semua itu saat ini hanya diuji di atas stub.'
              echo ''
              echo 'Cara menjalankannya: Actions → FIEZEL Quality Gate → Run workflow → isi `cf_live_base`.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Menjalankan gerbang live SUNGGUHAN terhadap ${FIEZEL_CF_LIVE_BASE} (dipilih manual lewat workflow_dispatch)."
            echo "### cf-live-contract-test.js — dijalankan terhadap \`${FIEZEL_CF_LIVE_BASE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          node cf-live-contract-test.js --report
      - name: 'Staging live gate (SKIP kecuali workflow_dispatch dengan staging_base)'
        # Penjaga aktor per-LANGKAH, bukan per-workflow. `quality.yml` harus tetap
        # berjalan untuk setiap push dan setiap PR dari siapa pun - itu justru gunanya.
        # Yang perlu dijaga hanya DUA langkah yang bisa menembak sistem hidup dan
        # membaca secret jembatan. Menggerbangi seluruh workflow ke satu aktor akan
        # mematikan 150+ gerbang untuk kontributor lain: obatnya lebih buruk dari
        # penyakitnya. (Temuan workflow-actor-gate-test.js, 28 Agu 2026.)
        if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
        env:
          FIEZEL_STAGING_BASE: ${{ github.event.inputs.staging_base }}
          # Rahasia header jembatan HANYA boleh datang dari repository secret, tidak
          # pernah dari berkas di repo dan tidak pernah dari input yang terlihat di UI.
          # Kalau secret-nya belum dipasang, nilainya kosong dan gerbangnya SKIP.
          FIEZEL_STAGING_EDGE: ${{ secrets.FIEZEL_STAGING_EDGE }}
        run: |
          if [ -z "${FIEZEL_STAGING_BASE}" ] || [ -z "${FIEZEL_STAGING_EDGE}" ]; then
            echo '::notice title=staging-live-test.js SKIP::FIEZEL_STAGING_BASE dan/atau secret FIEZEL_STAGING_EDGE kosong — gerbang ini TIDAK menguji runtime Cloudflare pada jalan ini.'
            {
              echo '### staging-live-test.js — **SKIP** (bukan PASS)'
              echo ''
              echo 'Alasan: `FIEZEL_STAGING_BASE` dan/atau secret `FIEZEL_STAGING_EDGE` tidak terisi.'
              echo 'Gerbang ini MENULIS state (kuota harian, objek audio, baris analytics), jadi ia hanya boleh'
              echo 'menembak lingkungan staging yang terpisah dari data murid — dan ia menolak berjalan kalau'
              echo '`/health` tidak mengaku staging.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Menjalankan gerbang staging SUNGGUHAN terhadap ${FIEZEL_STAGING_BASE} (dipilih manual lewat workflow_dispatch)."
            echo "### staging-live-test.js — dijalankan terhadap \`${FIEZEL_STAGING_BASE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          node staging-live-test.js
      - name: 'AI live verify (SKIP kecuali workflow_dispatch dengan ai_live_base)'
        # Penjaga aktor per-LANGKAH, alasannya sama dengan dua langkah live di atas —
        # dengan satu tambahan yang khas langkah ini: ia MEMBELANJAKAN UANG. Setiap
        # tipe task adalah satu panggilan Workers AI sungguhan, dan jatah neuron itu
        # milik AKUN, bukan per-pemicu. Kalau langkah ini pernah jalan tiap push, satu
        # PR ramai bisa menghabiskan jatah harian akun dan mematikan AI untuk murid.
        # `no-network-test.js` blok 2d memeriksa dari sisi lain bahwa langkah ini hanya
        # ada dalam bentuk bergerbang aktor + workflow_dispatch.
        if: github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
        env:
          # Pada push/PR `inputs` tidak ada, jadi nilainya string kosong = SKIP.
          FIEZEL_AI_LIVE_BASE: ${{ github.event.inputs.ai_live_base }}
          FIEZEL_AI_LIVE_REPORT: ${{ runner.temp }}/AI-LIVE-REPORT.json
        run: |
          if [ -z "${FIEZEL_AI_LIVE_BASE}" ]; then
            echo '::notice title=ai-live-verify SKIP::FIEZEL_AI_LIVE_BASE kosong — kontrak AI Cloudflare TIDAK diuji terhadap model sungguhan pada jalan ini dan TIDAK boleh dikutip sebagai bukti runtime.'
            {
              echo '### tools/ai-live-verify.mjs — **SKIP** (bukan PASS)'
              echo ''
              echo 'Alasan: `FIEZEL_AI_LIVE_BASE` tidak diset. Langkah ini berbayar, jadi ia mati secara bawaan.'
              echo 'Yang BELUM terbukti pada jalan ini: model Workers AI sungguhan menjawab, jawabannya LOLOS'
              echo 'kontrak mutu kami dan sampai ke murid (bukan diganti fallback), kedua bentuk jawaban provider'
              echo 'terbaca di runtime nyata, dan `quotaCharged` benar sebagai FAKTA — jatah di `/api/quota` naik'
              echo 'tepat sebanyak jawaban provider yang sukses. Semua itu saat ini hanya diuji di atas stub.'
              echo ''
              echo 'Cara menjalankannya: Actions → FIEZEL Quality Gate → Run workflow → isi `ai_live_base`.'
              echo 'Biaya sekali jalan: ±US$0.002 dan ±244 neuron; batasi dengan `FIEZEL_AI_LIVE_TASKS`.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Menjalankan pembukti AI live SUNGGUHAN terhadap ${FIEZEL_AI_LIVE_BASE} (dipilih manual lewat workflow_dispatch)."
            echo "### tools/ai-live-verify.mjs — dijalankan terhadap \`${FIEZEL_AI_LIVE_BASE}\` (BERBAYAR)" >> "$GITHUB_STEP_SUMMARY"
          fi
          node tools/ai-live-verify.mjs --report
      - name: 'Bukti gerbang live (artefak — supaya hasilnya bisa DIBACA, bukan hanya hijau)'
        # Kenapa langkah ini ada: kedua gerbang live di atas menghasilkan bukti terkaya di
        # seluruh workflow ini — assert per assert terhadap sistem yang sungguhan hidup —
        # lalu bukti itu tenggelam di tengah log job yang panjang, di belakang keluaran
        # simulasi adaptivitas yang berukuran puluhan ribu baris. Centang hijau BUKAN bukti:
        # ia tidak memberi tahu assert mana yang lulus, berapa panggilan model yang terjadi,
        # atau berapa kuota yang terpakai. Audit rilis 30 Agu 2026 tersandung persis di situ.
        # `if: always()` disengaja: jalan yang MERAH justru yang paling perlu dibaca.
        if: always() && github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
        uses: actions/upload-artifact@v4
        with:
          name: fiezel-bukti-live
          path: |
            ${{ runner.temp }}/CF-LIVE-REPORT.json
            ${{ runner.temp }}/AI-LIVE-REPORT.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 'Gerbang hulu yang sempat tidak terdaftar (braincore fase 2 + lapisan game/UX)'
        # Ditemukan gate-registry-test.js saat merge 28 Agu 2026: lima belas berkas uji
        # mendarat bersama braincore fase 2 dan lapisan game/UX tanpa pernah dipanggil CI.
        # Semuanya dijalankan satu per satu lebih dulu dan lima belas-nya exit 0, jadi yang
        # kurang cuma pendaftaran - bukan mutunya. Didaftarkan di satu langkah agar urutan
        # aslinya terbaca; gate-registry-test.js yang menjaga supaya ini tidak terulang.
        run: |
          node affect-test.js
          node cloze-bank-test.js
          node confusion-matrix-test.js
          node core-brain-v3-upgrade-test.js
          node evidence-credibility-test.js
          node item-prior-test.js
          node level-source-difficulty-variance-test.js
          node listening-adaptive-test.js
          node mastery-bkt-test.js
          node misconception-ledger-test.js
          node misconception-taxonomy-test.js
          node olm-test.js
          node p1-game-layer-smoke-test.js
          node prasasti-test.js
          node production-grader-test.js
          node r2-ux-overhaul-smoke-test.js
          node step-tutor-test.js
          node item-calibration-test.js
          node speaking-adaptive-test.js
          node srl-coach-test.js
          node cors-envelope-test.js
      - name: 'Braincore v3: jalur save() diukur (regresi performa D4)'
        # Perbaikan D4 (#1 formatter Intl per baris, #2 tiga save() per jawaban) sampai kini
        # hanya dijaga tiga blok komentar. Regresi performa adalah regresi paling sunyi:
        # tidak ada yang merah, aplikasinya cuma pelan — dan pelan di HP murid berarti sesi
        # yang ditinggalkan. Gerbang ini menjalankan app.js di vm dengan Intl.DateTimeFormat
        # dan localStorage.setItem yang DIHITUNG, jadi kode boleh ditulis ulang sesuka hati
        # selama angkanya tetap. Terbukti bisa merah: bentuk pra-perbaikan = 3.006 konstruksi.
        run: node save-path-perf-test.js
      - name: 'Braincore v3: kemurnian modul brain (lint kustom)'
        # Definition of Done Braincore v3: NOL Math.random / Date.now / DOM / storage /
        # jaringan di features/brain/**. Sampai gerbang ini ada, kemurnian itu hanya
        # dijanjikan di header tiap modul — dan janji di komentar tidak menghentikan
        # commit siapa pun. Ia memakai lexer yang membuang komentar & string lebih dulu,
        # supaya kalimat dokumentasi ("tidak pernah memanggil Date.now()") tidak dihukum
        # sebagai pelanggaran; gerbang yang merah karena alasan salah akan dimatikan orang.
        # Berdiri di step sendiri agar kegagalannya punya lampu merah sendiri.
        run: node braincore-purity-test.js
      - name: 'Wave E4: post-test tertunda / probe retensi (fiezel-post-test)'
        # Modul murni baru features/brain/fiezel-retention-probe.js: penjadwal probe retensi
        # deterministik (offset 3/7/21 hari, jitter seeded per lessonId+userSeed) +
        # evaluator kalibrasi retensi (Brier, flag mastery rapuh, rekomendasi half-life
        # ADVISORY — penulisan memori tetap milik single-writer FSRS). Gate memeriksa
        # oracle manual, determinisme byte-identik, ketahanan input korup, dan properti
        # "probe tidak pernah dijadwalkan untuk lesson tanpa mastery".
        run: node fiezel-post-test-test.js
      - name: 'Wave E2: selftest simulator extended (mekanisme gate jujur — arah pesan, CI bootstrap, censoring)'
        # Menjaga MEKANISME adaptivity-simulation-v3-extended.js (tulis-ulang jujur
        # pengerasan PR #226 yang dicabut di fe62a95): arah perbandingan verdict,
        # pesan yang tidak berbohong tentang arah (bug forensik E2: "itemBiasRMSE
        # TIDAK turun (0.2694 → 0.2622)" padahal turun), bootstrap deterministik,
        # aturan mutlak censoring hanya untuk varian kebijakan populasi, dan CLI
        # byte-identik. Simulator extended-nya SENGAJA tidak dijadikan gate CI:
        # verdict-nya merah karena TEMUAN brain (v2 tersensor 88% vs v1 50.4%,
        # CI [0.334, 0.42]) — kandidat wave berikut, bukan alasan memblokir PR lain.
        run: node adaptivity-simulation-v3-extended-selftest.js
      - name: 'Gerbang warisan merge main 28 Agu yang belum terdaftar (temuan E5, wave E)'
        # Ditemukan gate-registry-test.js saat pengerjaan E5 (29 Agu 2026): lima belas berkas
        # uji dari merge main (analytics, telemetry, brain manifest, locale, baseline emas,
        # cakupan Thai, dst.) tidak pernah dipanggil CI. Semuanya dijalankan lokal lebih dulu
        # dan lima belas-nya exit 0 — yang kurang pendaftarannya, bukan mutunya.
        run: |
          node analytics-dedup-test.js
          node analytics-stable-id-guard-test.js
          node app-telemetry-wiring-test.js
          node audio-locale-guard-test.js
          node brain-config-test.js
          node brain-manifest-test.js
          node fiezel-stat-gate-test.js
          node id-golden-snapshot-test.js
          node learning-lane-test.js
          node braincore-evidence-test.js
          node braincore-learner-identity-test.js
          node learning-metrics-test.js
          node learning-telemetry-test.js
          node locale-enum-test.js
          node metrics-digest-test.js
          # (union merge 29 Agu) tiga gerbang Thai m025-186 dari sisi main — id-golden-snapshot,
          # locale-enum, audio-locale-guard — sudah tercakup daftar di atas; th-coverage-test.js
          # dikecualikan registry (kelas gerbang-pra-rilis-fitur, keputusan MASTER 9bf2e13):
          # kontraknya mengikat rilis th, bukan rilis id — didaftarkan ulang sebelum saklar th.
      - name: 'Wave F2: gate anti-drift konten (explanations-id ↔ templates, inventori, count vocab-th)'
        # Menutup pola kerusakan 3 wave berturut: sumber terjemahan tertinggal dari
        # bank yang di-QA (b0d983c → c3e02f3, 5643a32, f87a39a) dan inventori
        # indonesianCoverage basi (222/222 vs 249) yang lolos semua gerbang lama.
        # Perbaikan bila merah: node tools/sync-grammar-explanations-id.js --write
        # && node audit/merge-grammar-id.js. Detail: header content-drift-test.js.
        run: node content-drift-test.js
      - name: 'Wave F1: gerbang overperformance berkelanjutan (regresi censoring mastery)'
        # Mengawal perbaikan F1 di fiezel-core-brain.js: residualPositiveShare (momentum
        # basis residual) + cabang 'sustained_overperformance' planSession. Tanpa gate ini
        # cabang tersebut bisa dicabut diam-diam dan jebakan jangkar censoring (mastery v2
        # ~13% vs v1 ~44% dalam 35 hari, research_hold simulasi v3) kembali tanpa alarm.
        run: node wave-f1-censoring-test.js
      - name: 'Gerbang simulasi adaptivitas v3 (gate yatim CI — temuan D1, wave D)'
        # adaptivity-simulation-v3.js adalah gate sungguhan (exit code dari main();
        # gate residual + gate kalibrasi bisa merah), tetapi namanya lolos dari pola
        # GATE_NAME_RE gate-registry-test.js (*-test/-audit/-selftest) sehingga tidak
        # pernah dipanggil CI (temuan D1 gate-sweep, 28 Agu 2026). Didaftarkan di sini
        # secara ADDITIVE per peta koordinasi D10 (quality.yml disentuh 5 PR terbuka).
        run: node adaptivity-simulation-v3.js
      - name: 'Cetak ulang bukti live di AKHIR log (bukan hanya di artefak)'
        # Artefak `fiezel-bukti-live` sudah menyimpan kedua laporan, tetapi mengunduh artefak
        # butuh perkakas; membaca log tidak. Dan letaknya menentukan: keluaran asli kedua
        # gerbang live terkubur di TENGAH log, di belakang simulasi adaptivitas yang puluhan
        # ribu baris, jadi pembaca yang membuka log dari bawah tidak akan pernah sampai ke
        # sana. Dicetak ulang di paling akhir, laporan itu jadi hal pertama yang terlihat.
        #
        # Skripnya berkas repo, BUKAN skrip sebaris: runner menggemakan badan setiap `run:`
        # ke log, jadi skrip sebaris 40 baris justru mendorong bukti yang mau diselamatkan
        # keluar dari jendela ekor log. Obatnya jangan jadi penyakitnya.
        #
        # `if: always()` disengaja: jalan yang MERAH justru yang paling perlu dibaca.
        if: always() && github.event_name == 'workflow_dispatch' && github.actor == 'FIEZEL-APPS'
        run: node tools/print-live-evidence.mjs "$RUNNER_TEMP/CF-LIVE-REPORT.json" "$RUNNER_TEMP/AI-LIVE-REPORT.json"
