          # pwa-release-coherence memeriksa keempat penanda SELARAS satu sama lain; ia tidak
          # bisa tahu nomornya sudah dipakai jalur lain. Itu celah yang meloloskan tabrakan
          # m025-196..199 (BUILD-NUMBER-COLLISION-2026-08-30.md). --strict: di CI, dasar yang
