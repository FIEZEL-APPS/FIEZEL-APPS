name: m025-25 candidate assembler

on:
  push:
    branches:
      - master/perf67-m02525-runtime-matrix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master/perf67-m02525-runtime-matrix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact m025-25 product mutations
        shell: python
        run: |
          from pathlib import Path
          import json

          bootstrap_path = Path('features/neural-voice/fiezel-neural-voice-bootstrap.js')
          bootstrap = bootstrap_path.read_text()
          jsep_pair = "    {path:'vendor/kokoro-js/wasm/ort-wasm-simd-threaded.jsep.mjs',bytes:44484},\n    {path:'vendor/kokoro-js/wasm/ort-wasm-simd-threaded.jsep.wasm',bytes:21596019},"
          expanded_pair = jsep_pair + "\n    {path:'vendor/kokoro-js/wasm/ort-wasm-simd-threaded.mjs',bytes:20856},\n    {path:'vendor/kokoro-js/wasm/ort-wasm-simd-threaded.wasm',bytes:11133407},"
          if "ort-wasm-simd-threaded.mjs',bytes:20856" not in bootstrap:
              if bootstrap.count(jsep_pair) != 1:
                  raise SystemExit('bootstrap JSEP asset anchor mismatch')
              bootstrap = bootstrap.replace(jsep_pair, expanded_pair, 1)
          bootstrap_path.write_text(bootstrap)

          diag_path = Path('features/neural-voice/fiezel-diag-panel.js')
          diag = diag_path.read_text()
          old_diag = "var DIAG_BUILD = 'm025-24';"
          new_diag = "var DIAG_BUILD = 'm025-25';"
          if new_diag not in diag:
              if diag.count(old_diag) != 1:
                  raise SystemExit('DIAG_BUILD anchor mismatch')
              diag = diag.replace(old_diag, new_diag, 1)
          diag_path.write_text(diag)

          sw_path = Path('sw.js')
          sw = sw_path.read_text()
          old_sw = "const SW_REV='m025-24-proxy-timeout-recovery-20260817-1';"
          new_sw = "const SW_REV='m025-25-safari-nonjsep-wasm-20260817-1';"
          if new_sw not in sw:
              if sw.count(old_sw) != 1:
                  raise SystemExit('SW_REV anchor mismatch')
              sw = sw.replace(old_sw, new_sw, 1)
          sw_path.write_text(sw)

          quality_path = Path('.github/workflows/quality.yml')
          quality = quality_path.read_text()
          line = '          node neural-voice-m02525-safari-nonjsep-test.js\n'
          anchor = '          node neural-voice-m02524-proxy-timeout-recovery-test.js\n'
          if line not in quality:
              if quality.count(anchor) != 1:
                  raise SystemExit('quality anchor mismatch')
              quality = quality.replace(anchor, anchor + line, 1)
          quality_path.write_text(quality)

          lock_path = Path('NEURAL-VOICE-SOURCE-LOCK.json')
          lock = json.loads(lock_path.read_text())
          lock['candidate']['id'] = 'm025-25'
          lock['candidate']['state'] = 'MACHINE_CANDIDATE / PHYSICAL_PENDING'
          lock['candidate']['wasmExperiment'] = {
              'reason': 'Safari/WebKit 26 JSEP differential on the pinned ORT CPU/WASM backend',
              'productionBackend': 'wasm',
              'dtype': 'q8',
              'appleStandaloneVariant': 'standard-non-jsep',
              'controlVariant': 'jsep/runtime-default',
              'timeoutChanged': False,
              'modelChanged': False,
              'voiceChanged': False,
              'webgpuEnabled': False
          }
          lock['runtime']['standardWasmModule'] = {
              'path': 'vendor/kokoro-js/wasm/ort-wasm-simd-threaded.mjs',
              'sizeBytes': 20856,
              'sha256': '43c25054b6b9ac000f786c65545ff83a45f871e0e310e8c2f4d48a363bb66db4',
              'source': 'npm:onnxruntime-web@1.22.0-dev.20250409-89f8206ba4'
          }
          lock['runtime']['standardWasmBinary'] = {
              'path': 'vendor/kokoro-js/wasm/ort-wasm-simd-threaded.wasm',
              'sizeBytes': 11133407,
              'sha256': 'f061472c6e77d6d50d079aacdc0ff9b63fee287ddd2cbf46cf62438d3891de2b',
              'source': 'npm:onnxruntime-web@1.22.0-dev.20250409-89f8206ba4'
          }
          lock['promotion']['realDeviceGate'] = 'PENDING'
          lock['promotion']['productionClaim'] = False
          machine = lock['promotion'].setdefault('machineEvidence', {})
          machine['m02525StandardWasmModuleSha256'] = '43c25054b6b9ac000f786c65545ff83a45f871e0e310e8c2f4d48a363bb66db4'
          machine['m02525StandardWasmBinarySha256'] = 'f061472c6e77d6d50d079aacdc0ff9b63fee287ddd2cbf46cf62438d3891de2b'
          machine['m02525BootstrapRun'] = 31997363002
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

      - name: Run focused repair gates before publishing candidate commit
        shell: bash
        run: |
          set -euo pipefail
          node --check features/neural-voice/fiezel-kokoro-adapter.js
          node neural-voice-m02522-real-wasm-proxy-test.js
          node neural-voice-m02524-proxy-timeout-recovery-test.js
          node neural-voice-m02525-safari-nonjsep-test.js
          node ios-wasm-module-test.js
          node pwa-release-coherence-test.js
          node diag-panel-test.js

      - name: Remove temporary branch-only assembler/bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/m02525-candidate-apply.yml .github/workflows/m02525-ort-nonjsep-bootstrap.yml

      - name: Publish assembled candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git add features/neural-voice/fiezel-kokoro-adapter.js \
                  features/neural-voice/fiezel-neural-voice-bootstrap.js \
                  features/neural-voice/fiezel-diag-panel.js \
                  vendor/kokoro-js/wasm/ort-wasm-simd-threaded.mjs \
                  vendor/kokoro-js/wasm/ort-wasm-simd-threaded.wasm \
                  neural-voice-m02525-safari-nonjsep-test.js \
                  NEURAL-VOICE-SOURCE-LOCK.json \
                  .github/workflows/quality.yml sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'm025-25: select non-JSEP ORT WASM on Apple standalone'
          git push origin HEAD:master/perf67-m02525-runtime-matrix
