# B8: test backend Braincore di CI (dulu unit_test.py & probe.py hanya dijalankan manual).
# Tiga lapis: unit murni (stub), probe fungsional (stub Mongo in-memory), dan E2E anti-IDOR
# melawan uvicorn HIDUP + MongoDB nyata dengan dua guru/dua kelas/dua murid.
name: backend-tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  braincore:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: fiezel_ci
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      CURRICULUM_TICKET_KEY: ci-only-ticket-key-0123456789abcdefghijklmnopqrstuvwxyz
      CORS_ORIGINS: "*"
      API_URL: http://127.0.0.1:8001
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps (subset runtime — cukup untuk server & test)
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi==0.110.1" "starlette==0.37.2" "uvicorn==0.25.0" "motor==3.3.1" \
            "pymongo==4.6.3" "pydantic==2.13.5" "PyJWT==2.13.0" "python-dotenv==1.2.3" \
            "httpx==0.28.1" "pytest==9.1.1" "email-validator==2.3.0" "python-multipart==0.0.32"
      - name: Unit test murni (BKT/IRT/decay/paritas klien/validasi)
        run: python unit_test.py
      - name: Probe fungsional Braincore (stub Mongo)
        run: python probe.py
      - name: Start API
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/api/health
      - name: E2E anti-IDOR (2 guru, 2 kelas, 2 murid) + kasus tepi
        run: python -m pytest tests/test_idor_e2e.py tests/test_edge_cases.py -q
      - name: Regresi backend (auth tiket, kurikulum, soal, asesmen, luring, migrasi)
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:8001
        run: pip install "requests==2.34.0" && python -m pytest tests/test_fiezel_backend.py -q
      - name: Log API bila gagal
        if: failure()
        run: tail -n 100 uvicorn.log || true
