name: m025-37 sherpa VITS voice-selection Safari benchmark

on:
  push:
    branches:
      - master/perf67-m02537-sherpa-vits-voice-selection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Source-lock sherpa-onnx v1.13.5
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            rm -rf .m02537-sherpa
            if git -c http.version=HTTP/1.1 clone --depth 1 --branch v1.13.5 https://github.com/k2-fsa/sherpa-onnx.git .m02537-sherpa; then break; fi
            sleep $((attempt * 3))
          done
          test -d .m02537-sherpa/.git
          test "$(git -C .m02537-sherpa describe --tags --exact-match)" = "v1.13.5"
          test "$(git -C .m02537-sherpa rev-parse HEAD)" = "3dc7c569f31ca2cd4a20ed6f7db780327e6714c5"
          git -C .m02537-sherpa rev-parse HEAD | tee m02537-sherpa-head.txt

      - name: Stage exact Piper VITS model
        shell: bash
        run: |
          set -euo pipefail
          MODEL='vits-piper-en_US-libritts_r-medium'
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${MODEL}.tar.bz2"
          EXPECTED_TAR='10dc268f3e371696d721486123e2705a9fc1faa113491979fde4d88dba1f1b1c'
          EXPECTED_ONNX='8cce84cee4060bc3c2194bf95d33253c48dc8ff15e197b3b7a00b334ee0017f4'
          curl --fail --location --retry 4 --retry-all-errors --output "${MODEL}.tar.bz2" "$URL"
          ACTUAL_TAR="$(shasum -a 256 "${MODEL}.tar.bz2" | awk '{print $1}')"
          test "$ACTUAL_TAR" = "$EXPECTED_TAR"
          printf '%s  %s\n' "$ACTUAL_TAR" "${MODEL}.tar.bz2" | tee m02537-model-tar-sha256.txt
          stat --printf='%s\n' "${MODEL}.tar.bz2" | tee m02537-model-tar-size.txt
          tar xf "${MODEL}.tar.bz2"
          test -s "${MODEL}/en_US-libritts_r-medium.onnx"
          test -s "${MODEL}/tokens.txt"
          test -d "${MODEL}/espeak-ng-data"
          rm -rf .m02537-sherpa/wasm/tts/assets/*
          cp "${MODEL}/en_US-libritts_r-medium.onnx" .m02537-sherpa/wasm/tts/assets/model.onnx
          cp "${MODEL}/tokens.txt" .m02537-sherpa/wasm/tts/assets/tokens.txt
          cp -R "${MODEL}/espeak-ng-data" .m02537-sherpa/wasm/tts/assets/espeak-ng-data
          ACTUAL_ONNX="$(shasum -a 256 .m02537-sherpa/wasm/tts/assets/model.onnx | awk '{print $1}')"
          test "$ACTUAL_ONNX" = "$EXPECTED_ONNX"
          printf '%s  model.onnx\n' "$ACTUAL_ONNX" | tee m02537-model-onnx-sha256.txt
          stat --printf='%s\n' .m02537-sherpa/wasm/tts/assets/model.onnx | tee m02537-model-onnx-size.txt
          printf '%s\n' "$MODEL" | tee m02537-model-name.txt
          cat > m02537-catalog.json <<'JSON'
          {"contract":"explicit-replacement-catalog-v1","legacyKokoroAlias":false,"candidates":[{"name":"local-1","sid":0},{"name":"local-2","sid":180},{"name":"local-3","sid":360},{"name":"local-4","sid":540},{"name":"local-5","sid":720},{"name":"local-6","sid":903}]}
          JSON

      - name: Install pinned Emscripten 4.0.23
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            rm -rf .m02537-emsdk
            if git -c http.version=HTTP/1.1 clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git .m02537-emsdk; then break; fi
            sleep $((attempt * 3))
          done
          test -d .m02537-emsdk/.git
          cd .m02537-emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23
          source ./emsdk_env.sh
          emcc --version | tee ../m02537-emcc-version.txt

      - name: Pin exact build dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.m02537-deps"
          mkdir -p "$ROOT"
          clone_tag_exact() {
            repo="$1"; tag="$2"; sha="$3"; dir="$4"
            for attempt in 1 2 3 4; do
              rm -rf "$dir"
              if git -c http.version=HTTP/1.1 clone --depth 1 --branch "$tag" "https://github.com/${repo}.git" "$dir"; then break; fi
              sleep $((attempt * 3))
            done
            test -d "$dir/.git"
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }
          fetch_sha_exact() {
            repo="$1"; sha="$2"; dir="$3"
            rm -rf "$dir"; git init "$dir"; git -C "$dir" remote add origin "https://github.com/${repo}.git"
            ok=0
            for attempt in 1 2 3 4; do
              if git -C "$dir" -c http.version=HTTP/1.1 fetch --depth 1 origin "$sha"; then ok=1; break; fi
              sleep $((attempt * 3))
            done
            test "$ok" = 1
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }
          clone_tag_exact csukuangfj/kaldi-native-fbank v1.22.3 b09e686fe2084732ddd30d1ef80acfc0f13eaf01 "$ROOT/kaldi-native-fbank"
          fetch_sha_exact mborgerding/kissfft febd4caeed32e33ad8b2e0bb5ea77542c40f18ec "$ROOT/kissfft"
          clone_tag_exact k2-fsa/kaldi-decoder v0.3.0 62fda2d74246a90db9570e46fb16b012f813fae7 "$ROOT/kaldi-decoder"
          clone_tag_exact k2-fsa/kaldifst v1.8.0 ab5bdd013bdf13921e6aeee77db5722ebf9955fb "$ROOT/kaldifst"
          clone_tag_exact csukuangfj/openfst v1.8.5-2026-07-09 f702a6317d600ac953fdbb4978674c3a28b6115c "$ROOT/openfst"
          clone_tag_exact pkufool/simple-sentencepiece v0.7 62dd423df1d51da5ea06f1c3a046fc04f01b4f39 "$ROOT/simple-sentencepiece"
          clone_tag_exact nlohmann/json v3.12.0 55f93686c01528224f448c19128836e7df245f72 "$ROOT/json"
          fetch_sha_exact csukuangfj/espeak-ng ed530aa113046142eb5115cf2fc9157854d0ffe1 "$ROOT/espeak-ng"
          fetch_sha_exact csukuangfj/piper-phonemize f3ff95afc03640bc1399e113e83361192a2fafb4 "$ROOT/piper-phonemize"
          for d in kaldi-native-fbank kissfft kaldi-decoder kaldifst openfst simple-sentencepiece json espeak-ng piper-phonemize; do
            printf '%s %s\n' "$d" "$(git -C "$ROOT/$d" rev-parse HEAD)"
          done | tee m02537-dependency-locks.txt

      - name: Build sherpa-onnx WASM VITS TTS
        shell: bash
        run: |
          set -euo pipefail
          source .m02537-emsdk/emsdk_env.sh
          EMSCRIPTEN="$GITHUB_WORKSPACE/.m02537-emsdk/upstream/emscripten"
          SRC="$GITHUB_WORKSPACE/.m02537-sherpa"
          DEPS="$GITHUB_WORKSPACE/.m02537-deps"
          BUILD="$SRC/build-wasm-simd-tts"
          mkdir -p "$BUILD"; cd "$BUILD"
          cmake \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$EMSCRIPTEN/cmake/Modules/Platform/Emscripten.cmake" \
            -DSHERPA_ONNX_ENABLE_PYTHON=OFF \
            -DSHERPA_ONNX_ENABLE_TESTS=OFF \
            -DSHERPA_ONNX_ENABLE_CHECK=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_JNI=OFF \
            -DSHERPA_ONNX_ENABLE_C_API=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_GPU=OFF \
            -DSHERPA_ONNX_ENABLE_WASM=ON \
            -DSHERPA_ONNX_ENABLE_WASM_TTS=ON \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF \
            -DSHERPA_ONNX_LINK_LIBSTDCPP_STATICALLY=OFF \
            -DFETCHCONTENT_SOURCE_DIR_KALDI_NATIVE_FBANK="$DEPS/kaldi-native-fbank" \
            -DFETCHCONTENT_SOURCE_DIR_KISSFFT="$DEPS/kissfft" \
            -DFETCHCONTENT_SOURCE_DIR_KALDI_DECODER="$DEPS/kaldi-decoder" \
            -DFETCHCONTENT_SOURCE_DIR_KALDIFST="$DEPS/kaldifst" \
            -DFETCHCONTENT_SOURCE_DIR_OPENFST="$DEPS/openfst" \
            -DFETCHCONTENT_SOURCE_DIR_SIMPLE-SENTENCEPIECE="$DEPS/simple-sentencepiece" \
            -DFETCHCONTENT_SOURCE_DIR_JSON="$DEPS/json" \
            -DFETCHCONTENT_SOURCE_DIR_ESPEAK_NG="$DEPS/espeak-ng" \
            -DFETCHCONTENT_SOURCE_DIR_PIPER_PHONEMIZE="$DEPS/piper-phonemize" \
            "$SRC"
          cmake --build . --parallel 2
          cmake --install .
          cd "$GITHUB_WORKSPACE"
          OUT='.m02537-sherpa/build-wasm-simd-tts/install/bin/wasm/tts'
          test -s "$OUT/sherpa-onnx-wasm-main-tts.js"
          test -s "$OUT/sherpa-onnx-wasm-main-tts.wasm"
          test -s "$OUT/sherpa-onnx-wasm-main-tts.data"
          test -s "$OUT/sherpa-onnx-tts.worker.js"
          du -sk "$OUT" | tee m02537-runtime-kib.txt
          find "$OUT" -maxdepth 1 -type f -print0 | sort -z | xargs -0 shasum -a 256 | tee m02537-runtime-sha256.txt

      - name: Package exact benchmark substrate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m02537-bundle/provenance
          cp -R .m02537-sherpa/build-wasm-simd-tts/install/bin/wasm/tts/. m02537-bundle/
          cp m02537-*.txt m02537-catalog.json m02537-bundle/provenance/
          find m02537-bundle -maxdepth 2 -type f -printf '%P %s\n' | sort | tee m02537-bundle/provenance/file-sizes.txt

      - name: Upload built VITS WASM substrate
        uses: actions/upload-artifact@v4
        with:
          name: m02537-sherpa-vits-substrate-${{ github.sha }}
          path: m02537-bundle
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

  safari26:
    needs: build_wasm
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple Safari substrate
        shell: bash
        run: |
          set -euo pipefail
          sw_vers | tee m02537-sw-vers.txt
          /usr/bin/safaridriver --version | tee m02537-safaridriver-version.txt
          arch="$(/usr/bin/arch)"; echo "$arch" | tee m02537-arch.txt; test "$arch" = arm64

      - name: Download exact built VITS substrate
        uses: actions/download-artifact@v4
        with:
          name: m02537-sherpa-vits-substrate-${{ github.sha }}
          path: m02537-bundle

      - name: Create explicit voice-catalog benchmark page
        shell: bash
        run: |
          set -euo pipefail
          cat > m02537-bundle/bench.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-37 voice catalog</title><script>
          (()=>{
            const start=performance.now();
            const catalog=[['local-1',0],['local-2',180],['local-3',360],['local-4',540],['local-5',720],['local-6',903]];
            const r={success:false,architecture:'sherpa-onnx-v1.13.5-vits-piper-wasm-worker',backend:'wasm-simd-worker',model:'vits-piper-en_US-libritts_r-medium',speed:1,legacyKokoroAlias:false,catalog:Object.fromEntries(catalog),generations:[],voiceGenerations:[],userAgent:navigator.userAgent,crossOriginIsolated:self.crossOriginIsolated===true,speechSynthesisTouched:false};
            window.__benchStatus='boot';window.__benchResult=null;
            let last=performance.now(),maxDrift=0,ticks=0;const timer=setInterval(()=>{const n=performance.now();maxDrift=Math.max(maxDrift,n-last-100);last=n;ticks++},100);
            const finish=(ok,e)=>{clearInterval(timer);r.success=ok;r.totalMs=Math.round(performance.now()-start);r.eventLoop={maxTickDriftMs:Math.round(Math.max(0,maxDrift)),tickCount:ticks};if(e)r.error={name:String(e.name||'Error'),message:String(e.message||e),stack:String(e.stack||'')};window.__benchStatus=ok?'done':'error';window.__benchResult=r};
            const timeout=(p,ms,l)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(l+' timeout '+ms+'ms')),ms))]);
            const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
            const envelope=a=>{const bins=32,out=[];for(let b=0;b<bins;b++){const s=Math.floor(b*a.length/bins),e=Math.floor((b+1)*a.length/bins);let sum=0,n=0;for(let i=s;i<e;i++){const v=Number(a[i]);if(Number.isFinite(v)){sum+=Math.abs(v);n++}}out.push(n?sum/n:0)}const mx=Math.max(...out,1e-12);return out.map(v=>Math.round(v/mx*10000)/10000)};
            const analyze=async(a,sr,ms,x)=>{let nf=0,finite=0,peak=0,ss=0;for(const raw of a){const v=Number(raw);if(!Number.isFinite(v)){nf++;continue}finite++;peak=Math.max(peak,Math.abs(v));ss+=v*v}const d=sr>0?a.length/sr:0;const bytes=new Uint8Array(a.buffer,a.byteOffset,a.byteLength);const digest=hex(await crypto.subtle.digest('SHA-256',bytes));return {...x,generationMs:Math.round(ms),sampleRate:Number(sr),sampleCount:a.length,durationSec:Math.round(d*1000)/1000,realtimeFactor:d>0?Math.round((ms/1000/d)*1000)/1000:null,finiteCount:finite,nonFiniteCount:nf,peak:Math.round(peak*1e6)/1e6,rms:finite?Math.round(Math.sqrt(ss/finite)*1e6)/1e6:0,sha256:digest,envelope:envelope(a)}};
            const sane=(m,l)=>{if(m.nonFiniteCount||!(m.sampleRate>0&&m.sampleCount>m.sampleRate*.2)||!(m.peak>.0001&&m.rms>.00001)||!(m.durationSec>.2&&m.durationSec<30))throw new Error('bad audio '+l)};
            const envDistance=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])*(v-b[i]),0)/a.length);
            (async()=>{
              const w=new Worker('sherpa-onnx-tts.worker.js');let resolveReady,rejectReady,pending=null;const ready=new Promise((a,b)=>{resolveReady=a;rejectReady=b});
              w.onerror=e=>{const er=new Error('worker '+String(e.message||'error'));if(pending){const p=pending;pending=null;p.reject(er)}else rejectReady(er)};
              w.onmessage=e=>{const d=e.data||{};if(d.type==='sherpa-onnx-tts-ready'){r.readyMs=Math.round(performance.now()-start);r.modelType=Number(d.modelType);r.numSpeakers=Number(d.numSpeakers);resolveReady()}else if(d.type==='error'){const er=new Error(String(d.message||'worker error'));if(pending){const p=pending;pending=null;p.reject(er)}else rejectReady(er)}else if(d.type==='sherpa-onnx-tts-result'&&pending){const p=pending;pending=null;p.resolve(d)}};
              await timeout(ready,240000,'ready');if(r.numSpeakers!==904)throw new Error('expected 904 speakers, got '+r.numSpeakers);
              const gen=async(name,sid,text,phase)=>{const t0=performance.now();const a=await timeout(new Promise((res,rej)=>{if(pending)return rej(new Error('duplicate pending'));pending={resolve:res,reject:rej};w.postMessage({type:'generate',text,sid,speed:1.0})}),180000,phase+' '+name);const m=await analyze(a.samples,a.sampleRate,performance.now()-t0,{voice:name,sid,phase,speed:1});sane(m,name);return m};
              const perfText='Local neural speech benchmark for responsive audio.';
              r.generations.push(await gen('local-1',0,perfText,'first'));r.generations.push(await gen('local-1',0,perfText,'warm-1'));r.generations.push(await gen('local-1',0,perfText,'warm-2'));
              const voiceText='This is a stable local voice catalog validation sentence for FIEZEL.';
              for(const [name,sid] of catalog)r.voiceGenerations.push(await gen(name,sid,voiceText,'catalog'));
              const digests=r.voiceGenerations.map(x=>x.sha256);r.uniqueWaveforms=(new Set(digests)).size===catalog.length;
              const pairs=[];for(let i=0;i<r.voiceGenerations.length;i++)for(let j=i+1;j<r.voiceGenerations.length;j++)pairs.push({a:r.voiceGenerations[i].voice,b:r.voiceGenerations[j].voice,distance:Math.round(envDistance(r.voiceGenerations[i].envelope,r.voiceGenerations[j].envelope)*1e6)/1e6});r.pairwiseEnvelope=pairs;r.minEnvelopeDistance=Math.min(...pairs.map(x=>x.distance));
              const warm=r.generations.slice(1).map(x=>x.generationMs).sort((a,b)=>a-b);r.firstGenerationMs=r.generations[0].generationMs;r.warmMedianMs=Math.round((warm[0]+warm[1])/2);r.worstRealtimeFactor=Math.max(...r.generations.concat(r.voiceGenerations).map(x=>x.realtimeFactor||Infinity));r.performanceClass=(r.warmMedianMs<=2000&&r.worstRealtimeFactor<1)?'SUB_REALTIME_CATALOG_PASS':'PERFORMANCE_REJECT';
              if(!r.uniqueWaveforms)throw new Error('duplicate catalog waveform');if(r.performanceClass!=='SUB_REALTIME_CATALOG_PASS')throw new Error('catalog performance regression');
              w.terminate();finish(true)
            })().catch(e=>finish(false,e));
          })();
          </script>
          HTML

      - name: Start local server and SafariDriver
        shell: bash
        run: |
          set -euo pipefail
          cd m02537-bundle; python3 -u -m http.server 8000 --bind 127.0.0.1 >/tmp/m02537-http.log 2>&1 & cd "$GITHUB_WORKSPACE"
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/bench.html >/dev/null 2>&1 && break; sleep 1; done
          sudo /usr/bin/safaridriver --enable || /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver --port 4444 >/tmp/m02537-safaridriver.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4444/status >/tmp/m02537-status.json 2>/dev/null && break; sleep 1; done
          cat /tmp/m02537-status.json

      - name: Run Safari explicit voice-catalog benchmark
        shell: bash
        run: |
          set -euo pipefail
          sj="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
          sid="$(echo "$sj" | jq -r '.value.sessionId // .sessionId // empty')"; test -n "$sid"
          curl -fsS -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:8000/bench.html"}' "http://127.0.0.1:4444/session/$sid/url" >/dev/null
          result=''
          for i in {1..900}; do
            resp="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return {status:window.__benchStatus||null,result:window.__benchResult||null};","args":[]}' "http://127.0.0.1:4444/session/$sid/execute/sync" 2>/dev/null || true)"
            status="$(echo "$resp" | jq -r '.value.status // empty' 2>/dev/null || true)"
            if [[ "$status" == done || "$status" == error ]]; then result="$(echo "$resp" | jq -c '.value.result')"; break; fi
            sleep 1
          done
          curl -fsS -X DELETE "http://127.0.0.1:4444/session/$sid" >/dev/null || true
          test -n "$result"; echo "$result" | jq . | tee m02537-safari-result.json
          jq -e '.success==true and .legacyKokoroAlias==false and .numSpeakers==904 and .uniqueWaveforms==true and .performanceClass=="SUB_REALTIME_CATALOG_PASS"' m02537-safari-result.json >/dev/null
          jq -e '(.voiceGenerations|length)==6 and ([.voiceGenerations[].nonFiniteCount]|all(.==0))' m02537-safari-result.json >/dev/null
          jq -e '[.voiceGenerations[].rms]|all(.>0.00001)' m02537-safari-result.json >/dev/null
          jq '{readyMs,firstGenerationMs,warmMedianMs,worstRealtimeFactor,performanceClass,numSpeakers,legacyKokoroAlias,catalog,uniqueWaveforms,minEnvelopeDistance,pairwiseEnvelope,eventLoop,voiceGenerations}' m02537-safari-result.json | tee m02537-decision-summary.json

      - name: Upload Safari voice-selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02537-sherpa-vits-voice-selection-${{ github.sha }}
          path: |
            m02537-safari-result.json
            m02537-decision-summary.json
            m02537-sw-vers.txt
            m02537-safaridriver-version.txt
            m02537-arch.txt
            m02537-bundle/provenance
            /tmp/m02537-http.log
            /tmp/m02537-safaridriver.log
          if-no-files-found: warn
          retention-days: 30
