# m025-150 Worker pengantar aset audio FIEZEL.
#
# Binding R2 diberikan lewat konfigurasi ini, bukan lewat access key S3. Itu sebabnya
# repositori ini hanya butuh CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID: tidak ada
# kredensial bucket yang perlu disimpan, dibagikan, atau suatu hari bocor.
name = "fiezel-audio"
main = "fiezel-audio-worker.js"
compatibility_date = "2026-08-24"

# Worker ini sengaja tidak diberi secret apa pun. Tidak ada kunci ElevenLabs di sini karena
# ia memang tidak pernah memproduksi audio - lihat catatan kepala fiezel-audio-worker.js.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "fiezel-audio"

[observability]
enabled = true
