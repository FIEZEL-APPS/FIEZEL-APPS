<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FIEZEL — Studio Panggilan Suara AI & Real-Time Speaking</title>
    <meta
      name="description"
      content="Sub-modul terisolasi FIEZEL AI Voice Call Studio dengan terjemahan real-time, bantuan jawaban pemula, Gemini Live WebSocket (wss://fiezel.my.id/api/live-call) + fallback Turn-by-Turn Audio, serta integrasi Braincore BKT & IRT 3PL."
    />
    <meta property="og:title" content="FIEZEL — Studio Panggilan Suara AI & Real-Time Speaking" />
    <meta
      property="og:description"
      content="Sub-modul terisolasi FIEZEL AI Voice Call Studio dengan terjemahan real-time, bantuan jawaban pemula, Gemini Live WebSocket (wss://fiezel.my.id/api/live-call) + fallback Turn-by-Turn Audio, serta integrasi Braincore BKT & IRT 3PL."
    />
    <link rel="icon" type="image/svg+xml" href="./assets/brand/fiezel-icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://translate.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://api.fiezel.my.id" crossorigin />
    <link rel="dns-prefetch" href="https://translate.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.fiezel.my.id" />
    <link rel="stylesheet" href="./features/voice-studio/dist/voice-studio.css?v=m025-768" />
    <!-- Read-only host runtime config (never modified by Voice Studio) -->
    <script src="./core-config.js?v=m025-768" defer></script>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
        -webkit-overflow-scrolling: auto;
      }
      #fiezel-voice-studio-root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      header,
      .studio-topbar,
      #fiezel-voice-studio-root header {
        padding-top: max(14px, env(safe-area-inset-top, 0px)) !important;
        box-sizing: border-box !important;
      }
    </style>
  </head>
  <body class="bg-[#FFF9EE] text-[#241A11] antialiased h-full w-full overflow-hidden fixed inset-0">
    <div id="fiezel-voice-studio-root"></div>
    <script>
      // PWA Coherent Update Guard: Delegasikan pemeriksaan pembaruan ke cangkang induk
      // (FiezelUpdatePrompt) agar tidak pernah memicu skipWaiting sepihak atau menghapus
      // SHELL_CACHE baru saat Kawan Bicara sedang terbuka di dalam iframe.
      (function () {
        try {
          if (window.top && window.top !== window && window.top.FiezelUpdatePrompt && typeof window.top.FiezelUpdatePrompt.check === 'function') {
            window.top.FiezelUpdatePrompt.check(false);
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" src="./features/voice-studio/dist/voice-studio.js?v=m025-768"></script>
  </body>
</html>
